<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | TrustedRouter</title>
  {% include "_favicon.html" %}
  <link rel="preload" href="/static/homepage/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css?v={{ auth_styles_version() }}">
  <link rel="stylesheet" href="/static/auth.css?v={{ auth_styles_version() }}">
  <link rel="stylesheet" href="/static/charter.css?v={{ auth_styles_version() }}">
</head>
<body class="auth auth-shell">
  <main class="auth-card">
    <a class="brand" href="/">{% include "_brand.html" %}</a>
    <p class="eyebrow">Secure account access</p>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
