<dialog class="social-rewards" id="social-rewards" aria-labelledby="social-rewards-title" aria-describedby="social-rewards-progress" data-rewards-user="{{ user.id }}">
  <div class="social-rewards-head">
    <button class="btn social-rewards-close" type="button" data-rewards-close aria-label="Close social rewards">×</button>
    <h2 id="social-rewards-title" tabindex="-1">Earn extra API credit</h2>
    <p id="social-rewards-progress" class="social-rewards-progress" data-rewards-progress aria-live="polite">Loading rewards…</p>
    <progress data-rewards-meter max="1" value="0" aria-label="Rewards claimed"></progress>
  </div>
  <div class="social-rewards-content">
    <p data-rewards-notice role="status" hidden></p>
    <ul class="social-rewards-list" data-rewards-list></ul>
  </div>
  <div class="social-rewards-foot">
    <details class="social-rewards-terms"><summary>About these rewards</summary>
      <p class="social-rewards-destination" data-rewards-destination></p>
      <p>Use credit on any model. Token estimates use DeepSeek V4 Flash pricing; actual usage varies.</p>
    </details>
    <button class="btn" type="button" data-rewards-close>Skip for now</button>
  </div>
</dialog>
<script defer src="/static/social-rewards.js?v={{ static_version|default('local') }}&amp;flow=early-rewards-v2"></script>
