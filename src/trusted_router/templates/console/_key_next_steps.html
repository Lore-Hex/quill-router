{% from "console/_key_icons.html" import icon %}
<div class="ux-steps">
  <div class="ux-step">
    {{ icon('wallet') }}
    <span class="ux-step-text">{% if credits_available %}<span class="ux-chip{% if credits_empty %} ux-chip-empty{% endif %}" title="Available API credit">{{ credits_available }}</span> credit{% else %}API credit{% endif %}</span>
    <a class="ux-step-action" href="/console/credits">Add credits {{ icon('chevron-right') }}</a>
  </div>
  <div class="ux-step" data-rewards-key-card hidden>
    {{ icon('gift') }}
    <span class="ux-step-text">Social rewards <span class="ux-step-note">optional</span></span>
    <span data-rewards-key-title hidden></span><span data-rewards-key-description hidden></span>
    <button class="ux-step-action" type="button" data-rewards-open data-rewards-api-keys data-rewards-compact hidden><span data-rewards-label>Earn credit</span> {{ icon('chevron-right') }}</button>
  </div>
</div>
