{% from "console/_key_icons.html" import icon %}
<p class="ux-next">
  <span class="ux-next-credit">
    {% if credits_available %}<span class="ux-chip{% if credits_empty %} ux-chip-empty{% endif %}" title="Available API credit">{{ icon('wallet') }}<strong>{{ credits_available }}</strong><span>credit</span></span>{% else %}<span class="ux-next-icon">{{ icon('wallet') }}</span><span>Requests use your API credit.</span>{% endif %}
    <a class="ux-link" href="/console/credits">Add credits {{ icon('arrow') }}</a>
  </span>
  <span class="ux-next-rewards" data-rewards-key-card hidden>
    <span class="ux-next-sep" aria-hidden="true">·</span>
    <span data-rewards-key-title hidden></span><span data-rewards-key-description hidden></span>
    <button class="ux-link" type="button" data-rewards-open data-rewards-api-keys data-rewards-compact hidden>{{ icon('gift') }}<span data-rewards-label>Earn credit on social</span> <span class="ux-next-optional">optional</span></button>
  </span>
</p>
