<dialog id="signinModal" class="signin-modal" aria-labelledby="signinTitle" data-mode="signin">
  <form method="dialog">
    <button class="signin-close" type="submit" aria-label="Close">✕</button>
  </form>
  <div class="dialog-kicker" id="signinKicker">Workspace access</div>
  <h2 id="signinTitle">Sign in</h2>
  <p id="signinCreditNote" class="signin-sub">Choose a sign in method to access your TrustedRouter workspace.</p>
  <div class="signin-providers">
    {% if google_enabled %}
    <a class="signin-btn signin-google" href="/auth/google/login" data-provider="google">
      <span class="signin-logo" aria-hidden="true"><img src="/static/provider-logos/google-g.png" alt="" width="18" height="18"></span> Continue with Google
    </a>
    {% endif %}
    {% if github_enabled %}
    <a class="signin-btn signin-github" href="/auth/github/login" data-provider="github">
      <span class="signin-logo" aria-hidden="true"><img src="/static/provider-logos/github-mark.png" alt="" width="18" height="18"></span> Continue with GitHub
    </a>
    {% endif %}
    <button class="signin-btn signin-metamask" type="button" data-action="metamask-signin">
      <span class="signin-logo" aria-hidden="true"><img src="/static/provider-logos/metamask-fox.svg" alt="" width="19" height="18"></span> Continue with MetaMask
    </button>
    <div id="signinError" class="signup-error" hidden></div>
  </div>
  <p class="signin-switch"><span id="signinSwitchAsk">New to TrustedRouter?</span> <button type="button" class="signin-switch-btn" data-switch-mode="signup">Create an account</button></p>
  <p class="signin-foot">By continuing you agree to the terms of service and privacy policy.</p>
</dialog>
