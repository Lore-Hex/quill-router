# Installed as
# /etc/systemd/system/clickhouse-server.service.d/tr-metadata-block.conf.
#
# clickhouse-server does not start unless the rule that keeps it from the
# instance metadata server is in place. "+" runs the helper as root although
# the service runs as clickhouse. It is a start step of this unit and not a
# unit of its own: a unit this one required would restart the database
# whenever it was restarted.
[Service]
ExecStartPre=+/usr/local/sbin/tr-clickhouse-metadata-block
