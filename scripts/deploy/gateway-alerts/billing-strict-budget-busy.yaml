displayName: "TR Gateway: strict budget busy"
combiner: OR
enabled: true
documentation:
  mimeType: text/markdown
  content: |
    Authorize answered more than two strict-budget-busy 503s in ten minutes,
    or more than five in an hour. Each is the retryable 503 (Retry-After: 1,
    "Strict budget authorization is busy; retry with backoff") the app gives
    when a key with a strict budget cannot get its per-process admission
    slot (trusted_router/strict_budget.py): one strict authorize per key and
    16 strict keys per instance at once, two waiting callers per key and 16
    per instance, and a caller that waits STRICT_ADMISSION_WAIT_SECONDS (one
    second) without a slot, or finds the waiters full, is answered 503.
    Storage is healthy and nothing is held; the app writes
    billing.strict_budget_busy from trusted_router.routes.internal.gateway
    for each one (trustedrouter_gateway_strict_budget_busy_503) and the
    enclave retries it. The enclave makes three attempts, seconds apart, so
    three lines in ten minutes is the least at which a customer's request
    can have failed on this 503 alone, and the ten-minute bound pages there.
    Two or fewer in ten minutes are requests made to wait and then answered
    on a later attempt; the hourly bound limits how long that can go on, at
    more than five in an hour. When the hourly bound is what was crossed,
    the incident stays open until the hour's count is back to five or fewer,
    which can be up to an hour after the last line, and cannot be closed by
    hand before that. Either means a customer's strict key is being
    throttled. "TR Gateway: authorize 503 not lease headroom" sets these
    503s aside, so this is the only page for them. Read the
    billing.strict_budget_busy lines for the workspace ids, and the route's
    billing.authorize_strict_budget_busy lines with the same request ids.
    One workspace points at its own traffic: more concurrent authorizes on
    one strict key than one in flight and two waiting per instance, or
    strict authorizes that each hold the slot long; compare the latency of
    its successful authorizes with Spanner's. Many workspaces at once point
    at Spanner latency, which holds every slot longer, at more than 16
    strict keys authorizing on one instance, or at a recent deploy. Do not
    lengthen the wait, raise the limits or change a key's strict mode to
    quiet the alert. Runbook: docs/spanner-reliability.md.
conditions:
  # The shape of billing-rebalance-busy.yaml, on this counter: one condition
  # with two bounds, because Cloud Monitoring allows a policy one PromQL
  # condition and no other beside it.
  #
  # Counts over a window, not rates per minute. The first side: one request
  # writes at most three lines, within seconds (the enclave makes three
  # attempts), so three in ten minutes is the least at which a customer's
  # request can have failed on this 503 alone. Before the line existed each
  # one paged as an unmarked authorize 503; now it pages here only from the
  # third. The second side: up to two every ten minutes pass the first,
  # twelve an hour; more than five in an hour takes at least three separate
  # occurrences within the hour.
  #
  # Each side returns its sample only when its count is over its bound, and
  # "or" returns the first side's sample, else the second's: one series at
  # most, so one incident. No "or vector(0)": with no lines neither side has
  # a series and there is nothing to page.
  - displayName: "More than two strict-budget-busy 503s in ten minutes, or more than five in an hour"
    conditionPrometheusQueryLanguage:
      query: |
        (sum(increase(logging_googleapis_com:user_trustedrouter_gateway_strict_budget_busy_503{monitored_resource="cloud_run_revision"}[10m])) > 2.5)
        or
        (sum(increase(logging_googleapis_com:user_trustedrouter_gateway_strict_budget_busy_503{monitored_resource="cloud_run_revision"}[1h])) > 5.5)
      duration: 0s
      evaluationInterval: 60s
alertStrategy:
  autoClose: 1800s
  notificationPrompts:
    - OPENED
    - CLOSED
