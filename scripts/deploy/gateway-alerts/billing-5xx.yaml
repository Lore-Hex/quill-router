displayName: "TR Gateway: billing path 5xx"
combiner: OR
enabled: true
documentation:
  mimeType: text/markdown
  content: |
    A customer-facing authorize, settle, or refund call returned an unexpected
    5xx. Treat this as immediate router-core impact. Intentional 501
    compatibility rejections are excluded because they happen before a billing
    hold and do not indicate storage or settlement failure. Authorize 503s are
    excluded here only because "TR Gateway: authorize 503 not lease headroom"
    pages on every one the app did not mark as designed and retryable: lease
    headroom (the 503 TR_FASTPATH_LEASE_HEADROOM_503 answers when a
    workspace's credits are held by fast-path leases), rebalance busy (the
    503 for credit spread across shards while the workspace's rebalance
    cooldown is held, which "TR Gateway: credit rebalance busy" bounds),
    strict budget busy (the 503 for a strict-budget key that cannot get its
    per-process admission slot, which "TR Gateway: strict budget busy"
    bounds) or headroom raced (the 503 for spread credit that the
    workspace's own concurrent requests took from every bounded repair,
    which "TR Gateway: credit headroom raced" bounds); the authorize-503
    policy must exist before this filter is
    applied. Settle 503s are excluded here for the same reason: "TR
    Gateway: settle 503 not marked retryable" pages on every one the app
    did not mark as designed and retryable with its async_settle.unavailable
    line (finish_unconfirmed, transient_store_error and the other reasons
    the snapshot settle answers 503 with Retry-After, which the gateway
    retries on the same settlement identity until the charge lands), and
    "TR Gateway: settle unavailable surge" bounds the marked ones; both must
    exist before this filter is applied. Refund 503s and every settle 5xx
    other than a 503 still page here at once. Inspect Cloud Run request logs, Spanner transaction contention,
    and billing invariants. Do not silence the alert merely because Spanner is
    otherwise healthy. Runbook: docs/spanner-reliability.md.
conditions:
  - displayName: "Any internal gateway billing 5xx"
    conditionMatchedLog:
      filter: 'resource.type = "cloud_run_revision" AND resource.labels.service_name = "trusted-router" AND httpRequest.status >= 500 AND httpRequest.status < 600 AND httpRequest.status != 501 AND httpRequest.requestUrl =~ "/internal/gateway/(authorize|settle|refund)([?].*)?$" AND NOT (httpRequest.status = 503 AND httpRequest.requestUrl =~ "/internal/gateway/settle([?].*)?$") AND NOT (httpRequest.status = 503 AND httpRequest.requestUrl =~ "/internal/gateway/authorize([?].*)?$")'
alertStrategy:
  notificationRateLimit:
    period: 1800s
  autoClose: 1800s
