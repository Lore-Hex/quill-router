displayName: "TR Gateway: billing path 5xx"
combiner: OR
enabled: true
documentation:
  mimeType: text/markdown
  content: |
    A customer-facing authorize, settle, or refund call returned an unexpected
    5xx. Treat this as immediate router-core impact. Intentional 501
    compatibility rejections are excluded because they happen before a billing
    hold and do not indicate storage or settlement failure. Authorize 503s are
    excluded here only because "TR Gateway: authorize 503 not lease headroom"
    pages on every one the app did not mark as lease headroom (the retryable
    503 TR_FASTPATH_LEASE_HEADROOM_503 answers when a workspace's credits are
    held by fast-path leases); that policy must exist before this filter is
    applied. Inspect Cloud Run request logs, Spanner transaction contention,
    and billing invariants. Do not silence the alert merely because Spanner is
    otherwise healthy. Runbook: docs/spanner-reliability.md.
conditions:
  - displayName: "Any internal gateway billing 5xx"
    conditionMatchedLog:
      filter: 'resource.type = "cloud_run_revision" AND resource.labels.service_name = "trusted-router" AND httpRequest.status >= 500 AND httpRequest.status < 600 AND httpRequest.status != 501 AND httpRequest.requestUrl =~ "/internal/gateway/(authorize|settle|refund)([?].*)?$" AND NOT (httpRequest.status = 503 AND httpRequest.requestUrl =~ "/internal/gateway/authorize([?].*)?$")'
alertStrategy:
  notificationRateLimit:
    period: 1800s
  autoClose: 1800s
