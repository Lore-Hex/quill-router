displayName: "TR Spanner: API failures"
combiner: OR
enabled: true
documentation:
  mimeType: text/markdown
  content: |
    Production Spanner returned non-expected API failures. ABORTED retries and
    intentional ALREADY_EXISTS responses are tracked separately. Inspect the
    status and method labels before changing capacity. Runbook:
    docs/spanner-reliability.md.
conditions:
  - displayName: "Unexpected API failures exceed one per minute for 10 minutes"
    conditionThreshold:
      # Ten minutes, not five: a Cloud Run revision replacement cancels the old
      # instances' in-flight transactions. On 2026-11-10 the settle-drain and
      # public services rolled at 07:01:37-07:01:56 and Commit/Rollback/stream
      # failures ran 07:02-07:04 (8, 31, 3 a minute), which opened this policy
      # at 07:11. A burst of three minutes keeps a 300-second rate above the
      # threshold for at most seven, so it no longer pages. A sustained failure
      # still does: the 2026-11-11 table scans failed reads at 40-101 a minute
      # from 03:27 to 03:37, above threshold for about fifteen minutes. The
      # threshold itself is unchanged.
      # Spanner currently emits both title-case and lowercase retry statuses.
      # Exclude every observed spelling so expected transaction retries do not
      # page as API failures.
      filter: 'resource.type = "spanner_instance" AND resource.labels.instance_id = "trusted-router-nam6" AND metric.type = "spanner.googleapis.com/api/api_request_count" AND metric.labels.status != "OK" AND metric.labels.status != "Aborted" AND metric.labels.status != "aborted" AND metric.labels.status != "AlreadyExists" AND metric.labels.status != "already_exists"'
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0.016666667
      duration: 600s
      trigger:
        count: 1
alertStrategy:
  autoClose: 86400s
  notificationPrompts:
    - OPENED
    - CLOSED
