name: setup-terraform
description: >-
  Install a pinned Terraform release from releases.hashicorp.com, verified
  against a SHA-256 checksum recorded here. Replaces hashicorp/setup-terraform
  (which installed the latest release behind a stdout-capturing wrapper; no
  step here reads the wrapper's outputs).
inputs:
  terraform_version:
    description: Terraform release to install. It must have a checksum below.
    default: "1.17.2"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TF_VERSION: ${{ inputs.terraform_version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64) arch=arm64 ;;
          *) echo "::error::setup-terraform: unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        # Checksums from terraform_<version>_SHA256SUMS.
        case "$TF_VERSION/$arch" in
          1.17.2/amd64) sha256=e6f16b2f0b137ee5729caa8c4e79a3bae4ee261acd198a1fcfa8584a6296605b ;;
          1.17.2/arm64) sha256=858e08c181a76b6b223e8c767a8e983922eebe2d062db949a2de66ce040c368c ;;
          *) echo "::error::setup-terraform: no pinned checksum for Terraform ${TF_VERSION} on ${arch}; add one to this action"; exit 1 ;;
        esac
        dest="${RUNNER_TEMP}/setup-terraform/${TF_VERSION}"
        archive="${RUNNER_TEMP}/terraform_${TF_VERSION}_linux_${arch}.zip"
        curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$archive" \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_${arch}.zip"
        echo "${sha256}  ${archive}" | sha256sum --check --strict -
        mkdir -p "$dest"
        unzip -o -q "$archive" terraform -d "$dest"
        rm -f "$archive"
        "$dest/terraform" version
        echo "$dest" >> "$GITHUB_PATH"
