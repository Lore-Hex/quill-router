name: setup-bun
description: >-
  Install a pinned Bun release from its GitHub release, verified against a
  SHA-256 checksum recorded here. Replaces oven-sh/setup-bun.
inputs:
  bun-version:
    description: Bun release to install. It must have a checksum below.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) target=linux-x64 ;;
          aarch64) target=linux-aarch64 ;;
          *) echo "::error::setup-bun: unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        # Checksums from the release's SHASUMS256.txt.
        case "$BUN_VERSION/$target" in
          1.3.14/linux-x64) sha256=951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f ;;
          1.3.14/linux-aarch64) sha256=a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b ;;
          *) echo "::error::setup-bun: no pinned checksum for Bun ${BUN_VERSION} on ${target}; add one to this action"; exit 1 ;;
        esac
        dest="${RUNNER_TEMP}/setup-bun/${BUN_VERSION}"
        archive="${RUNNER_TEMP}/bun-${target}.zip"
        curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$archive" \
          "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${target}.zip"
        echo "${sha256}  ${archive}" | sha256sum --check --strict -
        mkdir -p "$dest"
        unzip -o -q -j "$archive" "bun-${target}/bun" -d "$dest"
        rm -f "$archive"
        ln -sf bun "$dest/bunx"
        installed="$("$dest/bun" --version)"
        [ "$installed" = "$BUN_VERSION" ] || { echo "::error::setup-bun: installed bun reports ${installed}, expected ${BUN_VERSION}"; exit 1; }
        echo "$dest" >> "$GITHUB_PATH"
        echo "Installed bun ${installed}"
