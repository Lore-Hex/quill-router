name: Test map

# The per-test footprint map: which functions each test runs and which files
# it reads (scripts/ci/testmap_recorder.py), for the test selection that
# ci.yml's pull request runs compute in shadow (scripts/ci/testmap.py).
#
# Its own workflow, under its own name, so a test that breaks only under the
# recorder can never turn ci.yml red or hold a deploy: deploy.yml,
# deploy-production.yml, deploy-azure-control-plane.yml, deploy-growth-sync.yml,
# refresh-prices.yml, release_train.py, superseded_deploy.py,
# aws_ecs_control_plane.sh and settle_drain_worker.sh read ci.yml's runs
# (`gh run list --workflow ci.yml`), the fast path release follows the
# workflow named "CI", and main's required checks are lint, test (1..3) and
# CI. No job here carries one of those names. A red run here only means no
# new map: pull requests keep using the newest valid one, or the full suite.
#
# Every three hours, recording only when main's head differs from the newest
# valid map's commit in something the map is built from (testmap.py's
# MAP_INPUTS); a dispatch can force a run. A running recording is never
# cancelled (cancel-in-progress is off: a cancelled run leaves no map). GitHub
# keeps at most one run pending per concurrency group and replaces a pending
# run with a newer one rather than queueing it; the newer run records main's
# newer head, so the replaced one loses nothing. The shards run ci.yml's test
# selection with the same services, without coverage, which the recorder does
# not need.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "record even when nothing the map is built from changed since the newest map"
        type: boolean
        default: false

concurrency:
  group: testmap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: map inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the newest map's run and artifact
    outputs:
      record: ${{ steps.decide.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - name: Did anything the map is built from change since the newest map?
        id: decide
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: python3 scripts/ci/testmap.py needed --force "${FORCE:-false}" | tee -a "$GITHUB_OUTPUT"

  record:
    name: record
    needs: changes
    if: needs.changes.outputs.record == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TEST_SHARDS: "8"
      TR_CONFORMANCE_POSTGRES_DSN: postgresql://postgres:tr@localhost:5432/postgres
      TR_TEST_POSTGRES_SUPERUSER_DSN: postgresql://postgres:tr@localhost:5432/postgres
      TR_CONFORMANCE_SPANNER_PG_DSN: postgresql://localhost:5434/tr-conformance
    services:
      # ci.yml's test services, pinned alike: the conformance tests record
      # what they run against both servers.
      postgres:
        image: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: tr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      spanner-pg:
        image: gcr.io/cloud-spanner-pg-adapter/pgadapter-emulator:latest
        ports:
          - 5434:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@b4a639784c65566218e0018ad1552d5fa1d85c60 # main 2026-11-23
        timeout-minutes: 5
      - name: Sync
        timeout-minutes: 5
        run: uv sync --frozen
      - name: Check out enclave source for the mandatory Sentry guard
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Lore-Hex/quill-cloud-proxy
          ref: main
          path: .security/quill-cloud-proxy
          sparse-checkout: enclave-go
          persist-credentials: false
      - name: Require and inspect enclave source
        timeout-minutes: 3
        run: |
          echo "TR_ENCLAVE_SOURCE_ROOT=$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" >> "$GITHUB_ENV"
          git -C .security/quill-cloud-proxy rev-parse HEAD
          TR_ENCLAVE_SOURCE_ROOT="$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" uv run python -m scripts.check_enclave_sentry
      # TR_TESTMAP_OUT turns the recorder on (tests/conftest.py loads it only
      # then), outside the workspace: the deploy-script tests copy the
      # repository. The split weights are read, not rewritten.
      - name: Record each test's footprint
        timeout-minutes: 30
        env:
          TR_TESTMAP_OUT: ${{ runner.temp }}/testmap-raw
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m "not provider_health and not proof_oracle"
          --splits ${{ env.TEST_SHARDS }} --group ${{ matrix.shard }}
          --splitting-algorithm least_duration --durations-path=.test_durations
      - name: Compact this shard's footprints
        timeout-minutes: 5
        run: >-
          python3 scripts/ci/testmap.py compact "${RUNNER_TEMP}/testmap-raw"
          --shard ${{ matrix.shard }} --out testmap-${{ matrix.shard }}.json.gz
      - name: Upload this shard's footprints
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testmap-fragment-${{ matrix.shard }}
          path: testmap-${{ matrix.shard }}.json.gz
          retention-days: 1

  # Only from all eight shards of a run whose shards all passed: merge refuses
  # a missing, repeated or invalid fragment.
  merge:
    name: merge map
    needs: record
    if: needs.record.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - name: Collect every shard's footprints
        timeout-minutes: 3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: testmap-fragment-*
          path: testmap-fragments
      - name: Merge the map
        timeout-minutes: 5
        run: >-
          python3 scripts/ci/testmap.py merge testmap-fragments --shards 8
          --commit "${GITHUB_SHA}" --ref "${GITHUB_REF}" --event "${GITHUB_EVENT_NAME}"
          --run-id "${GITHUB_RUN_ID}" --out testmap.json.gz
      - name: Upload the map
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testmap
          path: testmap.json.gz
          retention-days: 14

  # Every file the heavy lane's tests ran or opened in this map must be a
  # change that runs ci.yml's test-heavy (commit_scope.py's run_heavy), at
  # this commit: the lane's drift check. A job of its own, after the upload:
  # when it fails, the run is red but the map stays usable (testmap.py's
  # run_problem accepts a run whose only failed job is this one and whose
  # merge job passed). A failure opens the heavy lane's scope issue, or
  # comments on the open one, and the next pass closes it, so the drift is
  # seen without anyone watching this workflow. Main only: a map recorded
  # on another branch (a dispatch that validates a change to the recorder)
  # is no map the selection uses, and nothing about it needs an issue.
  heavy-scope:
    name: heavy lane scope
    needs: merge
    if: needs.merge.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # issues: write for the two issue steps, the only ones given the token.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          # The job token carries issues: write; keep it out of git config,
          # where every later step (the check included) could read it.
          persist-credentials: false
      - name: Download the map
        timeout-minutes: 3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testmap
      - name: The heavy lane's scope covers what its tests ran
        id: check
        timeout-minutes: 5
        run: python3 scripts/ci/testmap.py heavy --map testmap.json.gz --report heavy-scope.md
      - name: Open or update the heavy lane's scope issue
        # Also when the check never ran (the map download failed): a check
        # that cannot run is a failure, never silence.
        if: failure() && steps.check.outcome != 'success'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/testmap.py heavy-issue --outcome failure --report heavy-scope.md
      - name: Close the heavy lane's scope issue
        if: success()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/testmap.py heavy-issue --outcome success
