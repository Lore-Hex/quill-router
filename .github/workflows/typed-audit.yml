name: Typed Billing Invariant Audit

on:
  schedule:
    - cron: "43 11 * * *" # 11:43 UTC daily, away from top-of-hour deploy/cron load.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for google-github-actions/auth (Workload Identity Federation)

jobs:
  typed-billing-invariant-audit:
    name: typed-billing-invariant-audit
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to GCP
        uses: Lore-Hex/quill-router/.github/actions/gcp-auth@PINSHA # main 2026-11-13
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: Lore-Hex/quill-router/.github/actions/setup-gcloud@PINSHA # main 2026-11-13
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@PINSHA # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Run typed billing audit
        run: PYTHONPATH=src uv run python scripts/audit_typed_counters.py

  spanner-schema-drift:
    name: spanner-schema-drift
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator@sha256:c6f3402f2599684f295a0fdefb6fbbbfb18a0e43e309ff5456ccb452a4570a79
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to GCP
        uses: Lore-Hex/quill-router/.github/actions/gcp-auth@PINSHA # main 2026-11-13
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: Lore-Hex/quill-router/.github/actions/setup-gcloud@PINSHA # main 2026-11-13
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@PINSHA # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Run production schema audit
        run: uv run python -m scripts.audit_spanner_schema --emulator-host 127.0.0.1:9010
