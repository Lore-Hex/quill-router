name: Release coordinator operations

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, configure-retention, recover]
        default: status
        required: true
      cloud:
        type: choice
        options: [gcp, aws, azure]
        default: gcp
      operation_id:
        type: string
        default: ""
      confirmation:
        description: "APPLY only after the documented migration or recovery checks"
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: release-coordinator-operations
  cancel-in-progress: false

jobs:
  operate:
    if: github.repository == 'Lore-Hex/quill-router' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect or reconcile only the deployment journal
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          CLOUD: ${{ inputs.cloud }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            status)
              python3 scripts/deploy/cloud_rollout.py status ;;
            configure-retention)
              [ "$CONFIRMATION" = APPLY ] || exit 1
              gcloud storage buckets update gs://tr-deploy-mutex-quill-cloud-proxy --clear-lifecycle
              python3 -c 'from scripts.deploy.cloud_rollout import GCSStore; GCSStore().verify_retention()' ;;
            recover)
              [ "$CONFIRMATION" = APPLY ] || exit 1
              python3 scripts/deploy/cloud_rollout.py recover --cloud "$CLOUD" --operation "$OPERATION_ID" ;;
            *) exit 1 ;;
          esac
