name: Dependency scan

# SOC 2 CC7.1 — automated dependency vulnerability scanning (ISMS 12-…md action,
# due 2026-10-31). OSV-Scanner reads every lockfile/manifest in the repo
# (uv.lock, requirements*.txt, package-lock.json, go.mod).
#
#  * push to main + daily schedule: full scan, results uploaded to GitHub code
#    scanning (Security tab), where each finding is a tracked, triageable alert.
#    Does not fail: the existing backlog is worked down through those alerts.
#  * pull_request: diff scan against the base branch; FAILS only when the PR
#    introduces a vulnerability that main does not already have.
#
# Inlined from google/osv-scanner-action's reusable workflows (v2.7.0) as steps,
# because repository policy (tests/test_spanner_schema_audit_workflow.py) only
# admits local reusable workflows.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One scan per branch or pull request; a newer push cancels the scan of the
# commit it supersedes (same reason as ci.yml: superseded runs starved the
# 2026-10-20 queue). Main keeps one scan per commit, as ci.yml does.
concurrency:
  group: dependency-scan-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan-full:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --include-git-root
            -r
            ./
      # Non-zero exit means "vulnerabilities found" (tracked as alerts) or "scan
      # failed"; only the second leaves no results file, and must fail the job.
      - name: Check that the scan completed
        run: test -s results.sarif || { echo "::error::OSV-Scanner wrote no results"; exit 1; }
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checkout target branch
        run: git checkout "$GITHUB_BASE_REF"
      - name: Run scanner on existing code
        id: scan-old
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --include-git-root
            -r
            ./
      - name: Checkout current branch
        run: git checkout -f "$GITHUB_SHA"
      - name: Run scanner on new code
        id: scan-new
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --include-git-root
            -r
            ./
      # A failed scan writes no file, and the reporter reads a missing --new file
      # as "no new vulnerabilities"; refuse to compare incomplete scans.
      - name: Check that both scans completed
        run: |
          status=0
          [ -s old-results.json ] || { echo "::error::scan of the target branch wrote no results"; status=1; }
          [ -s new-results.json ] || { echo "::error::scan of this branch wrote no results"; status=1; }
          exit "$status"
      - name: Report new vulnerabilities
        uses: google/osv-scanner-action/osv-reporter-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true
      - name: Upload to code-scanning
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
