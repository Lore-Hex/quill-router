name: Prod Smoke

on:
  # Run after the control-plane deploy completes. Running directly on push can
  # race the deploy workflow and test the previous production revision against
  # new smoke expectations.
  workflow_run:
    workflows: ["Deploy TR control plane"]
    types: [completed]
  # Periodic uptime + drift check between deploys.
  schedule:
    - cron: "*/30 * * * *"
  # Manual trigger for ad-hoc runs from the Actions UI.
  workflow_dispatch:

jobs:
  smoke:
    name: tests/test_smoke_prod.py
    runs-on: ubuntu-latest
    # Don't fail PRs on prod issues — only main + scheduled + manual runs
    # touch the live service. PRs run the offline suite via ci.yml.
    # workflow_run matches the triggering workflow by name, and a fork pull
    # request can add a workflow with any name, so a workflow_run trigger
    # counts only when it came from this repository's own push or dispatch
    # deploy (tests/test_workflow_run_guard.py).
    if: >-
      github.repository == 'Lore-Hex/quill-router'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@bada0072c1cdc70a095bee380e6a6a7fdfb2cf8e # main 2026-11-23
      - name: Sync
        run: uv sync --frozen
      - name: Smoke against https://trustedrouter.com
        env:
          TR_PROD_SMOKE: "1"
          # Signing secret for the webhook drift guard
          # (test_stripe_webhook_accepts_validly_signed_event). Must match
          # Secret Manager trustedrouter-stripe-webhook-secret and the live
          # Stripe endpoint. The test skips when unset, so a missing repo
          # secret degrades to "no drift guard", not a red build.
          TR_STRIPE_WEBHOOK_SECRET: ${{ secrets.TR_STRIPE_WEBHOOK_SECRET }}
        # Show every test by name so deploy regressions are obvious in
        # the workflow log without clicking into the failed step.
        run: uv run pytest tests/test_smoke_prod.py -v --tb=short
