# Auto-deploy the TrustedRouter control plane to Cloud Run on push to main.
#
# Trust posture: this is the *control plane* — billing, metadata, routing.
# It is NOT the attested-enclave trust boundary; that's the separate
# `deploy-enclave-gcp.yml` workflow in the quill-cloud-proxy repo.
# Failures here surface as "site is down" or "API key expired"; they do
# not affect prompt confidentiality, which the enclave guarantees.
#
# Auth: Workload Identity Federation. No JSON keys in GitHub Secrets.
# A short-lived OIDC token from GitHub is exchanged for an
# impersonation token on tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com,
# scoped to this repo + main branch only.
#
# Trigger: deploys ONLY when files that affect the running service change.
# Docs / README / unrelated config edits do not trigger a rollout.
#
# CI gate: the first step blocks until ci.yml concludes SUCCESS for the
# same SHA. Push-to-main fires ci.yml and deploy.yml in parallel; without
# the gate a red commit could finish rolling out to every region while
# its tests were still failing. workflow_dispatch hotfix=true skips the
# gate (same rationale as skipping the synthetic watchdog).

name: Deploy TR control plane
run-name: ${{ inputs.track_main == true && format('Deploy latest main {0}', github.sha) || format('Deploy revision {0}', github.sha) }}

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/deploy/**"
      - "scripts/entrypoint.sh"
      - "frontend/src/**"
      - "Dockerfile"
      - ".gcloudignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      track_main:
        description: "Follow main: allow a newer prepared green release to supersede this snapshot"
        type: boolean
        default: false
      hotfix:
        description: "Skip synthetic-watchdog + CI-green gating (ship aggressively when prod is sick)"
        type: boolean
        default: false

# Build and validate outside the serialized production workflow.

permissions:
  id-token: write   # for Workload Identity Federation
  contents: read
  actions: read     # for the CI-green gate (gh run list)

jobs:
  # A push that deploys supersedes the deploys of older pushes that are still
  # preparing: each would ship a subset of this commit, one rollout before this
  # one ships it all. While such a deploy's CI run has not started a test
  # shard, this cancels the deploy and then the CI run, so the organization's
  # runners (60 at once; a push's CI run takes 27) go to this commit's run. A deploy
  # in the production queue or rolling out, a CI run already testing, and a
  # non-deploying commit's run are left alone. After the last delivered
  # rollout, it cancels for four hours from its first cancellation and then
  # stops until a rollout is delivered, so a stream of pushes cannot keep main
  # undeployed. If the superseding push then goes red, re-run the cancelled
  # CI run and then its deploy (a hotfix dispatch ships main's head without
  # its CI gate). scripts/deploy/superseded_deploy.py --mode cancel-older says
  # why for each run. No job needs this one, and it must not fail the run:
  # reconcile_cloud_releases.py reads a failed run as an undelivered release.
  # continue-on-error covers a failed step, checkout or runner, and each step's
  # own timeout turns a hang into a step failure before the job's timeout.
  cancel-superseded:
    if: github.repository == 'Lore-Hex/quill-router' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      actions: write   # to cancel the superseded runs
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          sparse-checkout: scripts/deploy/superseded_deploy.py
          sparse-checkout-cone-mode: false
      - name: Cancel the older pushes' preparing deploys and their untested CI
        timeout-minutes: 10
        run: >-
          python3 scripts/deploy/superseded_deploy.py --mode cancel-older
          --repo "${GITHUB_REPOSITORY}" --base "${GITHUB_SHA}"
          || echo "::warning::cancel-older exited non-zero; nothing was cancelled after that point"

  gate-on-ci:
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-latest
    # The poll below waits up to 330 min for a CI run that exists; GitHub
    # caps a hosted job at 360. Preparation does not hold the production queue
    # or cloud lease; only green, fully built releases enter that queue.
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Gate on CI green (same commit)
        # ci.yml and deploy.yml both trigger on push to main and used to
        # race: a bad merge could finish rolling out to every region while
        # CI was still failing on the very same SHA (main carried three
        # latent CI failures this way in early June). This serializes them
        # WITHOUT giving up the paths: filter above — a workflow_run
        # trigger would fire on docs-only pushes too. Polls the ci.yml run
        # for $GITHUB_SHA; refuses to deploy unless it concluded success.
        run: |
          set -euo pipefail
          if [ "${{ inputs.track_main }}" = "true" ] && [ "${{ inputs.hotfix }}" = "true" ]; then
            echo "::error::track_main releases require all normal CI and rollout gates; hotfix is incompatible."
            exit 1
          fi
          if [ "${{ inputs.hotfix }}" = "true" ]; then
            echo "::warning::HOTFIX MODE — skipping the CI-green gate."
            exit 0
          fi
          echo "waiting for CI (ci.yml) on ${GITHUB_SHA}"
          # CI normally takes ~15 min, but a saturated runner queue has held it
          # for hours (2026-10-19: four deploys in a row timed out here while
          # their CI was still queued or running, then went green). So: 45 min
          # to find the CI run at all, then wait as long as it is queued or
          # running, up to 330 min. A red or cancelled CI still refuses at once.
          started=$(date +%s)
          find_deadline=$(( started + 2700 ))
          run_deadline=$(( started + 19800 ))
          seen=0
          while true; do
            run_json=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${GITHUB_SHA}" \
              --json databaseId,status,conclusion \
              --jq '.[0]' || true)
            if [ -n "${run_json}" ] && [ "${run_json}" != "null" ]; then
              seen=1
              status=$(jq -r '.status' <<<"${run_json}")
              conclusion=$(jq -r '.conclusion' <<<"${run_json}")
              echo "  ci run $(jq -r '.databaseId' <<<"${run_json}"): status=${status} conclusion=${conclusion:-<pending>}"
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "success" ]; then
                  echo "CI is green — proceeding with the rollout."
                  exit 0
                fi
                echo "CI concluded '${conclusion}' for ${GITHUB_SHA} — refusing to deploy a red commit."
                echo "Fix main, or use workflow_dispatch hotfix=true for emergencies."
                exit 1
              fi
            elif [ "${seen}" = 1 ]; then
              # The run exists; an empty or failed lookup is a transient API error.
              echo "  CI run lookup failed for ${GITHUB_SHA}; retrying"
            else
              echo "  no CI run found yet for ${GITHUB_SHA} (queueing?)"
              if [ "$(date +%s)" -ge "${find_deadline}" ]; then
                echo "timed out after 45 min: no CI run found for ${GITHUB_SHA}"
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "${run_deadline}" ]; then
              echo "timed out after 330 min waiting for CI on ${GITHUB_SHA}"
              exit 1
            fi
            sleep 30
          done

  build-image:
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.set-vars.outputs.sha }}
      image: ${{ steps.build.outputs.image }}
    env:
      PROJECT_ID: quill-cloud-proxy
      REGION: us-central1
      REPO: trusted-router
      SERVICE: trusted-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image ref from commit SHA
        id: set-vars
        run: |
          SHA="$(git rev-parse --short HEAD)"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Authenticate to GCP via WIF
        uses: Lore-Hex/quill-router/.github/actions/gcp-auth@PINSHA # main 2026-11-13
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: Lore-Hex/quill-router/.github/actions/setup-gcloud@PINSHA # main 2026-11-13

      - name: Build image via Cloud Build
        id: build
        # Use an explicit build config instead of `gcloud builds submit
        # --tag`: the shorthand forces Docker `--no-cache`, which made
        # every deploy reinstall Python dependencies from scratch. Pull
        # a registry-backed cache image, build with --cache-from, then
        # refresh the cache tag. The Dockerfile keeps dependency layers
        # ahead of app-code COPY so ordinary source changes reuse them.
        #
        # --async + poll instead of streaming logs. Streaming requires
        # project Viewer/Owner perms that we don't want to grant the
        # deploy SA (broader than needed). Async returns the build ID
        # which we then watch via `gcloud builds describe`.
        run: |
          set -euo pipefail
          source scripts/deploy/_lib.sh
          CACHE_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:buildcache"
          cat > /tmp/cloudbuild-control-plane.yaml <<'EOF'
          steps:
            - name: gcr.io/cloud-builders/docker
              entrypoint: bash
              args:
                - -c
                - |
                  set -euo pipefail
                  docker pull "${_CACHE_IMAGE}" || true
                  docker build \
                    --network=cloudbuild \
                    --cache-from "${_CACHE_IMAGE}" \
                    --tag "${_IMAGE}" \
                    --tag "${_CACHE_IMAGE}" \
                    .
                  docker push "${_IMAGE}"
                  docker push "${_CACHE_IMAGE}"
          options:
            machineType: E2_HIGHCPU_8
            # Keep builder output in Cloud Logging so the read-only ops
            # identity can diagnose a failed build without broad project
            # Viewer permissions or access to the source staging bucket.
            logging: CLOUD_LOGGING_ONLY
          EOF
          BUILD_ID=$(gcloud builds submit \
            --config=/tmp/cloudbuild-control-plane.yaml \
            --substitutions="_IMAGE=${IMAGE},_CACHE_IMAGE=${CACHE_IMAGE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --async \
            --format='value(id)' \
            .)
          echo "build id: ${BUILD_ID}"
          while true; do
            STATUS=$(gcloud builds describe "${BUILD_ID}" \
              --project="${PROJECT_ID}" --region="${REGION}" \
              --format='value(status)')
            echo "  status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED)
                echo "build ${STATUS}"
                gcloud builds describe "${BUILD_ID}" \
                  --project="${PROJECT_ID}" --region="${REGION}" \
                  --format='yaml(id,status,statusDetail,failureInfo,steps)'
                exit 1
                ;;
            esac
            sleep 5
          done
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" \
            --project="$PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Record immutable prepared release
        env:
          PREPARED_TAG: ${{ steps.set-vars.outputs.sha }}
          PREPARED_IMAGE: ${{ steps.build.outputs.image }}
        run: python3 -m scripts.deploy.release_train prepare

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-release-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 90

  rollout:
    needs: [gate-on-ci, build-image]
    uses: ./.github/workflows/deploy-production.yml
    with:
      sha: ${{ needs.build-image.outputs.sha }}
      image: ${{ needs.build-image.outputs.image }}
      hotfix: ${{ inputs.hotfix == true }}
      track_main: ${{ inputs.track_main == true }}
    secrets: inherit
