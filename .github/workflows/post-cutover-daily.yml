name: Post-cutover suites and model checks (daily)

# The Python suite and the proof oracle with the provider-lifecycle clock
# pinned past every scheduled cutover, and the TLA+ model checks, on main once
# a day. ci.yml runs all three on pull requests and dispatches, but not on a
# push to main (its test-post-cutover and proofs jobs say why). A red here
# means main will break on a scheduled date, a spec merged beside another no
# longer holds, or code or tests a spec names were moved or deleted; none is
# a reason to hold today's deploy. For the model checks this is the one run
# on main scheduled to check them: a price refresh's dispatch runs them only
# when its commit changes more than catalog data or its base has no green CI
# run. A schedule is not a guarantee: under load GitHub can start a scheduled
# run hours late, as with the first of these (due 04:47 UTC on 2026-11-07,
# started at 11:21), or not start it at all.
# deploy.yml's gate-on-ci and the fast path release read ci.yml's runs only,
# so this workflow gates nothing. tests/test_ci_workflow.py keeps these jobs
# identical to ci.yml's.

on:
  schedule:
    # 04:47 UTC: clear of the 06:00-07:30 daily checks and of US working
    # hours, when the organization's runners are busiest.
    - cron: "47 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: post-cutover-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-post-cutover:
    if: github.repository == 'Lore-Hex/quill-router'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    env:
      TEST_SHARDS: "8"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync
        run: uv sync --frozen
      - name: Check out enclave source for the mandatory Sentry guard
        uses: actions/checkout@v4
        with:
          repository: Lore-Hex/quill-cloud-proxy
          ref: main
          path: .security/quill-cloud-proxy
          sparse-checkout: enclave-go
          persist-credentials: false
      - name: Require and inspect enclave source
        run: |
          echo "TR_ENCLAVE_SOURCE_ROOT=$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" >> "$GITHUB_ENV"
          git -C .security/quill-cloud-proxy rev-parse HEAD
          TR_ENCLAVE_SOURCE_ROOT="$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" uv run python -m scripts.check_enclave_sentry
      # Computed from _RETIREMENTS rather than hard-coded, so adding a
      # retirement moves this clock with it and no one has to remember. The
      # max() with now() keeps the clock in the future once every announced
      # cutover is in the past.
      - name: Pin the lifecycle clock past the latest scheduled cutover
        run: |
          uv run python -c '
          import os
          from datetime import UTC, datetime, timedelta
          from trusted_router.provider_lifecycle import latest_scheduled_cutover
          clock = max(latest_scheduled_cutover(), datetime.now(UTC)) + timedelta(days=1)
          stamp = clock.strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TR_LIFECYCLE_CLOCK_OVERRIDE={stamp}\n")
          print(f"lifecycle clock pinned to {stamp}")
          '
      - name: Use the independent post-cutover profile
        # --durations-path is both the split input and the recording output.
        run: cp .test_durations-post-cutover durations-${{ matrix.shard }}.json
      - name: Tests with every scheduled cutover already past
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m "not provider_health and not proof_oracle"
          --splits ${{ env.TEST_SHARDS }} --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --store-durations --durations-path=durations-${{ matrix.shard }}.json --clean-durations
      - name: Upload this shard's durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-post-cutover-${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          retention-days: 7

  proof-oracle:
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        clock: [post-cutover]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync
        run: uv sync --frozen
      - name: Pin the lifecycle clock past the latest scheduled cutover
        if: matrix.clock == 'post-cutover'
        run: |
          uv run python -c '
          import os
          from datetime import UTC, datetime, timedelta
          from trusted_router.provider_lifecycle import latest_scheduled_cutover
          clock = max(latest_scheduled_cutover(), datetime.now(UTC)) + timedelta(days=1)
          stamp = clock.strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TR_LIFECYCLE_CLOCK_OVERRIDE={stamp}\n")
          print(f"lifecycle clock pinned to {stamp}")
          '
      - name: Copy oracle split weights for recording
        run: cp .test_durations durations-${{ matrix.shard }}.json
      - name: Frozen-main proof matrix without coverage
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m proof_oracle tests/test_async_settle_proof_oracle.py tests/test_async_settle_shadow_v2_gate_window.py
          --splits 6 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --store-durations --durations-path=durations-${{ matrix.shard }}.json --clean-durations
      - name: Upload oracle durations separately from the full suites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-oracle-${{ matrix.clock }}-${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          retention-days: 7

  proofs:
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The model checker is in the repository, pinned by its sha256, which
      # check.sh verifies before it runs anything (see proofs/check.sh).
      - name: Model-check every spec
        run: ./proofs/check.sh
