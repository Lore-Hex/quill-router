name: Fast path release

# Builds the fast admission node's binaries from a commit on main whose CI
# passed, and uploads them to the releases bucket under fastpath/<commit>/,
# where infra/fastpath.tf's nodes read the release they are told to run.
# Only CI's success triggers it, so no commit is uploaded whose checks failed
# (docs/design/fast-admission-production-rollout.md, W8).
#
# A published object is never overwritten: each upload carries
# --if-generation-match=0, so it succeeds only where no object exists, and a
# second run for the same commit (CI re-run on main) first compares what is
# already there. A byte-identical object is left alone, a missing one is
# uploaded, and one that differs fails the run with the published object
# unchanged. SHA256SUMS goes up last, so a release whose SHA256SUMS exists
# is complete; the nodes refuse a release without one.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    # Only a run of this repository's own main: a push, or a dispatch on main
    # by a maintainer. `branches: [main]` matches the
    # triggering run's head branch by name only, and a fork's pull request
    # from a branch it calls main runs the fork's own ci.yml. Without these
    # two conditions such a run, once green, would have this workflow build
    # the fork's commit and upload it with the deploy identity.
    if: >-
      ${{ github.repository == 'Lore-Hex/quill-router'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
      BUCKET: tr-fastpath-releases-quill-cloud-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: fastpath/go.sum
      # The binaries are written outside the checkout: a file written into
      # it makes git report the tree modified, and every binary built after
      # it would carry vcs.modified=true. Each binary must name this commit,
      # unmodified, or nothing is uploaded.
      - name: Build the node's binaries
        working-directory: fastpath
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/fastpath" ./cmd/fastpath
          go build -trimpath -ldflags="-s -w" -o "$out/fastpathctl" ./cmd/fastpathctl
          go build -trimpath -ldflags="-s -w" -o "$out/loadgen" ./cmd/loadgen
          go build -trimpath -ldflags="-s -w" -o "$out/fastpathwatch" ./cmd/fastpathwatch
          cp testdata/load-mix.json "$out/load-mix.json"
          (cd "$out" && sha256sum fastpath fastpathctl loadgen fastpathwatch load-mix.json > SHA256SUMS)
          for binary in fastpath fastpathctl loadgen fastpathwatch; do
            info="$(go version -m "$out/$binary")"
            if ! grep -qxF "$(printf '\tbuild\tvcs.revision=%s' "$COMMIT")" <<<"$info" \
              || ! grep -qxF "$(printf '\tbuild\tvcs.modified=false')" <<<"$info"; then
              echo "::error::$binary does not report vcs.revision=$COMMIT with vcs.modified=false"
              printf '%s\n' "$info"
              exit 1
            fi
          done
      - name: Authenticate to GCP via WIF
        uses: Lore-Hex/quill-router/.github/actions/gcp-auth@bada0072c1cdc70a095bee380e6a6a7fdfb2cf8e # main 2026-11-23
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: Lore-Hex/quill-router/.github/actions/setup-gcloud@bada0072c1cdc70a095bee380e6a6a7fdfb2cf8e # main 2026-11-23
      - name: Upload the release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum --check --strict SHA256SUMS
          published="$RUNNER_TEMP/published"
          mkdir -p "$published"
          for file in fastpath fastpathctl loadgen fastpathwatch load-mix.json SHA256SUMS; do
            if gcloud storage cp "gs://$BUCKET/fastpath/$COMMIT/$file" "$published/$file" 2>/dev/null; then
              if cmp -s "$published/$file" "$file"; then
                echo "fastpath/$COMMIT/$file is already published, byte-identical; left alone"
                continue
              fi
              echo "::error::fastpath/$COMMIT/$file is already published and differs from this build; it is not overwritten"
              exit 1
            fi
            gcloud storage cp --if-generation-match=0 "$file" "gs://$BUCKET/fastpath/$COMMIT/$file"
          done
          echo "published fastpath/$COMMIT" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
