# This workflow itself must be in the WIF provider allowlist. The Terraform in
# infra/ manages that allowlist; chicken-and-egg is resolved by the operator
# adding infra-apply.yml once by hand (already scripted for the operator).

name: Terraform static infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [terraform, status, configure-retention, recover]
        default: terraform
        required: true
      cloud:
        type: choice
        options: [gcp, aws, azure]
        default: gcp
      operation_id:
        type: string
        default: ""
      confirmation:
        description: "APPLY only after the documented coordinator migration or recovery checks"
        type: string
        default: ""

concurrency:
  group: infra-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate

  apply:
    if: ${{ github.repository == 'Lore-Hex/quill-router' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'terraform')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Keep the repository below the workspace root. The GCP auth action
      # writes gha-creds-* into that root, so src/ remains a clean work tree.
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Authenticate to AWS via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::330422590279:role/tr-router-github-deploy
          aws-region: eu-west-3

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v3

      - name: Plan static infrastructure
        run: terraform -chdir=src/infra init && terraform -chdir=src/infra plan -out=tfplan

      - name: Apply reviewed plan
        run: terraform -chdir=src/infra apply tfplan

  release-coordinator:
    if: ${{ github.repository == 'Lore-Hex/quill-router' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation != 'terraform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect or reconcile only the deployment journal
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          CLOUD: ${{ inputs.cloud }}
          OPERATION_ID: ${{ inputs.operation_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            status)
              python3 scripts/deploy/cloud_rollout.py status ;;
            configure-retention)
              [ "$CONFIRMATION" = APPLY ] || exit 1
              gcloud storage buckets update gs://tr-deploy-mutex-quill-cloud-proxy --clear-lifecycle
              python3 -c 'from scripts.deploy.cloud_rollout import GCSStore; GCSStore().verify_retention()' ;;
            recover)
              [ "$CONFIRMATION" = APPLY ] || exit 1
              python3 scripts/deploy/cloud_rollout.py recover --cloud "$CLOUD" --operation "$OPERATION_ID" ;;
            *) exit 1 ;;
          esac
