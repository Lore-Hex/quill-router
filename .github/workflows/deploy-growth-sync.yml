name: Deploy marketing analytics worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY after the additive directory migration is verified
        type: string
        required: true
      gateway_attempts:
        description: GCP audit collector flag; keep preserves the job's current value
        type: choice
        options: [keep, "true", "false"]
        default: keep
      billing_owners:
        description: Hash-only billing-owner view flag; keep preserves the job's current value
        type: choice
        options: [keep, "true", "false"]
        default: keep

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-growth-sync
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Lore-Hex/quill-router' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: quill-cloud-proxy
      REGION: us-central1
      JOB: trusted-router-growth-sync
      GH_TOKEN: ${{ github.token }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GATEWAY_ENABLED: ${{ inputs.gateway_attempts }}
      OWNERS_ENABLED: ${{ inputs.billing_owners }}
    steps:
      - uses: actions/checkout@v7
      - name: Require confirmation and green CI for this exact commit
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = APPLY
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0]')
          test "$(jq -r .status <<< "$result")" = completed
          test "$(jq -r .conclusion <<< "$result")" = success
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - uses: astral-sh/setup-uv@v7
      - name: Preserve the existing worker configuration and exact source filter
        run: |
          set -euo pipefail
          gcloud run jobs describe "$JOB" --project "$PROJECT" --region "$REGION" \
            --format=json > "$RUNNER_TEMP/growth-before.json"
          uv run --no-project --with httpx --with google-auth --with requests \
            python -m scripts.axiom_growth.provision source-filter
      - name: Build the reviewed worker and resolve its immutable image
        run: |
          set -euo pipefail
          build=$(gcloud builds submit scripts/axiom_growth --project "$PROJECT" \
            --config scripts/axiom_growth/cloudbuild.yaml \
            --substitutions "_GROWTH_TAG=$GITHUB_SHA" --async --format='value(id)')
          deadline=$(( $(date +%s) + 900 ))
          while true; do
            status=$(gcloud builds describe "$build" --project "$PROJECT" --format='value(status)')
            case "$status" in
              SUCCESS) break ;;
              QUEUED|PENDING|WORKING) ;;
              *) echo "Build failed: $status"; exit 1 ;;
            esac
            test "$(date +%s)" -lt "$deadline"
            sleep 15
          done
          image="$REGION-docker.pkg.dev/$PROJECT/trusted-router/growth-sync"
          digest=$(gcloud artifacts docker images describe "$image:$GITHUB_SHA" \
            --project "$PROJECT" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "GROWTH_IMAGE=$image@$digest" >> "$GITHUB_ENV"
      - name: Update image and export memory, preserve flags, rollback on failure
        run: |
          set -euo pipefail
          old_image=$(jq -r '.spec.template.spec.template.spec.containers[0].image' "$RUNNER_TEMP/growth-before.json")
          old_memory=$(jq -r '.spec.template.spec.template.spec.containers[0].resources.limits.memory' "$RUNNER_TEMP/growth-before.json")
          old_gateway=$(jq -r '[.spec.template.spec.template.spec.containers[0].env[]? | select(.name=="GROWTH_GATEWAY_ATTEMPTS_ENABLED") | .value][0] // "false"' "$RUNNER_TEMP/growth-before.json")
          old_owners=$(jq -r '[.spec.template.spec.template.spec.containers[0].env[]? | select(.name=="GROWTH_BILLING_OWNERS_ENABLED") | .value][0] // "false"' "$RUNNER_TEMP/growth-before.json")
          test -n "$old_image" && test "$old_image" != null
          test -n "$old_memory" && test "$old_memory" != null
          # A redeploy keeps the gateway and billing-owner collectors exactly as they
          # are unless the operator chose true or false for this run.
          new_gateway="$old_gateway"
          new_owners="$old_owners"
          case "$GATEWAY_ENABLED" in true|false) new_gateway="$GATEWAY_ENABLED" ;; keep) ;; *) exit 1 ;; esac
          case "$OWNERS_ENABLED" in true|false) new_owners="$OWNERS_ENABLED" ;; keep) ;; *) exit 1 ;; esac
          gcloud run jobs update "$JOB" --project "$PROJECT" --region "$REGION" \
            --image "$GROWTH_IMAGE" --memory 1Gi \
            --update-env-vars "GROWTH_GATEWAY_ATTEMPTS_ENABLED=$new_gateway,GROWTH_BILLING_OWNERS_ENABLED=$new_owners"
          if ! gcloud run jobs execute "$JOB" --project "$PROJECT" --region "$REGION" --wait; then
            gcloud run jobs update "$JOB" --project "$PROJECT" --region "$REGION" \
              --image "$old_image" --memory "$old_memory" \
              --update-env-vars "GROWTH_GATEWAY_ATTEMPTS_ENABLED=$old_gateway,GROWTH_BILLING_OWNERS_ENABLED=$old_owners"
            exit 1
          fi
          printf 'Deployed %s\nExport job memory: 1Gi (was %s).\nGateway collector: %s (was %s). Billing-owner view: %s (was %s).\nVerify live Axiom feed statuses and two scheduled cycles before declaring completion.\n' \
            "$GROWTH_IMAGE" "$old_memory" "$new_gateway" "$old_gateway" "$new_owners" "$old_owners" >> "$GITHUB_STEP_SUMMARY"
