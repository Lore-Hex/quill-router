name: Provider catalog health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Provider/catalog freshness is operational telemetry, not a deploy gate.
# CI still enforces parsing, privacy, expiry refusal, billing and fallback.
jobs:
  catalog-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@PINSHA # main 2026-11-13
      - run: uv sync --frozen
      - name: Check time-sensitive provider state
        run: uv run pytest -q -m provider_health
      - name: Explain the monitoring result
        if: always()
        run: |
          echo '## Provider catalog health' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow reports catalog freshness separately from release CI. A failure does not block deployments or change provider eligibility. Inspect the failed checks and the hourly price refresh; never extend expired evidence just to clear this report.' >> "$GITHUB_STEP_SUMMARY"
