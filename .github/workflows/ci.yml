name: CI

on:
  push:
    branches: [main]
  # No `labeled` trigger: with cancel-in-progress below, adding any label
  # would cancel the pull request's run and start another. The scope job
  # reads the ci:full label when it runs; to force the complete matrix on an
  # open pull request, add the label, then push or re-run every job of its
  # latest run (`gh run rerun <run-id>`, without --failed, so the scope job
  # runs again and reads the labels afresh).
  pull_request:
    branches: [main]
  # Bot-authored pricing branches use GITHUB_TOKEN, so GitHub suppresses their
  # normal push-triggered workflows. refresh-prices.yml dispatches CI for the
  # generated branch before advancing protected main with the checked SHA,
  # with scope=paths. A dispatch without it runs the complete matrix.
  workflow_dispatch:
    inputs:
      scope:
        description: "full runs every job; paths skips a path-scoped job none of whose inputs changed"
        type: choice
        options: [full, paths]
        default: full

# One CI run per branch or pull request: a newer push cancels the run of the
# commit it supersedes. Without this, 2026-10-20's push cadence left 60 queued
# runs and the coverage job of every main run starved for five hours, so no run
# concluded and the deploy gate (which needs its commit's CI run to conclude
# success) could ship nothing. Main is exempt: every main commit keeps its own
# run, because a later push that touches no deploy path starts no deploy of its
# own, and the earlier commit's deploy gate would read the cancelled run as a
# refusal and strand a valid rollout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  queue: ${{ github.ref == 'refs/heads/main' && 'max' || 'single' }}

# Independent jobs instead of one serial pipeline: wall time becomes the
# slowest job, not the sum. deploy.yml's gate and refresh-prices.yml's
# publication gate require this WORKFLOW RUN's conclusion for the SHA. GitHub
# concludes a run success when every job succeeded OR was skipped, so the
# `ci` summary job at the end re-derives the conclusion from each job's
# result and accepts a skipped job only in the two cases below.
#
# Path-aware selection. The hourly price refresh commits catalog data files
# only (scripts/ci/commit_scope.py lists them) and gates publication on this
# run. Every hour that was 44 jobs and about 630 runner-minutes, 300 of them
# in jobs that read none of those files; on 2026-10-26 the organization's
# Actions queue starved for about two hours with hourly refresh runs among 19
# queued runs, and merges and deploys stalled. The `scope` job classifies the
# commit by its changed paths against the commit before it. Jobs that read
# the catalog data run on every commit: lint's history check, the production
# import, the default-clock suite and the browser smoke, with the post-cutover
# suite whenever data changes (see below). The others carry
#   if: needs.scope.outputs.data_only != 'true'
# and skip only when EVERY changed path is catalog data AND the base commit
# has a completed ci.yml run that concluded success. That second condition is
# the induction that keeps a skip honest: the summary job makes a success
# conclusion mean "every job that ran passed and every skip was legitimate",
# so the skipped jobs' inputs (the code) were validated at the base and are
# unchanged here. Without that check a data-only commit on top of an
# unvalidated base (a base whose run is still running or failed, or a force
# push whose old tip differs from the new one only in data) would inherit
# code no run checked.
# An empty comparison, a missing base commit or an unvalidated base takes no
# data-only skip; a failed classification fails `scope`, which the summary
# job turns into a failed run.
#
# Path-scoped jobs. The heavy jobs that read a known part of the tree (the
# TLA+ model checks, the proof oracle, the post-cutover suite, the heavy test
# lane and the three fast path jobs) also carry
#   needs.scope.outputs.<flag> != 'false'
# and run, on every event, only when a file their flag names changed
# (commit_scope.py's docstring lists each flag's files and why): for a pull
# request, since its base; for a push or a dispatch, since the newest
# ancestor-or-self of the base whose own ci.yml run concluded success. There
# is no scheduled run: a push to main applies the same rules as a pull
# request (except the post-cutover suite, which runs on pull requests and
# dispatches only), so a combination of two green pull requests that breaks a job is
# caught by the push that makes it, and because a push compares with the
# newest passing commit, a job a red commit failed runs again on every later
# push until it passes. A dispatch without scope=paths, a pull request
# labeled ci:full, a change to this file or scripts/ci/, and anything the
# scope job cannot classify run the complete matrix. tests/test_ci_workflow.py
# holds the job lists to the workflow text and tests/test_ci_scope_step.py
# drives this step against local repositories and a fake gh.
jobs:
  scope:
    # GitHub-hosted Ubuntu 24.04; the group allows only this workflow on main.
    runs-on: &short-runner ${{ github.repository == 'Lore-Hex/quill-router' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'tr-ci-short' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      actions: read         # the ci.yml runs of the base and of its ancestors
      pull-requests: read   # the pull request's labels, read when the job runs
    outputs:
      data_only: ${{ steps.scope.outputs.data_only }}
      run_fastpath: ${{ steps.scope.outputs.run_fastpath }}
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
      run_post_cutover: ${{ steps.scope.outputs.run_post_cutover }}
      post_cutover_tests: ${{ steps.scope.outputs.post_cutover_tests }}
      run_proof_oracle: ${{ steps.scope.outputs.run_proof_oracle }}
      run_proofs: ${{ steps.scope.outputs.run_proofs }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      PUSH_BEFORE: ${{ github.event.before }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      DISPATCH_SCOPE: ${{ inputs.scope }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify the commit by its changed paths
        id: scope
        # The base is the commit this one supersedes: for a push the previous
        # tip, for a pull request its base (the checkout is the merge commit,
        # so the diff is the pull request's own changes), and for a dispatch
        # the merge base with main (refresh-prices.yml dispatches a branch of
        # main plus one generated commit). A shallow fetch of the base is
        # enough: `git diff` compares two trees and needs no history between
        # them, and the repository's history is too large to clone each time.
        # --no-renames: with move detection on, a code file moved onto a
        # data path is reported only by its destination; with it off the
        # diff is a deletion of the code path and the classifier runs the
        # full matrix.
        # --raw: the classifier sees modes and status, so a symlink, a
        # submodule or an executable at a data path is not data either.
        # A commit counts as validated only through a completed, successful
        # run of this workflow on exactly that commit, from a push or a
        # dispatch (a pull_request run checks a merge commit, not the base's
        # own tree).
        #
        # The path-scoped jobs compare the head with REF. A pull request's
        # REF is its base: what it skips, it did not change, and nothing
        # ships from its run. A push or dispatch (whose run deploy.yml's gate,
        # the fast path release and the price refresh act on) takes the
        # newest commit whose own tree was validated: the base when it was,
        # otherwise the newest of the ten latest validated commits that is an
        # ancestor of the base. Its validation says every job that its run
        # ran passed and every job it skipped had inputs equal to a commit
        # validated before it, so a job whose inputs are equal at REF and here
        # would pass here. A base still running, or red, widens the comparison
        # to REF: a job a red commit failed runs on every later push until a
        # run passes it, and its red holds every later deploy. The -U0 patch
        # outside src/ gives the post-cutover rule the changed lines to read
        # (it runs for any change under src/): --text shows a file a
        # .gitattributes marks binary, and --no-ext-diff and --no-textconv
        # keep a configured driver from rewriting what it shows. A file the
        # patch still shows no lines for runs the suite.
        run: |
          set -euo pipefail
          head="${GITHUB_SHA}"
          case "${EVENT_NAME}" in
            push) base="${PUSH_BEFORE}" ;;
            pull_request) base="${PR_BASE_SHA}" ;;
            *)
              base=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${head}" \
                --jq '.merge_base_commit.sha // empty' || true) ;;
          esac
          # Why every path-scoped job runs; empty while the paths decide.
          full=""
          if [ "${EVENT_NAME}" = workflow_dispatch ] && [ "${DISPATCH_SCOPE}" != paths ]; then
            full="a dispatch runs the complete matrix unless it asks for scope=paths"
          elif [ "${EVENT_NAME}" = pull_request ]; then
            # The labels as they are now, not as the event recorded them: a
            # re-run keeps the original event, and the label is often added
            # after it. Labels that cannot be read run the complete matrix.
            if ! labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels?per_page=100" \
                --jq '.[].name'); then
              full="the pull request's labels could not be read"
            elif grep -qxF 'ci:full' <<< "${labels}"; then
              full="the pull request is labeled ci:full"
            fi
          fi
          data_only=false
          base_validated=false
          if [ -n "${full}" ]; then
            echo "::notice title=CI scope::${full}; running the complete matrix"
          elif [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice title=CI scope::no base commit to compare against; running the complete matrix"
            full="no base commit"
          elif [ "${base}" = "${head}" ]; then
            echo "::notice title=CI scope::${head} is its own base; running the complete matrix"
            full="the head is its own base"
          elif ! git fetch -q --depth=1 origin "${base}"; then
            echo "::notice title=CI scope::base ${base} is not fetchable; running the complete matrix"
            full="the base is not fetchable"
          else
            git -c core.quotePath=true diff --no-renames --raw "${base}" "${head}" > changed-paths.txt
            echo "changed paths (${base}..${head}):"
            sed 's/^/  /' changed-paths.txt
            validated=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${base}&per_page=100" \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length' \
              || echo 0)
            if [ "${validated:-0}" -gt 0 ]; then
              base_validated=true
            fi
            if [ "$(python3 scripts/ci/commit_scope.py classify < changed-paths.txt)" = "true" ]; then
              if [ "${base_validated}" = true ]; then
                data_only=true
              else
                echo "::notice title=CI scope::only catalog data changed, but base ${base} has no successful ci.yml run; the data-only skips do not apply"
              fi
            fi
          fi
          echo "data_only=${data_only}"
          echo "data_only=${data_only}" >> "$GITHUB_OUTPUT"
          ref=""
          if [ -z "${full}" ]; then
            if [ "${EVENT_NAME}" = pull_request ] || [ "${base_validated}" = true ]; then
              ref="${base}"
            else
              candidates=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=success&per_page=50" \
                --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")) | .head_sha] | .[:10] | .[]' \
                || true)
              while read -r candidate; do
                [ -n "${candidate}" ] || continue
                relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${candidate}...${base}" --jq '.status' || true)
                if [ "${relation}" = ahead ] || [ "${relation}" = identical ]; then
                  ref="${candidate}"
                  break
                fi
              done <<< "${candidates}"
              if [ -z "${ref}" ]; then
                full="no recent successful ci.yml run is on an ancestor of base ${base}"
              elif ! git fetch -q --depth=1 origin "${ref}"; then
                full="${ref} is not fetchable"
              else
                echo "::notice title=CI scope::base ${base} has no successful ci.yml run; the path-scoped jobs compare with ${ref}, its newest ancestor that has one"
              fi
            fi
          fi
          if [ -n "${full}" ]; then
            echo "::notice title=CI scope::${full}; every path-scoped job runs"
            python3 scripts/ci/commit_scope.py jobs --full < /dev/null | tee -a "$GITHUB_OUTPUT"
          else
            git -c core.quotePath=true diff --no-renames --raw "${ref}" "${head}" > scoped-paths.txt
            git -c core.quotePath=true diff --no-renames --no-color --text --no-ext-diff --no-textconv \
              -U0 "${ref}" "${head}" -- . ':(exclude)src' > scoped-lines.patch
            echo "paths that decide the path-scoped jobs (${ref}..${head}):"
            sed 's/^/  /' scoped-paths.txt
            python3 scripts/ci/commit_scope.py jobs --event "${EVENT_NAME}" --lines scoped-lines.patch \
              < scoped-paths.txt | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Catalog change history is current
        run: uv run python scripts/update_model_changes.py --check

  spanner-emulator:
    needs: scope
    if: needs.scope.outputs.data_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      TR_CONFORMANCE_EMULATOR_SCHEMA: "1"
      TR_SPANNER_POOL_SIZE: "2"
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator@sha256:c6f3402f2599684f295a0fdefb6fbbbfb18a0e43e309ff5456ccb452a4570a79
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Wait for the Spanner emulator (fail if unavailable)
        run: |
          uv run python - <<'PY'
          import socket
          import time
          deadline = time.monotonic() + 60
          pending = {9010, 9020}
          while pending and time.monotonic() < deadline:
              for port in tuple(pending):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          pending.remove(port)
                  except OSError:
                      pass
              if pending:
                  time.sleep(0.5)
          assert not pending, f"Emulator ports unavailable: {sorted(pending)}"
          PY
      # Serial: Spanner emulator locks the entire database for read-write
      # transactions. Each conformance test provisions disposable resources;
      # SQL acceptance shares its own database and always rolls back DML.
      - name: Native GoogleSQL conformance
        run: uv run pytest -q -rsx tests/conformance -k spanner-emulator
      - name: Production SQL acceptance and schema drift
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest -q -rsx
          tests/conformance/test_speculation_shadow_native.py
          tests/conformance/test_spanner_schema.py
          tests/conformance/test_spanner_sql_acceptance.py
          tests/conformance/test_spanner_schema_audit.py
          tests/test_consolidate_starter_credit.py
      # A fresh package-only process can collect live objects without native
      # SDK leftovers from other tests. Mixed-suite workers skip that count.
      - name: P5 package object budgets
        if: ${{ !cancelled() }}
        # Runner speed, not test growth: 57 green main runs (2026-10-24..28)
        # took 635 s median / 669 s max; P5/conformance correlation was 0.73.
        # Run 40736263651 hit 720 s at 88% (~876 s projected), then reran in
        # 651 s. Oct 12 measurements found up to 1.9x runner-speed variation.
        # 22 min gives 2.1x median / 1.5x projection; the 40-min job limit
        # gives 2.2x its 1080 s median so a ~2x slower runner still fits.
        timeout-minutes: 22
        run: >-
          uv run pytest -q tests/test_async_settle_shadow_v2_gate*.py
          -m "not proof_oracle" -n 2
          --cov=trusted_router --cov-report= --cov-fail-under=0
      - name: Emulator logs
        if: failure()
        run: |
          docker logs ${{ job.services.spanner.id }}

  frontend:
    needs: scope
    if: needs.scope.outputs.data_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Install npm deps
        run: npm ci
      - name: TypeScript build (verify the committed .js matches its .ts)
        run: |
          npx tsc
          git diff --exit-code -- src/trusted_router/static/dashboard.js src/trusted_router/static/token-index.js
      - name: ESLint
        run: npx eslint frontend/src
      - name: Stylelint
        run: npx stylelint "src/trusted_router/static/*.css"

  production-import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync production dependencies only
        run: uv sync --frozen --no-dev
      - name: Import the production application
        run: uv run --no-sync python -c "import trusted_router.main"

  test:
    # Sharded across runners because deploy latency IS CI latency: the deploy
    # workflow's gate-on-ci step waits for this run, and it was measured at
    # 29 minutes of a ~35 minute pipeline. When pushes land more often than
    # that, every deploy reaches its supersede gate already obsolete and skips,
    # so main silently stops reaching production -- 11 hours of it on
    # 2026-08-23, with every run green. This repository is public, so extra
    # standard runners cost nothing but concurrency.
    # A wedged shard otherwise burns GitHub's 6-hour default: seen twice on
    # 2026-08-26 (one shard at 2h16m, another run's shard idle for hours)
    # while every sibling finished in under 9 minutes. pytest-timeout=600
    # bounds a hung TEST, but not collection, fixture teardown, or a wedged
    # xdist worker — this bounds the job whatever wedges.
    #
    # 25 minutes then started cutting off shards that were finishing: on
    # 2026-10-15 runs 38778257165, 38786461389 and 38809305127 cancelled
    # five shards at 96-99% with no failing test, and rerunning two of them
    # cancelled them again at the same point, so it was weight, not a wedge.
    # A shard spent about five minutes before its first test (checkout, uv
    # sync, collecting 36k tests under coverage, four workers; about three,
    # with about 49k tests, since #2368's coverage change) and its last few
    # percent can take six minutes while one worker holds a long test.
    # 35 keeps the wedge bound (the wedge sat at 2h16m) and leaves a
    # finishing shard alone; main's slowest shard on twelve shards took
    # 20.1 minutes (38808849971).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Ten default shards and six post-cutover shards still reached the
        # 25-minute cap: run 38778257165 on Oct 15 cancelled default shard 6
        # and post-cutover shard 3 at 98-99%, with no failing test. Default
        # shards 7 and 9 took 15.7 and 19.6 minutes on Oct 14 main-equivalent
        # trees, before the stacked branch's 861 extra default cases.
        #
        # Two instrumented runs (#1709) found runner speed varied by up to
        # about 1.7x. Refreshing .test_durations from one run's raw timings
        # did not improve the slowest job, so keep its relative balance and
        # reduce the work: twelve default shards and eight post-cutover
        # (eight default since Nov 6, below).
        # On this tree the heaviest group's estimated single-worker work
        # falls from 849 to 707 seconds for defaults (about 17%), and from
        # 1,414 to 1,061 for post-cutover (25%).
        # The committed weights understate real work; observed wall times
        # are four to five times the estimates. These are estimates, not
        # timeout bounds, and exclude queue delay.
        # Oct 27: 6,271 IDs were missing weights. Profile at least three green
        # runs, keeping coverage and post-cutover timings separate (take
        # post-cutover timings from a run that ran its shards, or from
        # post-cutover-daily.yml's, run by hand):
        #   gh run download <run> -p 'durations-*' -D /tmp/ci-durations/<run>
        #   uv run python scripts/ci/merge_shard_durations.py /tmp/ci-durations .test_durations /tmp/default.json --profile default
        # Repeat with --profile post-cutover; review both profiles before commit.
        # Nov 6: with coverage on sys.monitoring (#2368), twelve shards took
        # 7 to 12 minutes each over five green main runs, the steps before
        # pytest about 50 seconds of that. Eight took 8 to 14 minutes each on
        # #2377's pull request run, under the proof oracle's longest shard
        # (26 to 28 minutes), with four fewer jobs in the organization's
        # queue and 91 runner-minutes against 110 to 126.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    env:
      TEST_SHARDS: "8"
      TR_CONFORMANCE_POSTGRES_DSN: postgresql://postgres:tr@localhost:5432/postgres
      # The same throwaway service superuser (its POSTGRES_PASSWORD below),
      # for the tests that need their own databases and cluster-wide roles:
      # the delivery verifier's scope proofs and the activity repair check.
      # Each makes a database of its own and removes it afterwards. The role
      # tests serialize on an advisory lock, remove tr_scope_other after each
      # test and leave only tr_verifier, a role without a password that no
      # other test uses.
      TR_TEST_POSTGRES_SUPERUSER_DSN: postgresql://postgres:tr@localhost:5432/postgres
      # Spanner's PostgreSQL dialect, via PGAdapter + the Spanner emulator.
      # Needs no GCP credentials, so it runs on every PR like any other
      # service container.
      TR_CONFORMANCE_SPANNER_PG_DSN: postgresql://localhost:5434/tr-conformance
    services:
      postgres:
        # Same Docker Official Image as postgres:17, verified 2026-10-09.
        # Pin the multi-architecture index so changing registries cannot
        # change bytes. Docker Hub limits anonymous pulls from shared runners,
        # and public ECR answered "toomanyrequests: Data limit exceeded" on
        # four shards across two runs on 2026-10-13, which reddens CI and
        # holds the deploy gate. Google's Docker Hub mirror serves the same
        # digest.
        image: mirror.gcr.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: tr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      spanner-pg:
        # Spanner PG is a SUBSET of PostgreSQL, so passing against postgres:17
        # does not imply passing against Spanner. This is what keeps the single
        # PostgresStore honest across all three clouds.
        image: gcr.io/cloud-spanner-pg-adapter/pgadapter-emulator:latest
        ports:
          - 5434:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Check out enclave source for the mandatory Sentry guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Lore-Hex/quill-cloud-proxy
          ref: main
          path: .security/quill-cloud-proxy
          sparse-checkout: enclave-go
          persist-credentials: false
      - name: Require and inspect enclave source
        run: |
          echo "TR_ENCLAVE_SOURCE_ROOT=$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" >> "$GITHUB_ENV"
          git -C .security/quill-cloud-proxy rev-parse HEAD
          TR_ENCLAVE_SOURCE_ROOT="$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" uv run python -m scripts.check_enclave_sentry
      # The coverage invocation executes the ordinary suite; the frozen-main
      # differential runs in proof-oracle without coverage tracing. Running a
      # separate plain pytest pass doubled CI time and delayed every guarded
      # production rollout without checking any additional behavior.
      # -n 4 (pytest-xdist) runs four workers; pytest-cov combines
      # worker coverage natively. --dist loadgroup is LOAD-BEARING: the
      # server-backed conformance backends are xdist_group-marked (see
      # tests/conformance/conftest.py) because the Spanner PG emulator rejects
      # concurrent schema changes -- measured 14 setup errors under plain -n 4,
      # 53/53 with grouping. Per-test id namespacing makes the shared DATABASE
      # order-independent; grouping is what serializes the DDL.
      - name: Leave the heavy lane's files to test-heavy
        # One line of --ignore=<path> arguments (commit_scope.py lists only
        # paths of [A-Za-z0-9_./-]); the suite step reads it from the
        # environment, as the post-cutover suite reads its selection.
        run: |
          set -euo pipefail
          ignored=$(python3 scripts/ci/commit_scope.py heavy-tests --ignore)
          echo "HEAVY_IGNORE=${ignored}" >> "$GITHUB_ENV"
      - name: Copy split weights for this shard
        # --durations-path is both the split input and the recording output.
        run: cp .test_durations durations-${{ matrix.shard }}.json
      - name: Tests and coverage
        # least_duration is greedy per-test bin-packing. The default
        # duration_based_chunks cuts CONTIGUOUS slices of collection order,
        # and with one 18.5-minute conformance file early in the ordering the
        # cumulative boundaries left shard 6 EMPTY (pytest exit 5, red run).
        # Bin-packing also spreads that file's tests across shards instead of
        # clumping them into whichever chunk swallows the file whole.
        # Balanced by .test_durations, which is why that file is committed.
        # Without it pytest-split splits by test COUNT, and equal counts are not
        # equal minutes: measured on the first sharded run, shard 2 finished in
        # 7m40s while shard 1 took 21m30s and every other runner sat idle
        # waiting for it. The critical path is the slowest shard, so balance is
        # the whole point -- 1164s of test time over 4 shards is ~291s each.
        #
        # Refresh from the CI duration artifacts as described above the matrix.
        # Stale durations degrade gracefully: unknown tests are distributed by
        # count, so a missing entry costs balance, not correctness.
        #
        # --splits/--group (pytest-split) shards the suite across matrix jobs;
        # -n 4 runs four workers within each shard. Coverage is
        # collected per shard with NO fail-under: a shard sees only its own
        # slice, so enforcing 70% there would fail on a perfectly covered
        # suite. The `coverage` job below combines them and enforces once.
        #
        # ${HEAVY_IGNORE}: the heavy lane's files, which test-heavy runs. An
        # ignored file is never collected, so the split weighs only what
        # these shards run, and the two jobs partition the suite.
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m "not provider_health and not proof_oracle"
          ${HEAVY_IGNORE}
          --splits ${{ env.TEST_SHARDS }} --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --store-durations --durations-path=durations-${{ matrix.shard }}.json --clean-durations
          --cov=trusted_router --cov-report=
      - name: Upload this shard's durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-default-${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          retention-days: 7
      # The shard's failed test IDs (scripts/ci/failure_record.py, loaded by
      # tests/conftest.py in GitHub Actions), for the coverage job's report
      # only shadow comparison. Whatever the outcome; it can never fail the job.
      - name: Upload this shard's failed tests
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-failures/failures.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Stash this shard's coverage
        # Renamed off the dotfile before upload. `.coverage` is hidden, and
        # upload-artifact only stopped skipping hidden files behind an opt-in
        # added in a recent version -- a silently empty artifact here would
        # make the combine job compute the floor from fewer shards than it
        # thinks it has.
        run: mv .coverage coverage-${{ matrix.shard }}.dat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.dat
          retention-days: 1

  # The heavy lane: the default suite's slowest test files (commit_scope.py's
  # HEAVY_TESTS, 28% of its recorded weight), which the `test` shards ignore.
  # Path-scoped (run_heavy): it runs, on every event, when a change can reach
  # them (any file under src/; anything their imports, string-named modules
  # and named paths reach from them and tests/conftest.py; a test fixture;
  # their split weights; the Python toolchain: commit_scope.py's docstring
  # has the rule), and skips otherwise, which in the last 100 merged pull
  # requests was about half of them. Optional, like proof-oracle:
  # not a required check, but the CI summary needs it, so a red lane fails
  # the run and a skip passes only when the scope job set run_heavy=false.
  # Its coverage joins the `coverage` job's when it runs.
  #
  # No service containers and no enclave source: none of these files reads a
  # database DSN, TR_ENCLAVE_SOURCE_ROOT or TEST_SHARDS. The same checkout,
  # markers, xdist grouping (gate_window's xdist_group) and split weights
  # (.test_durations) as `test`, so each test runs as it did there.
  test-heavy:
    needs: scope
    if: needs.scope.outputs.run_heavy != 'false'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Three shards each carry about as much recorded weight as one of the
        # eight `test` shards after the move, so the lane is not the slowest
        # job of a run that runs it.
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    env:
      TEST_SHARDS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Select the heavy lane's files
        # One line of paths (commit_scope.py lists only [A-Za-z0-9_./-]);
        # it fails rather than print nothing, which would run the whole suite.
        run: |
          set -euo pipefail
          files=$(python3 scripts/ci/commit_scope.py heavy-tests --files)
          echo "HEAVY_FILES=${files}" >> "$GITHUB_ENV"
      - name: Copy split weights for this shard
        # --durations-path is both the split input and the recording output.
        run: cp .test_durations durations-${{ matrix.shard }}.json
      - name: Heavy lane tests and coverage
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m "not provider_health and not proof_oracle"
          --splits ${{ env.TEST_SHARDS }} --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --store-durations --durations-path=durations-${{ matrix.shard }}.json --clean-durations
          --cov=trusted_router --cov-report=
          ${HEAVY_FILES}
      - name: Upload this shard's durations
        # Named under durations-default-*, so merge_shard_durations.py's
        # default profile reads the lane with the eight shards.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-default-heavy-${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          retention-days: 7
      # The lane's failed test IDs (scripts/ci/failure_record.py), for the
      # coverage job's report-only shadow comparison, which counts them
      # against this job's result. Whatever the outcome; it can never fail
      # the job.
      - name: Upload this shard's failed tests
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-heavy-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-failures/failures.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Stash this shard's coverage
        run: mv .coverage coverage-heavy-${{ matrix.shard }}.dat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-heavy-${{ matrix.shard }}
          path: coverage-heavy-${{ matrix.shard }}.dat
          retention-days: 1

  coverage:
    # The 70% gate, enforced once over the combined shards.
    #
    # This job is why sharding does not quietly weaken the coverage floor. Each
    # shard measures only the lines its own slice touched, so a per-shard
    # --cov-fail-under=70 would fail on a suite that covers 95% overall. Moving
    # the threshold here keeps the same number meaning the same thing.
    #
    # It runs even when a shard fails, so a red suite reports BOTH the failing
    # tests and the coverage number rather than hiding one behind the other --
    # but it still fails if any shard did, because coverage computed from a
    # partial run is not a measurement of this commit.
    # Cancelled runs must release their concurrency slot. always() kept this
    # job queued after superseding PR runs, blocking the replacement's CI.
    # The floor measures the code's coverage; a data-only commit changes no
    # code and skips it (its shards still ran and still gate the run).
    #
    # The heavy lane (test-heavy) holds part of the suite. When it ran, its
    # shards' coverage is combined with the eight and must all be there; a
    # lane that failed fails this job like a failed shard. When it skipped
    # (run_heavy=false, which the CI summary holds it to), the floor is
    # measured on the eight alone. That is a lower bound of the suite's
    # coverage (the lane only adds lines), so a pass is a true pass and the
    # floor cannot pass on lines nobody ran; it fails spuriously only if the
    # eight alone fall under 70% while the lane would lift them over. On
    # 2026-11-17 the eight alone covered 89% (run 44174820655) and all eleven
    # 91% (run 44179448721), as main's eight did before the lane. A pull
    # request that lands there is labeled ci:full, which runs the lane and
    # counts it.
    needs: [test, test-heavy, scope]
    if: ${{ !cancelled() && needs.scope.outputs.data_only != 'true' }}
    runs-on: *short-runner
    env:
      # The two shard counts the floor expects: ci.yml's test and test-heavy
      # matrices (tests/test_ci_workflow.py holds them equal).
      TEST_SHARDS: "8"
      HEAVY_SHARDS: "3"
    # The shadow test selection reads the per-test footprint map (an artifact
    # of the "Test map" workflow's runs) and the pull request's labels; its
    # comparison reads the test shards' failure records (this run's artifacts).
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Collect every shard's coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: shards
      # Shadow test selection (scripts/ci/testmap.py): which tests this pull
      # request's diff can reach, from the newest per-test footprint map at or
      # before its base, and which of this run's failures it would have
      # missed. Report only: nothing reads it to decide what runs, the test
      # job ran every shard, and neither step can fail the job. Here rather
      # than in the scope job, which every path-scoped job waits on. Before
      # the floor, which exits on a failed shard.
      - name: Shadow test selection (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/ci/testmap.py shadow --base "${PR_BASE_SHA}" --head "${GITHUB_SHA}"
          --pr "${PR_NUMBER}" --out selection.json.gz
      # Every test shard's failure record. A missing one (a cancelled or
      # timed-out shard) makes the comparison say "unavailable", not zero.
      - name: Collect every shard's failed tests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-failures-*
          path: test-failures
      - name: Failures outside the shadow selection (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        # The heavy lane's records (test-failures-heavy-*) count against its
        # own result: a skipped lane failed nothing.
        env:
          TEST_RESULT: ${{ needs.test.result }}
          HEAVY_RESULT: ${{ needs.test-heavy.result }}
        run: python3 scripts/ci/testmap.py compare --selection selection.json.gz --failures test-failures
      - name: Upload the shadow test selection
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-selection
          path: selection.json.gz
          retention-days: 7
          if-no-files-found: ignore
      - name: Combine and enforce the floor
        run: |
          set -euo pipefail
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "a test shard did not pass; coverage over a partial run is not"
            echo "a measurement of this commit"
            exit 1
          fi
          case "${{ needs.test-heavy.result }}" in
            success) heavy="${HEAVY_SHARDS}" ;;
            skipped) heavy=0 ;;
            *)
              echo "the heavy lane did not pass (${{ needs.test-heavy.result }}); coverage"
              echo "without it is not a measurement of this commit"
              exit 1 ;;
          esac
          # download-artifact gives one directory per artifact; coverage
          # combine wants distinct file names in one place.
          i=0
          shards=0
          lane=0
          for f in shards/coverage-*/coverage-*.dat; do
            [ -f "$f" ] || continue
            i=$((i + 1))
            cp "$f" ".coverage.${i}"
            case "$(basename "$f")" in
              coverage-heavy-*) lane=$((lane + 1)) ;;
              *) shards=$((shards + 1)) ;;
            esac
          done
          echo "combining ${shards} test shard(s) and ${lane} heavy lane shard(s)"
          test "${shards}" -eq "${TEST_SHARDS}" || { echo "expected ${TEST_SHARDS} test shards' coverage"; exit 1; }
          test "${lane}" -eq "${heavy}" || { echo "expected ${heavy} heavy lane shards' coverage"; exit 1; }
          uv run coverage combine
          uv run coverage report --show-missing --skip-covered --fail-under=70

  # The same suite, run once with the provider-lifecycle clock pinned PAST every
  # scheduled cutover.
  #
  # provider_lifecycle.py schedules effective-dated retirements and price
  # changes. A test written on the near side of one passes right up to the
  # announced minute and then turns main red for every open pull request with
  # no code change -- Wafer's three routes at 2026-08-17 00:00 UTC did exactly
  # that (CI run 31980690855), and the fix landed hours later in PR #628. This
  # job moves that failure to the pull request that writes the test.
  #
  # Cheap: no service containers and no coverage, so the conformance backends
  # skip and this is the plain suite once more. It is a separate job rather
  # than a second step in `test` so the two clocks report separately -- a red
  # here means "this will break on <date>", not "this is broken".
  #
  # It can fail only where `test` passes through something that differs
  # between the two clocks, so it is path-scoped (run_post_cutover): it runs,
  # on every event, for any change to application code or data, to the
  # harness every test runs under, to a test fixture, the pricing scripts or
  # the Python toolchain, for a changed line elsewhere that names a lifecycle
  # identifier or an entity with a scheduled change, and on every dispatch
  # (the price refresh gates publication on its run). commit_scope.py's
  # docstring has the rule and what it leaves out. It does not run on a push
  # to main (commit_scope.py's SKIPPED_ON_PUSH): a red here means something
  # breaks on a future scheduled date, not that the commit is broken, the
  # pull request already ran it under the same rule, and a combination of
  # pull requests that fails only past a cutover reddens the next pull
  # request that runs it, weeks before the cutover. post-cutover-daily.yml,
  # run by hand, runs it on demand.
  test-post-cutover:
    needs: scope
    if: github.event_name != 'push' && needs.scope.outputs.run_post_cutover != 'false'
    # Sharded for the same reason as `test`: gate-on-ci waits for the whole
    # run, so the slowest job sets deploy latency. Leaving this one unsharded
    # would just move the bottleneck here.
    # A wedged shard otherwise burns GitHub's 6-hour default: seen twice on
    # 2026-08-26 (one shard at 2h16m, another run's shard idle for hours)
    # while every sibling finished in under 9 minutes. pytest-timeout=600
    # bounds a hung TEST, but not collection, fixture teardown, or a wedged
    # xdist worker — this bounds the job whatever wedges.
    #
    # 25 minutes then started cutting off shards that were finishing: on
    # 2026-10-15 runs 38778257165, 38786461389 and 38809305127 cancelled
    # five shards at 96-99% with no failing test, and rerunning two of them
    # cancelled them again at the same point, so it was weight, not a wedge.
    # A shard spends two to two and a half minutes before its first test
    # (checkout, uv sync, collecting about 49k tests, four workers; #2377's
    # run), and its last few percent can take six minutes while one worker
    # holds a long test.
    # 35 keeps the wedge bound (the wedge sat at 2h16m) and leaves a
    # finishing shard alone; main's slowest shard on twelve shards took
    # 20.1 minutes (38808849971).
    #
    # When the only Python that changed is outside src/, the scope job lists
    # the test files that can reach it (post_cutover_tests) and the suite runs
    # on those, in one shard; an empty list is the whole suite, in eight.
    # commit_scope.py only lists paths of [A-Za-z0-9_./-], and the step reads
    # the list from the environment, not from an expression in the script.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.post_cutover_tests == '' && '[1, 2, 3, 4, 5, 6, 7, 8]' || '[1]') }}
    runs-on: ubuntu-24.04
    env:
      TEST_SHARDS: ${{ needs.scope.outputs.post_cutover_tests == '' && '8' || '1' }}
      POST_CUTOVER_TESTS: ${{ needs.scope.outputs.post_cutover_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Check out enclave source for the mandatory Sentry guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Lore-Hex/quill-cloud-proxy
          ref: main
          path: .security/quill-cloud-proxy
          sparse-checkout: enclave-go
          persist-credentials: false
      - name: Require and inspect enclave source
        run: |
          echo "TR_ENCLAVE_SOURCE_ROOT=$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" >> "$GITHUB_ENV"
          git -C .security/quill-cloud-proxy rev-parse HEAD
          TR_ENCLAVE_SOURCE_ROOT="$GITHUB_WORKSPACE/.security/quill-cloud-proxy/enclave-go" uv run python -m scripts.check_enclave_sentry
      # Computed from _RETIREMENTS rather than hard-coded, so adding a
      # retirement moves this clock with it and no one has to remember. The
      # max() with now() keeps the clock in the future once every announced
      # cutover is in the past.
      - name: Pin the lifecycle clock past the latest scheduled cutover
        run: |
          uv run python -c '
          import os
          from datetime import UTC, datetime, timedelta
          from trusted_router.provider_lifecycle import latest_scheduled_cutover
          clock = max(latest_scheduled_cutover(), datetime.now(UTC)) + timedelta(days=1)
          stamp = clock.strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TR_LIFECYCLE_CLOCK_OVERRIDE={stamp}\n")
          print(f"lifecycle clock pinned to {stamp}")
          '
      - name: Use the independent post-cutover profile
        # --durations-path is both the split input and the recording output.
        run: cp .test_durations-post-cutover durations-${{ matrix.shard }}.json
      - name: Tests with every scheduled cutover already past
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m "not provider_health and not proof_oracle"
          --splits ${{ env.TEST_SHARDS }} --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --store-durations --durations-path=durations-${{ matrix.shard }}.json --clean-durations
          ${POST_CUTOVER_TESTS}
      - name: Upload this shard's durations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-post-cutover-${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          retention-days: 7

  # Frozen reference tracing is intentionally separate from coverage tracing;
  # no cloud identity needed.
  # The oracle builds its catalog from each case's fixture body
  # (tests/test_async_settle_proof.py `catalog`), not from the published
  # snapshot, so a data-only commit cannot change its result and skips it.
  # It is path-scoped too (run_proof_oracle): the application and the test
  # modules and fixtures it loads, listed in commit_scope.py.
  proof-oracle:
    needs: scope
    if: needs.scope.outputs.data_only != 'true' && needs.scope.outputs.run_proof_oracle != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The default lifecycle clock only. The two legs share the clock and
        # every endpoint they settle is a fixture without an effective-dated
        # price or retirement, which
        # tests/test_async_settle_proof_oracle.py holds; 666 pairs of
        # default and post-cutover shards in 31 hours of runs before this
        # change never disagreed. post-cutover-daily.yml, run by hand, runs
        # the post-cutover clock.
        clock: [default]
        # Four-group runs 38924732345 took 43 to 45+ minutes with 1,252 cases.
        # Six groups per clock bound estimated single-worker work per group
        # to about two thirds of the four-group work; keep the 45-minute cap.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Pin the lifecycle clock past the latest scheduled cutover
        if: matrix.clock == 'post-cutover'
        run: |
          uv run python -c '
          import os
          from datetime import UTC, datetime, timedelta
          from trusted_router.provider_lifecycle import latest_scheduled_cutover
          clock = max(latest_scheduled_cutover(), datetime.now(UTC)) + timedelta(days=1)
          stamp = clock.strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TR_LIFECYCLE_CLOCK_OVERRIDE={stamp}\n")
          print(f"lifecycle clock pinned to {stamp}")
          '
      - name: Copy oracle split weights for recording
        run: cp .test_durations durations-${{ matrix.shard }}.json
      - name: Frozen-main proof matrix without coverage
        run: >-
          uv run pytest -q -n 4 --dist loadgroup
          -m proof_oracle tests/test_async_settle_proof_oracle.py tests/test_async_settle_shadow_v2_gate_window.py
          --splits 6 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --store-durations --durations-path=durations-${{ matrix.shard }}.json --clean-durations
      - name: Upload oracle durations separately from the full suites
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-oracle-${{ matrix.clock }}-${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Install npm deps
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # playwright.config.js starts the app itself (uv run uvicorn, memory
      # backend) and waits on /health — no DB service containers needed.
      - name: Homepage JavaScript regression checks
        run: node --test tests/js/homepage_*.test.cjs
      - name: Browser smoke
        run: npm run test:browser

  # The BYOK envelope ordering constraint, checked against the DIFF rather than
  # against a deploy.
  #
  # The rule (docs/design/byok-aad-v2-migration.md section 4.1): a control plane
  # may only write envelope formats every enclave serving its cloud already
  # reads. Break it and every BYOK key in that cloud's database stops opening at
  # the next inference request. The dangerous act is a code change to what gets
  # written, which is exactly the thing a pull request contains, so this belongs
  # here and NOT in deploy.yml. Being in ci.yml still reaches deploys the way
  # every job here does -- deploy.yml's gate-on-ci refuses a commit whose CI is
  # red -- but it runs once per push rather than on every deploy, and a refusal
  # lands on the pull request that caused it before it can land on main.
  #
  # Cheap and offline on an ordinary pull request. The script compares what this
  # tree writes against BASELINE_WRITTEN_FORMATS and, when they are equal, exits
  # 0 without fetching a release record, contacting an attestation endpoint or
  # reading the enclave repository. It reaches the network only when the written
  # set has CHANGED, and then it fails closed. So no `continue-on-error` and no
  # network-flake exemption: the path that can be flaky is the path a format
  # change opted into. The offline half is kept true by
  # tests/test_check_format_ordering.py, in
  # test_an_unchanged_write_side_is_silent_and_reads_no_network, which drives
  # the real main() with every network seam replaced by a function that raises.
  byok-format-ordering:
    needs: scope
    if: needs.scope.outputs.data_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-router/.github/actions/setup-uv@94d14eeadf77a2014d3c981e7dcb6ef793ae7fed # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      # `-m` rather than a path: the script imports scripts.verify_trust_
      # measurements for the attestation samplers, so the repository root has to
      # be on sys.path.
      #
      # No token is passed. On the loud path the enclave reads go to a different
      # repository, which GITHUB_TOKEN does not cover, and the script reads
      # GH_TOKEN only to raise the anonymous rate limit -- so anonymous is what
      # it uses here. A rate-limited read is an HTTP error, and an HTTP error
      # fails this check rather than being assumed away.
      - name: BYOK written formats vs what every enclave accepts
        run: uv run python -m scripts.check_format_ordering

  # The Go service of the fast-admission design (docs/design/fast-admission-
  # spike.md). Its shadows are held to their TLA+ specs here: each test runs
  # the pinned TLC from proofs/ on a small instance and compares every step,
  # so this job needs Java as well as Go.
  # This job, fastpath-spanner and fastpath-walks are path-scoped
  # (run_fastpath): the module and the files its tests read outside it
  # (proofs/, scripts/deploy/*.sh, tests/fixtures/usage_cost_vectors.json),
  # listed in commit_scope.py's FASTPATH_INPUTS.
  fastpath:
    # Reads fastpath/testdata/model_alias_vectors_v1.json, which the refresh
    # regenerates; that file is deliberately NOT a data-only path, so a
    # refresh commit that changes it runs this job.
    needs: scope
    if: needs.scope.outputs.data_only != 'true' && needs.scope.outputs.run_fastpath != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The module stays on the patched Go 1.26 toolchain: a dependency that needs a
    # later Go fails the build rather than fetching a newer toolchain.
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: fastpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: fastpath/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the TLA+ tools jar
        working-directory: proofs
        run: sha256sum -c tla2tools.jar.sha256
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      # The whole-graph comparisons with TLC are single-threaded and some ten
      # times slower under the race detector. The files that hold them say
      # `//go:build !race`, so the step above leaves them out and this one,
      # without the race detector, runs them with everything else.
      # AuditorCommit's five configurations take about five minutes on a
      # laptop and ran past ten here beside the other packages, Go's default
      # timeout for a package's tests.
      - name: go test, with the comparisons against TLC
        run: go test -count=1 -timeout 30m ./...

  # The spike's store (fastpath/internal/store) against the Spanner emulator,
  # at the image the spanner-emulator job pins. The emulator runs one
  # read-write transaction at a time, so the tests run one package at a time.
  # With FASTPATH_SPANNER_EMULATOR=1 an emulator that cannot be reached fails
  # the tests; the fastpath job, without it, skips them.
  fastpath-spanner:
    needs: scope
    if: needs.scope.outputs.data_only != 'true' && needs.scope.outputs.run_fastpath != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      FASTPATH_SPANNER_EMULATOR: "1"
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator@sha256:c6f3402f2599684f295a0fdefb6fbbbfb18a0e43e309ff5456ccb452a4570a79
        ports:
          - 9010:9010
          - 9020:9020
    defaults:
      run:
        working-directory: fastpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: fastpath/go.sum
      - name: Wait for the Spanner emulator (fail if unavailable)
        run: |
          for _ in $(seq 1 120); do
            (exec 3<>/dev/tcp/127.0.0.1/9010) 2>/dev/null && exit 0
            sleep 0.5
          done
          echo "the Spanner emulator did not start"
          exit 1
      - name: The store against the emulator
        run: go test -race -count=1 -p 1 ./internal/store/...
      # The owner's, the auditor's, the front door's, the service's, the
      # gateway state cache's, fastpathctl's and loadgen's tests against the
      # store skip without the emulator, so the fastpath job runs none of
      # them; they run here.
      - name: The owner, the auditor, the front door, the service, the gateway state cache, fastpathctl and loadgen against the emulator
        run: go test -race -count=1 -p 1 ./internal/owner/... ./internal/auditor/... ./internal/frontdoor/... ./internal/service/... ./internal/gwstate/... ./cmd/fastpathctl/... ./cmd/loadgen/...
      # The watch's store sources need the emulator; its other tests run in
      # the fastpath job too.
      - name: The watch against the emulator
        run: go test -race -count=1 -p 1 ./internal/watch/... ./cmd/fastpathwatch/...

  # The walks (walk_test.go, debt_walk_test.go) drive the store through
  # thousands of transactions: about two hours for the debt walk, past Go's default
  # ten minutes and past the store job's time. They say `//go:build !race`,
  # so the store job leaves them out; each runs here in a job of its own,
  # without the race detector, against an emulator of its own.
  fastpath-walks:
    needs: scope
    if: needs.scope.outputs.data_only != 'true' && needs.scope.outputs.run_fastpath != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    strategy:
      fail-fast: false
      matrix:
        walk: [TestTheStoreWalksWithAuditorCommit, TestTheStoreKeepsCreditDebtsClaims]
    env:
      GOTOOLCHAIN: local
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010
      FASTPATH_SPANNER_EMULATOR: "1"
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator@sha256:c6f3402f2599684f295a0fdefb6fbbbfb18a0e43e309ff5456ccb452a4570a79
        ports:
          - 9010:9010
          - 9020:9020
    defaults:
      run:
        working-directory: fastpath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: fastpath/go.sum
      - name: Wait for the Spanner emulator (fail if unavailable)
        run: |
          for _ in $(seq 1 120); do
            (exec 3<>/dev/tcp/127.0.0.1/9010) 2>/dev/null && exit 0
            sleep 0.5
          done
          echo "the Spanner emulator did not start"
          exit 1
      - name: ${{ matrix.walk }} against the emulator
        run: go test -count=1 -p 1 -timeout 240m -run '^${{ matrix.walk }}$' ./internal/store/

  # Model checking. The property tests in `tests/` run inside the `test` job
  # like any other pytest file; this job is for the TLA+ specs in `proofs/`,
  # which need a JVM and TLC and have nothing to do with the Python suite.
  #
  # These specs cover designs whose failure modes are concurrent or temporal:
  # things a test cannot reach because the composition being checked does not
  # exist in code yet. proofs/README.md lists them and the rules they follow.
  #
  # check.sh model-checks every spec, then runs every mutant in
  # proofs/manifest.toml. On this runner the script took seven and a half
  # minutes with three specs (#1515, 2026-10-04), and 15 to 26 minutes over
  # 20 green main runs to 2026-11-06. timeout-minutes is a runaway guard, not
  # a target. If the job nears it, tighten a spec's constants rather than
  # dropping the job: an unchecked spec is worse than no spec, because it
  # reads as evidence.
  #
  # Outside proofs/, check.sh reads only whether the code and tests the
  # manifest names for each spec exist (and that a planned spec's code does
  # not). None of it says whether deployed code works. So it is path-scoped
  # (run_proofs): it runs, on every event, when proofs/ or a path the
  # manifest names changed, and skips otherwise, which frees a runner for 15
  # to 26 minutes a run in the organization's capped queue. A push to main
  # runs it under the same rule, so two pull requests that combine into a
  # spec that no longer holds redden the push that combines them.
  # post-cutover-daily.yml, run by hand, runs it on demand.
  # Branch protection requires the CI summary below, which needs this job, so
  # a pull request cannot merge with it red (say, after a file the manifest
  # names moves). A run that reaches the limit fails the summary and holds the
  # merge until a rerun, so the limit is about twice the slowest green run.
  proofs:
    needs: scope
    if: needs.scope.outputs.data_only != 'true' && needs.scope.outputs.run_proofs != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # The model checker is in the repository, pinned by its sha256, which
      # check.sh verifies before it runs anything (see proofs/check.sh).
      - name: Model-check every spec
        run: ./proofs/check.sh

  # The run's conclusion, derived from every job's result. GitHub concludes a
  # run success when its jobs succeeded or were skipped; this job accepts a
  # skipped job only when it is one of the jobs above that carry the data-only
  # condition AND `scope` classified the commit as data-only, or one of the
  # path-scoped jobs (commit_scope.py's PATH_SCOPED_JOBS) AND `scope` set its
  # flag to exactly `false`, or the post-cutover suite on a push to main
  # (commit_scope.py's SKIPPED_ON_PUSH), and fails on a failed `scope`, a
  # failed job, or a skip for any other reason. NEEDS carries the scope
  # job's outputs. The deploy
  # gate and the price-refresh gate read the run's conclusion, which this job
  # now determines, and branch protection requires the `CI` check.
  # !cancelled() rather than always(): a cancelled run releases its slot.
  ci:
    name: CI
    needs:
      - scope
      - lint
      - spanner-emulator
      - frontend
      - production-import
      - test
      - test-heavy
      - coverage
      - test-post-cutover
      - proof-oracle
      - browser
      - byok-format-ordering
      - fastpath
      - fastpath-spanner
      - fastpath-walks
      - proofs
    if: ${{ !cancelled() }}
    runs-on: *short-runner
    env:
      NEEDS: ${{ toJSON(needs) }}
      DATA_ONLY: ${{ needs.scope.outputs.data_only }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job succeeded, or was skipped for a data-only commit, unchanged inputs or a push
        run: python3 scripts/ci/commit_scope.py summarize
