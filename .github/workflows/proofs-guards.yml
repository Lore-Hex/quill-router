name: Proofs guard tables

# Runs every row of every guard table again (proofs/guard_sweep.py --verify):
# each guard is removed from its spec and must break what its row says, or
# nothing if its row says so. CI's `proofs` job checks on every pull request
# that a table lists its spec's guards and was swept against the spec as it
# is. This checks that the table is true. That takes a model-checking run per
# guard, so it runs only when proofs/ changes, in eight parts: AuditorCommit's
# table, with its liveness claim, took four parts past their hour.

on:
  pull_request:
    branches: [main]
    paths:
      - "proofs/**"
      - ".github/workflows/proofs-guards.yml"
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - ".github/workflows/proofs-guards.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: proofs-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The model checker is in the repository, pinned by its sha256 (see the
      # top of proofs/check.sh).
      - name: Check the TLA+ tools jar
        run: cd proofs && sha256sum -c tla2tools.jar.sha256
      - name: Verify the guard tables
        run: python3 proofs/guard_sweep.py --verify --shard ${{ matrix.shard }}/8
