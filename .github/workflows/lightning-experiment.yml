name: LightningRouter archived-source checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/lightning_router
    env:
      LR_TEST_POSTGRES_URL: postgresql+psycopg://postgres:local-test-only@127.0.0.1:5432/lightning_router_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: lightning_router_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q --cov=lightning_router --cov-fail-under=70
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- web/app.js web/pages.js
      - run: npm test
      - run: npm run test:omp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify standalone source export builds identically
        if: github.repository == 'Lore-Hex/quill-router'
        run: |
          python ../../scripts/lightning/export_repository.py --ref "$GITHUB_SHA" --output "$RUNNER_TEMP/lightning-public"
          cd "$RUNNER_TEMP/lightning-public/experiments/lightning_router"
          npm ci --ignore-scripts
          npm run build
          cmp web/app.js "$GITHUB_WORKSPACE/experiments/lightning_router/web/app.js"
          cmp web/pages.js "$GITHUB_WORKSPACE/experiments/lightning_router/web/pages.js"
      - run: docker build --tag lightning-router-ci .
