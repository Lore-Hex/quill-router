name: Secret scan

# SOC 2 CC7.1: automated secret scanning, alongside dependency-scan.yml.
# gitleaks reads the patches of the commits a change adds and fails the job
# when one of them contains something shaped like a credential (cloud keys,
# provider API keys, private keys, tokens, high-entropy assignments).
#
#  * pull_request: scans only the commits the PR adds (base..head).
#  * push to main: scans the pushed range (before..after). A push whose
#    `before` commit is not in the clone (a new branch, a rewritten history)
#    falls back to the full history reachable from the pushed commit.
#  * workflow_dispatch: full history of the dispatched ref, for audits.
#
# Every mode FAILS on a finding. `--redact` replaces the matched value with
# REDACTED in the log, so a finding names the commit, file, line and rule but
# never prints the secret (this repository is public). A real finding means the
# credential is already exposed in git: rotate it first, then rewrite the
# commit; deleting the line in a later commit does not unexpose it.
#
# Known non-secrets (generated test vectors, digests, public evidence) are
# allowlisted in .gitleaks.toml, scoped by path AND rule, and reviewed
# historical findings are fingerprinted in .gitleaksignore. A one-off fake value
# in new code takes an inline `gitleaks:allow` comment. Changes to either file
# are reviewed like code: they decide what this job cannot see.
#
# The gitleaks binary is downloaded from its GitHub release and verified
# against a pinned sha256 (taken from that release's checksums file, which must
# also agree) instead of using gitleaks-action, which needs a paid license for
# organization repositories.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

# One scan per branch or pull request; a newer push cancels the scan of the
# commit it supersedes (same reason as ci.yml: superseded runs starved the
# 2026-10-20 queue). Main keeps one scan per commit, as ci.yml does.
concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan walks commit history, so it needs the commits, not just
          # the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$checksums" "$base/$checksums"
          # The pinned digest is the trust anchor; the release's own checksums
          # file must list the same digest for the same tarball.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          grep -qxF "${GITLEAKS_SHA256}  ${tarball}" "$checksums" \
            || { echo "::error::$checksums does not list the pinned digest"; exit 1; }
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan added commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="$PUSH_AFTER"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *)
              range="$GITHUB_SHA"
              ;;
          esac
          # Every end of the range must resolve. gitleaks scans an unknown range as
          # "0 commits, no leaks", and a failing $(...) inside echo does not stop
          # the step, so check each commit and take the count on its own line.
          for end in ${range/../ }; do
            git rev-parse --verify --quiet "${end}^{commit}" >/dev/null \
              || { echo "::error::cannot resolve ${end}; refusing to pass an unscanned range"; exit 1; }
          done
          count=$(git rev-list --count "$range")
          echo "Scanning ${count} commit(s): $range"
          # Without --diff-merges git log prints no diff for a merge commit, so a
          # secret added while resolving a merge would never be scanned. gitleaks
          # cannot parse combined (--cc) diffs; first-parent shows what the merge
          # brought in, including anything added during the merge itself.
          gitleaks git --redact --verbose --no-banner --exit-code 1 \
            --config .gitleaks.toml --log-opts="--diff-merges=first-parent $range" .
