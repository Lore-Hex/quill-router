name: Price refresh alerting

on:
  workflow_run:
    workflows: ["Refresh upstream prices"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

# Serialize the durable cooldown ledger, including manual/periodic checks.
concurrency:
  group: price-refresh-alerts
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    # workflow_run matches the triggering workflow by name, and a fork pull
    # request can add a workflow with any name, so a workflow_run trigger
    # counts only when it came from this repository's own scheduled or
    # dispatched price refresh (tests/test_workflow_run_guard.py).
    if: >-
      github.repository == 'Lore-Hex/quill-router'
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never run code or download artifacts from the triggering run. This
      # observer is independent of refresh dependency installation and GCP auth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Report refresh failures and freshness to Sentry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TR_SENTRY_DSN: ${{ secrets.PRICE_REFRESH_SENTRY_DSN }}
          TR_REFRESH_RUN_ID: ${{ github.event.workflow_run.id }}
        # The independent systemd observer owns the watchdog heartbeat.
        # Completion events must not hide an outage of that observer.
        run: python3 scripts/price_refresh_alerts.py --no-heartbeat
