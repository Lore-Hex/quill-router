name: Configure Gateway Reliability Alerts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to reconcile production alert policies"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-gateway-reliability-alerts
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'Lore-Hex/quill-router'
    runs-on: ubuntu-latest
    # gateway_reliability.sh can wait up to five minutes for a new counter
    # (its NEW_COUNTER_RETRIES budget) on top of its ordinary run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "${CONFIRMATION}" != "APPLY" ]; then
            echo "Refusing production mutation: type APPLY in confirmation."
            exit 2
          fi
      - name: Authenticate to GCP
        uses: Lore-Hex/quill-router/.github/actions/gcp-auth@bada0072c1cdc70a095bee380e6a6a7fdfb2cf8e # main 2026-11-23
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: Lore-Hex/quill-router/.github/actions/setup-gcloud@bada0072c1cdc70a095bee380e6a6a7fdfb2cf8e # main 2026-11-23
        with:
          install_components: beta
      - name: Reconcile gateway reliability alerts
        run: bash scripts/deploy/gateway_reliability.sh --apply
