[project]
name = "lightning-router-funding"
version = "0.1.0"
description = "Isolated BTC funding surface for LightningRouter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "segno>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=7", "hypothesis>=6", "mypy>=1.13", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["lightning_router"]
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
