\* A variant of TerminalOrder.cfg: two requests that do not stream, the first
\* of which a forced exit's hand-off may name, and two front-door appends.
\*
\* Their drain rows interleave as the main configuration's cannot, with one
\* append. One row each puts a hold's first row after another hold's while
\* the owner is active, so an adoption must take its own hold's first row,
\* not the log's. And the auditor's reap of the listed hold, then a row of
\* its own and one of the other's, puts two rows of one hold before
\* another's, which ApplyDrain must read one at a time: a drain log that
\* the main configuration with two appends had, where the stream's durable
\* heartbeat let the auditor reap it.
\*
\* Two authorizations, one listable, and two front-door appends: 1,594,624
\* distinct states, which the shadow's comparison reads every one of.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with 8
\* workers on a 16-core Apple M4 Max, OpenJDK 21: 8,003,985 states
\* generated, 1,594,624 distinct, search depth 25, in a minute. One measured
\* run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1, a2}
    Streams = {}
    Declared = {}
    Listable = {a1}
    MaxAppends = 2

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
