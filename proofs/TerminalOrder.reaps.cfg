\* A variant of TerminalOrder.cfg: two requests that do not stream, each of
\* which a forced exit's hand-off may name, and no front-door append.
\*
\* With both listed and neither ending, the auditor reaps both, and the
\* second reap may come before the first's row is applied: the store's reap
\* needs no row of its own hold, while other holds' rows may wait. Two
\* reaps are then outstanding at once, which no other configuration has,
\* each applying to its own hold.
\*
\* Two authorizations, both listable, and no appends: 342,632 distinct
\* states, which the shadow's comparison reads every one of.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with 8
\* workers on a 16-core Apple M4 Max, OpenJDK 21: 1,858,757 states
\* generated, 342,632 distinct, search depth 23, in 13 seconds. One measured
\* run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1, a2}
    Streams = {}
    Declared = {}
    Listable = {a1, a2}
    MaxAppends = 0

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    NoListedHoldClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
