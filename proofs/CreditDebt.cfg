\* Model-checking configuration for CreditDebt.
\*
\* One lease on a workspace of two credit shards with three units of credit
\* each. The lease holds two units, and two holds are admitted in a behaviour,
\* so a hold that settles for three overruns it and the shortfall has to come
\* from somewhere. The owner may be cut off once, and may die.
\*
\* WHAT THE BOUNDS LEAVE OUT
\*
\*   One lease. Leases share only the credit rows, and a second lease is in
\*   the variant `two`, where the trust allowance has something to refuse.
\*
\*   No synchronous reservations and no payments. They write the credit rows
\*   as a lease's booking does, and are in the variant `money`.
\*
\*   Charges are 0 or 3: a refund, and an overrun by two. A charge of one, the
\*   estimate, moves nothing a claim reads. A reap charges 0 or 1, at most its
\*   hold (assumption A2).
\*
\*   The owner writes its own shortfall. The variant `silent` has one that
\*   never does, which section 5.1 asks for: the first claim must hold
\*   without it.
\*
\*   Nothing here is checked with a CONSTRAINT.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 227,163 states generated, 82,439 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    NShards = 2
    Leases = {l1}
    CreditEach = 3
    LeaseSize = 2
    Allowance = 2
    Floor = 0
    Charges = {0, 3}
    Reaps = {0, 1}
    MaxHolds = 2
    MaxSync = 0
    MaxPays = 0
    PaySize = 2
    MaxCuts = 1
    OwnerWrites = TRUE

INVARIANTS
    TypeOK
    OwnerBooksBalance
    HoldsCoveredInSpanner
    StoredCoversOwner
    StoredShortfallWithinOwners
    ShortfallIsBeingWritten
    ShortfallLandsWithinTwoWrites
    ShardIdentity
    AllocationAccounted
    BookedOnce
    UsageIsBooked
    ExposureWithinAllowance
    DebtMarksEveryShard
    MarkMeansDebt
    CreditConserved

PROPERTIES
    StoredShortfallNeverFalls
    StoredShortfallIsTheLarger
    MarkRefusesReservations
    RepaysDebtFirst
