# What each spec in proofs/ is held to. proofs/check_mutants.py reads this
# file, and proofs/check.sh runs it after model-checking every spec.
#
# state     planned      the code is not written; no `code` path may exist
#           implemented  every `code` and `tests` path must exist
#           orphaned     the code was deleted; `retire_with` names the spec
#                        that replaces this one, and the check fails once
#                        that spec is here
#
# mutants   One replacement of `old` by `new` in the spec's text, and the one
#           invariant (`violates`) or temporal property (`violates_property`)
#           it must break. The mutated spec is checked against that claim
#           alone. Every invariant and property in a spec's .cfg needs at
#           least one mutant that breaks it: a claim nothing can break is not
#           yet shown to say anything.
#
# survivors A replacement the spec says breaks nothing. It is checked against
#           the spec's whole .cfg and must find no error.
#
# variants  <Spec>.<variant>.cfg is another instance of the same model, for a
#           hazard the main instance cannot reach. A mutant or survivor runs
#           against it with `cfg = "<variant>"`. A variant must check
#           something, needs a mutant of its own, and may check only claims
#           the main configuration checks or one of its own mutants breaks.
#
# guards    <Spec>.guards.toml lists every guard of every action and what
#           breaks when it alone is removed, with a reason for each that
#           breaks no claim. proofs/guard_sweep.py writes it, and
#           `guard_sweep.py --verify` runs every row again (CI does, when
#           proofs/ changes). An entry with no table says why:
#           `unswept = "..."`.
#
# `old` must occur exactly once in the spec. Strings are TOML literals, so a
# backslash is a backslash.
#
# The check of `code` and `tests` is existence only. It cannot tell an
# orphaned spec's deleted path from one that never existed; `git log
# --diff-filter=D -- <path>` can, and review runs it.

[AutoRefillHandoff]
state = "implemented"
unswept = "written before the guard table; its mutants are its hand-run notes"
code = [
    "src/trusted_router/services/auto_refill.py",
    "src/trusted_router/services/auto_refill_outbox_drain.py",
    "src/trusted_router/storage_gcp_settle_outbox.py",
]
tests = ["tests/test_auto_refill.py"]

[[AutoRefillHandoff.mutants]]
name = "stripe-forgets-the-key"
violates = "NoDoubleCharge"
old = '''
    /\ requestKey[e] \notin AssignedKeys(e)
'''
new = '''
'''

[[AutoRefillHandoff.mutants]]
name = "a-key-per-path"
violates = "NoDoubleCharge"
old = '''
InlineKey(e) == SettlementKey(e)
'''
new = '''
InlineKey(e) == BucketKey(e, bucket[e])
'''

[[AutoRefillHandoff.mutants]]
name = "finalize-without-attachment"
violates = "NoSilentDrop"
old = '''
    /\ (site = "combined" \/ ~finalizeFailed[e])
    /\ attachmentConfirmed[e]
'''
new = '''
    /\ (site = "combined" \/ ~finalizeFailed[e])
'''

[[AutoRefillHandoff.mutants]]
name = "no-exception-read-as-attached"
violates = "NoSilentDrop"
old = '''
    /\ ~attachmentConfirmed[e]
    /\ deliverySurface' = [deliverySurface EXCEPT ![e] = "none"]
    /\ UNCHANGED <<
        thresholdCrossed, finalized, deliveryCount, rowOrigin, rowState,
        refillStatus, attachmentConfirmed, finalizeFailed, bucket,
'''
new = '''
    /\ ~attachmentConfirmed[e]
    /\ attachmentConfirmed' = [attachmentConfirmed EXCEPT ![e] = TRUE]
    /\ UNCHANGED <<
        thresholdCrossed, finalized, deliveryCount, rowOrigin, rowState,
        refillStatus, deliverySurface, finalizeFailed, bucket,
'''

[[AutoRefillHandoff.mutants]]
name = "charge-from-the-internal-surface"
violates = "ChargeOnlyWhereCredentialed"
old = '''
    /\ site \in CredentialedSurfaces
'''
new = '''
'''

[[AutoRefillHandoff.mutants]]
name = "suppression-never-expires"
violates_property = "EventuallyCharged"
old = '''
    /\ suppression[e] = "fresh"
    /\ ~refillDue[e]
'''
new = '''
    /\ FALSE
    /\ suppression[e] = "fresh"
    /\ ~refillDue[e]
'''

[LeaseLifecycle]
# docs/design/fast-admission-and-batched-settlement.md, sections 4.2, 4.3,
# 4.7 and 4.8. Its shadow is a package of its own in the Go service.
state = "planned"
code = ["fastpath/internal/leaselifecycle"]

# Assumption A1, bounded skew, and what rests on it: the owner's cutoff and
# the auditor's two conditions on the expiry.

[[LeaseLifecycle.mutants]]
name = "skew-wider-than-allowed"
violates = "CutoffBeforeDrain"
old = '''
Readings == { c \in 0..(MaxTime + Skew) : c + Skew >= now /\ c <= now + Skew }
'''
new = '''
Readings == { c \in 0..(MaxTime + Skew) : c + Skew + 1 >= now /\ c <= now + Skew }
'''

# The same widening, by what it costs: section 5.1 says it must break
# Invariant 1.
[[LeaseLifecycle.mutants]]
name = "skew-wider-than-allowed-admits-under-a-draining-lease"
violates = "AdmittedOnlyUnderOpenLease"
old = '''
Readings == { c \in 0..(MaxTime + Skew) : c + Skew >= now /\ c <= now + Skew }
'''
new = '''
Readings == { c \in 0..(MaxTime + Skew) : c + Skew + 1 >= now /\ c <= now + Skew }
'''

[[LeaseLifecycle.mutants]]
name = "admit-without-the-skew-allowance"
violates = "CutoffBeforeDrain"
old = '''
WithinCutoff == \E c \in Readings : c + Skew < known
'''
new = '''
WithinCutoff == \E c \in Readings : c < known
'''

[[LeaseLifecycle.mutants]]
name = "drain-without-the-skew-allowance"
violates = "CutoffBeforeDrain"
old = '''
    /\ \E c \in Readings : c >= lease.expiry + Skew
'''
new = '''
    /\ \E c \in Readings : c >= lease.expiry
'''

[[LeaseLifecycle.mutants]]
name = "drain-on-a-stale-read"
violates = "CutoffBeforeDrain"
old = '''
    /\ lease.state = "open"
    /\ lease.expiry = audRead
    /\ lease' = [lease EXCEPT !.state = "draining"]
'''
new = '''
    /\ lease.state = "open"
    /\ lease' = [lease EXCEPT !.state = "draining"]
'''

[[LeaseLifecycle.mutants]]
name = "owner-extends-by-its-own-clock"
violates = "CutoffBeforeDrain"
old = '''
    /\ has
    /\ known' = answer
'''
new = '''
    /\ has
    /\ known' \in { c + Window : c \in Readings }
'''

[[LeaseLifecycle.mutants]]
name = "an-expiry-spanner-never-stored"
violates = "TypeOK"
old = '''
    /\ has
    /\ known' = answer
'''
new = '''
    /\ has
    /\ known' \in { c + Window : c \in Readings }
'''

[[LeaseLifecycle.mutants]]
name = "renew-a-draining-lease"
violates = "CutoffBeforeDrain"
old = '''
    /\ answer = NoAnswer
    /\ lease.state = "open"
    /\ ~lease.revoked
    /\ lease.epoch = epoch
'''
new = '''
    /\ answer = NoAnswer
    /\ lease.state # "closed"
    /\ ~lease.revoked
    /\ lease.epoch = epoch
'''

[[LeaseLifecycle.mutants]]
name = "owner-keeps-the-lease-it-marked-draining"
violates = "CutoffBeforeDrain"
old = '''
    /\ lease' = [lease EXCEPT !.state = "draining"]
    /\ has' = FALSE
'''
new = '''
    /\ lease' = [lease EXCEPT !.state = "draining"]
    /\ has' = has
'''

[[LeaseLifecycle.mutants]]
name = "owner-admits-past-its-cutoff"
violates = "AdmittedOnlyUnderOpenLease"
old = '''
    /\ Cardinality(Own) < LeaseSize
    /\ WithinCutoff
'''
new = '''
    /\ Cardinality(Own) < LeaseSize
'''

# Assumption A4: a process uses only the lease it was granted, until it lets
# it go. Each mutant adds what a recovery routine, a request that names the
# lease, or an answer handler that creates what it does not find would do.

[[LeaseLifecycle.mutants]]
name = "a-later-process-takes-up-the-lease"
violates = "SingleWriter"
old = '''
    \/ Restart
'''
new = '''
    \/ Restart
    \/ /\ ~has
       /\ lease.state = "open"
       /\ has' = TRUE
       /\ known' = lease.expiry
       /\ stopped' = FALSE
       /\ UNCHANGED << now, lease, epoch, answer, holds, handoff, listed,
                       audRead, paused, pausedFor, view, revokedFor >>
'''

[[LeaseLifecycle.mutants]]
name = "a-later-process-takes-up-the-lease-and-overfills-it"
violates = "HoldsFitAllocation"
old = '''
    \/ Restart
'''
new = '''
    \/ Restart
    \/ /\ ~has
       /\ lease.state = "open"
       /\ has' = TRUE
       /\ known' = lease.expiry
       /\ stopped' = FALSE
       /\ UNCHANGED << now, lease, epoch, answer, holds, handoff, listed,
                       audRead, paused, pausedFor, view, revokedFor >>
'''

# An answer that arrives after the process marked the lease draining, applied
# by a handler that creates the lease it does not find.
[[LeaseLifecycle.mutants]]
name = "an-answer-brings-the-lease-back"
violates = "AdmittedOnlyUnderOpenLease"
old = '''
    /\ answer # NoAnswer
    /\ has
    /\ known' = answer
    /\ answer' = NoAnswer
    /\ UNCHANGED << now, lease, epoch, has, stopped, holds, handoff, audRead,
                    paused, pausedFor, view, revokedFor, listed >>
'''
new = '''
    /\ answer # NoAnswer
    /\ has' = TRUE
    /\ stopped' = (has /\ stopped)
    /\ known' = answer
    /\ answer' = NoAnswer
    /\ UNCHANGED << now, lease, epoch, holds, handoff, audRead,
                    paused, pausedFor, view, revokedFor, listed >>
'''

[[LeaseLifecycle.mutants]]
name = "admit-beyond-the-allocation"
violates = "HoldsFitAllocation"
old = '''
    /\ Cardinality(Own) < LeaseSize
    /\ WithinCutoff
'''
new = '''
    /\ WithinCutoff
'''

# Revocation and pause.

[[LeaseLifecycle.mutants]]
name = "renew-a-revoked-lease"
violates = "RevocationBoundsAdmission"
old = '''
    /\ lease.state = "open"
    /\ ~lease.revoked
    /\ lease.epoch = epoch
'''
new = '''
    /\ lease.state = "open"
    /\ lease.epoch = epoch
'''

# The same rule for a renewal nobody is listening to. No admission follows
# from it, so only the row's own expiry shows it.
[[LeaseLifecycle.mutants]]
name = "replay-a-renewal-on-a-revoked-lease"
violates_property = "RevokedExpiryStays"
old = '''
    /\ lease.state = "open"
    /\ ~lease.revoked
    /\ lease.expiry < now + Window
'''
new = '''
    /\ lease.state = "open"
    /\ lease.expiry < now + Window
'''

# A renewal let through in the moment of the revocation and never after.
# The expiry it writes is a window after the revocation and no later, so a
# bound on the expiry would pass it; the expiry must not move at all.
[[LeaseLifecycle.mutants]]
name = "replay-a-renewal-in-the-moment-of-the-revocation"
violates_property = "RevokedExpiryStays"
old = '''
    /\ lease.state = "open"
    /\ ~lease.revoked
    /\ lease.expiry < now + Window
'''
new = '''
    /\ lease.state = "open"
    /\ (~lease.revoked \/ revokedFor = 0)
    /\ lease.expiry < now + Window
'''

[[LeaseLifecycle.mutants]]
name = "admit-on-a-view-that-says-stop"
violates = "PauseBoundsAdmission"
old = '''
    /\ WithinCutoff
    /\ ~view.paused
    /\ view.age <= CacheAge
'''
new = '''
    /\ WithinCutoff
    /\ view.age <= CacheAge
'''

[[LeaseLifecycle.mutants]]
name = "admit-on-a-stale-view"
violates = "PauseBoundsAdmission"
old = '''
    /\ ~view.paused
    /\ view.age <= CacheAge
'''
new = '''
    /\ ~view.paused
'''

# The drain's end, and assumption A3.

[[LeaseLifecycle.mutants]]
name = "close-before-the-longest-hold-ends"
violates = "NoOpenHoldOnClosedLease"
old = '''
    /\ \E c \in Readings : c >= lease.expiry + MaxLife + Grace
'''
new = '''
    /\ \E c \in Readings : c >= lease.expiry + Grace
'''

[[LeaseLifecycle.mutants]]
name = "close-without-the-grace"
violates = "NoOpenHoldOnClosedLease"
old = '''
    /\ \E c \in Readings : c >= lease.expiry + MaxLife + Grace
'''
new = '''
    /\ \E c \in Readings : c >= lease.expiry + MaxLife
'''

# A3 is what the close on time alone rests on, so the hold must outlive its
# life on the list as well: a list that dropped it would close the lease by
# the other way.
[[LeaseLifecycle.mutants]]
name = "a-hold-outlives-its-life"
violates = "NoOpenHoldOnClosedLease"
old = '''
                    ELSE IF holds[h].life = 1 THEN NoHold
                    ELSE [holds[h] EXCEPT !.life = @ - 1]]
    /\ listed' = { h \in listed : holds[h].life # 1 }
'''
new = '''
                    ELSE IF holds[h].life = 1 THEN holds[h]
                    ELSE [holds[h] EXCEPT !.life = @ - 1]]
    /\ listed' = listed
'''

# A partial hand-off's chunks may list no hold at all.
[[LeaseLifecycle.mutants]]
name = "a-partial-hand-off-counts"
violates = "NoOpenHoldOnClosedLease"
old = '''
    /\ lease.state = "draining"
    /\ handoff = "complete"
    /\ listed = {}
'''
new = '''
    /\ lease.state = "draining"
    /\ handoff # "none"
    /\ listed = {}
'''

[[LeaseLifecycle.mutants]]
name = "close-while-a-listed-hold-is-open"
violates = "NoOpenHoldOnClosedLease"
old = '''
    /\ lease.state = "draining"
    /\ handoff = "complete"
    /\ listed = {}
'''
new = '''
    /\ lease.state = "draining"
    /\ handoff = "complete"
'''

[[LeaseLifecycle.mutants]]
name = "list-the-holds-before-stopping"
violates = "NoOpenHoldOnClosedLease"
old = '''
    /\ handoff = "none"
    /\ stopped' = TRUE
    /\ handoff' = "partial"
'''
new = '''
    /\ handoff = "none"
    /\ stopped' = stopped
    /\ handoff' = "partial"
'''

# Two guards that are each idle alone (see their rows in the guard table): a
# process that does not hold the lease may neither stop under it nor publish
# its last record. Together they keep a later process from telling the
# auditor that its predecessor's holds have all ended.
[[LeaseLifecycle.mutants]]
name = "a-later-process-publishes-the-last-record"
violates = "NoOpenHoldOnClosedLease"
old = '''
OwnerStop ==
    /\ has
    /\ ~stopped
    /\ stopped' = TRUE
    /\ UNCHANGED << now, lease, epoch, has, known, answer, holds, handoff,
                    audRead, paused, pausedFor, view, revokedFor, listed >>

\* With no hold open, it publishes a final checkpoint: the lease's last
\* record, which lists the holds still open.
FinalCheckpoint ==
    /\ has
    /\ stopped
'''
new = '''
OwnerStop ==
    /\ ~stopped
    /\ stopped' = TRUE
    /\ UNCHANGED << now, lease, epoch, has, known, answer, holds, handoff,
                    audRead, paused, pausedFor, view, revokedFor, listed >>

\* With no hold open, it publishes a final checkpoint: the lease's last
\* record, which lists the holds still open.
FinalCheckpoint ==
    /\ stopped
'''

[[LeaseLifecycle.mutants]]
name = "a-final-checkpoint-from-an-owner-still-admitting"
violates = "NoOpenHoldOnClosedLease"
old = '''
    /\ has
    /\ stopped
    /\ Own = {}
'''
new = '''
    /\ has
    /\ Own = {}
'''

# A lease moves one way. An owner that did not notice its lease close must
# not mark it draining again, and nor must the auditor on an old read.
[[LeaseLifecycle.mutants]]
name = "the-owner-marks-a-lease-that-has-closed"
violates_property = "LeaseMovesOneWay"
old = '''
    /\ handoff = "complete"
    /\ lease.state = "open"
    /\ lease.epoch = epoch
'''
new = '''
    /\ handoff = "complete"
    /\ lease.epoch = epoch
'''

[[LeaseLifecycle.mutants]]
name = "the-auditor-marks-a-lease-that-has-closed"
violates_property = "LeaseMovesOneWay"
old = '''
    /\ audRead # NoRead
    /\ lease.state = "open"
    /\ lease.expiry = audRead
    /\ lease' = [lease EXCEPT !.state = "draining"]
'''
new = '''
    /\ audRead # NoRead
    /\ lease.expiry = audRead
    /\ lease' = [lease EXCEPT !.state = "draining"]
'''

# A draining lease's expiry does not move. A renewal that arrives when nobody
# is listening is the same conditional write as the owner's.
[[LeaseLifecycle.mutants]]
name = "replay-a-renewal-on-a-draining-lease"
violates_property = "DrainingExpiryStays"
old = '''
    /\ now <= LastRenew
    /\ lease.state = "open"
    /\ ~lease.revoked
    /\ lease.expiry < now + Window
'''
new = '''
    /\ now <= LastRenew
    /\ ~lease.revoked
    /\ lease.expiry < now + Window
'''

# Liveness: a lease whose owner died without a hand-off closes on time alone.

[[LeaseLifecycle.mutants]]
name = "the-auditor-never-closes-on-time"
violates_property = "EventuallyClosed"
old = '''
    /\ \E c \in Readings : c >= lease.expiry + MaxLife + Grace
'''
new = '''
    /\ FALSE
'''

[SurfaceCutover]
state = "implemented"
unswept = "written before the guard table; its mutants are its hand-run notes"
code = [
    "scripts/deploy/public_surface.sh",
    "scripts/deploy/internal_surface.sh",
]
tests = [
    "tests/test_public_surface_deploy.py",
    "tests/test_internal_surface_deploy.py",
]

[[SurfaceCutover.mutants]]
name = "restore-only-the-failing-region"
violates = "NoSplitFleet"
old = '''
    /\ phase = "recover"
    /\ AllOld
'''
new = '''
    /\ phase = "recover"
    /\ (current \in Regions => serving[current] = "Old")
'''

[[SurfaceCutover.mutants]]
name = "forget-a-recovery-still-needed"
violates = "AlwaysRecoverable"
old = '''
    /\ previous[r] # NoRevision
    /\ serving[r] = "Old"
'''
new = '''
    /\ previous[r] # NoRevision
'''

[[SurfaceCutover.mutants]]
name = "promote-without-smoke"
violates = "NoTrafficWithoutSmoke"
old = '''
    /\ phase = "smoke"
    /\ smoked[current]
'''
new = '''
    /\ phase = "smoke"
'''

[[SurfaceCutover.mutants]]
name = "clear-the-marker-with-ingress-open"
violates = "IngressNeverStrandedOpen"
old = '''
    /\ phase = "post-promotion"
    /\ ~ingressOpen[current]
'''
new = '''
    /\ phase = "post-promotion"
'''

[[SurfaceCutover.mutants]]
name = "recovery-cannot-restrict-ingress"
violates_property = "EventuallyConsistent"
old = '''
    /\ ingressOpen[r]
    /\ ingressOpen' = [ingressOpen EXCEPT ![r] = FALSE]
'''
new = '''
    /\ FALSE
    /\ ingressOpen[r]
    /\ ingressOpen' = [ingressOpen EXCEPT ![r] = FALSE]
'''

[TerminalOrder]
# docs/design/fast-admission-and-batched-settlement.md, sections 4.5 and 4.8.
# Its shadow is a package of its own in the Go service, written in the spike
# (section 8). Each planned spec names its own package, so they can become
# implemented one at a time.
state = "planned"
code = ["fastpath/internal/terminalorder"]

# Assumption A1 and the owner's cutoff: no acknowledged owner record falls
# beyond the boundary.

[[TerminalOrder.mutants]]
name = "tick-before-deadline"
violates = "AckedOwnerRecordWithinBoundary"
old = '''
    /\ lease = "draining"
    /\ deadlinePassed
    /\ tickAt' = delivered
'''
new = '''
    /\ lease = "draining"
    /\ tickAt' = delivered
'''

[[TerminalOrder.mutants]]
name = "tick-before-deadline-loses-a-stream"
violates = "NoStreamClosedOver"
old = '''
    /\ lease = "draining"
    /\ deadlinePassed
    /\ tickAt' = delivered
'''
new = '''
    /\ lease = "draining"
    /\ tickAt' = delivered
'''

[[TerminalOrder.mutants]]
name = "ack-after-deadline"
violates = "AckedOwnerRecordWithinBoundary"
old = '''
    /\ ownerUp
    /\ ~(deadlinePassed /\ IssuedBeforeCutoff(acked + 1))
'''
new = '''
    /\ ownerUp
'''

[[TerminalOrder.mutants]]
name = "owner-issues-after-cutoff"
violates = "AckedOwnerRecordWithinBoundary"
old = '''
OwnerActive == ownerUp /\ ~ownerCutoff
'''
new = '''
OwnerActive == ownerUp
'''

# Assumption A2: the archive a rebuild reads is complete up to the tick.

[[TerminalOrder.mutants]]
name = "incomplete-archive"
violates = "AckedOwnerRecordWithinBoundary"
old = '''
    /\ S' \in tickAt..delivered
'''
new = '''
    /\ S' \in 0..delivered
'''

# The other half of A2: an archive is a copy of the log, so a rebuild books
# nothing the log has not received. The boundary's bound is primed, so no
# row of the guard table removes it, and only the order of the counts
# notices.
[[TerminalOrder.mutants]]
name = "an-archive-ahead-of-the-log"
violates = "CountsInOrder"
old = '''
    /\ S' \in tickAt..delivered
'''
new = '''
    /\ S' \in tickAt..Len(outbox)
'''

# The boundary S: stored once, after every record up to it is booked, and
# the drain log is read only after it.

[[TerminalOrder.mutants]]
name = "no-boundary"
violates = "WinnerIsFirstInOrder"
old = '''
    /\ ownerApplied < delivered
    /\ ownerApplied < tickAt
'''
new = '''
    /\ ownerApplied < delivered
'''

# Section 4.8: once S is stored, an owner record above it is ignored. The
# auditor goes on publishing ticks, so without the rule a later tick would
# let it apply a record beyond the boundary it stored.
[[TerminalOrder.mutants]]
name = "apply-a-record-above-the-boundary"
violates = "WinnerIsFirstInOrder"
old = '''
    /\ S = NoS
    /\ ownerApplied < delivered
'''
new = '''
    /\ ownerApplied < delivered
'''

# The auditor books only what the log has received. Removing the guard
# outright only leaves outbox[i] undefined, which hides what it holds up, so
# this keeps the index defined and widens the guard to every record issued.
[[TerminalOrder.mutants]]
name = "book-a-record-the-log-has-not-received"
violates = "WinnerIsFirstInOrder"
old = '''
    /\ S = NoS
    /\ ownerApplied < delivered
'''
new = '''
    /\ S = NoS
    /\ ownerApplied < Len(outbox)
'''

# The owner answers only once its publish is stored. The same widening, for
# Ack: it breaks the order of the counts at once, and the boundary claim a
# few steps later.
[[TerminalOrder.mutants]]
name = "ack-ahead-of-the-log"
violates = "CountsInOrder"
old = '''
    /\ acked < delivered
    /\ ownerUp
'''
new = '''
    /\ acked < Len(outbox)
    /\ ownerUp
'''

[[TerminalOrder.mutants]]
name = "answer-before-the-publish-is-stored"
violates = "AckedOwnerRecordWithinBoundary"
old = '''
    /\ acked < delivered
    /\ ownerUp
'''
new = '''
    /\ acked < Len(outbox)
    /\ ownerUp
'''

[[TerminalOrder.mutants]]
name = "boundary-before-booking"
violates = "WinnerIsFirstInOrder"
old = '''
    /\ S = NoS
    /\ ownerApplied = tickAt
    /\ S' = tickAt
'''
new = '''
    /\ S = NoS
    /\ S' = tickAt
'''

[[TerminalOrder.mutants]]
name = "boundary-moved"
violates = "WinnerIsFirstInOrder"
old = '''
    /\ tickAt # NoTick
    /\ S = NoS
    /\ S' \in tickAt..delivered
'''
new = '''
    /\ tickAt # NoTick
    /\ S' \in tickAt..delivered
'''

[[TerminalOrder.mutants]]
name = "drain-before-boundary"
violates = "WinnerIsFirstInOrder"
old = '''
    /\ S # NoS
    /\ drainApplied < Len(drain)
'''
new = '''
    /\ drainApplied < Len(drain)
'''

[[TerminalOrder.mutants]]
name = "drain-row-overwrites-a-winner"
violates = "WinnerIsFirstInOrder"
old = '''
               IF winner[a] = NoWinner
                   THEN [winner EXCEPT ![a] = [src |-> "drain", idx |-> j]]
'''
new = '''
               IF TRUE
                   THEN [winner EXCEPT ![a] = [src |-> "drain", idx |-> j]]
'''

# Adoption takes the drain log's first row for its authorization.

[[TerminalOrder.mutants]]
name = "adopt-a-later-row"
violates = "AdoptionKeepsTheWinner"
old = '''
    /\ LET j == Min(DrainRows(a))
       IN  outbox' = Append(outbox, Rec(a, drain[j].kind, j))
'''
new = '''
    /\ LET j == CHOOSE x \in DrainRows(a) : \A y \in DrainRows(a) : x >= y
       IN  outbox' = Append(outbox, Rec(a, drain[j].kind, j))
'''

# Close against appends.

[[TerminalOrder.mutants]]
name = "close-without-reading-drain"
violates = "NoAckedDrainRowLost"
old = '''
    /\ S # NoS
    /\ drainApplied = Len(drain)
    /\ \A a \in Auths : HbDurable(a) => winner[a] # NoWinner
'''
new = '''
    /\ S # NoS
    /\ \A a \in Auths : HbDurable(a) => winner[a] # NoWinner
'''

[[TerminalOrder.mutants]]
name = "append-after-close"
violates = "NoAckedDrainRowLost"
old = '''
    /\ lease # "closed"
    /\ Settles(a)
'''
new = '''
    /\ Settles(a)
'''

[[TerminalOrder.mutants]]
name = "append-after-close-leaves-a-row"
violates = "ClosedLeaseHasNoUnappliedRow"
old = '''
    /\ lease # "closed"
    /\ Settles(a)
'''
new = '''
    /\ Settles(a)
'''

[[TerminalOrder.mutants]]
name = "close-before-the-boundary"
violates = "NoStreamClosedOver"
old = '''
    /\ lease = "draining"
    /\ S # NoS
    /\ drainApplied = Len(drain)
    /\ \A a \in Auths : HbDurable(a) => winner[a] # NoWinner
'''
new = '''
    /\ lease = "draining"
    /\ drainApplied = Len(drain)
    /\ \A a \in Auths : HbDurable(a) => winner[a] # NoWinner
'''

[[TerminalOrder.mutants]]
name = "close-over-a-stream"
violates = "NoStreamClosedOver"
old = '''
    /\ drainApplied = Len(drain)
    /\ \A a \in Auths : HbDurable(a) => winner[a] # NoWinner
    /\ lease' = "closed"
'''
new = '''
    /\ drainApplied = Len(drain)
    /\ lease' = "closed"
'''

# The release of a stream's hold before its first heartbeat (section 4.5).

[[TerminalOrder.mutants]]
name = "release-without-durable-check"
violates = "DurableHeartbeatNeverReleased"
old = '''
    /\ allowance[a]
    /\ ~HbIssued(a)
'''
new = '''
    /\ allowance[a]
    /\ ~HbAcked(a)
'''

[[TerminalOrder.mutants]]
name = "release-on-an-undelivered-heartbeat"
violates = "DurableHeartbeatNeverReleased"
old = '''
    /\ allowance[a]
    /\ ~HbIssued(a)
'''
new = '''
    /\ allowance[a]
    /\ ~\E i \in 1..delivered : outbox[i].auth = a /\ outbox[i].kind = "hb"
'''

[[TerminalOrder.mutants]]
name = "heartbeat-for-a-decided-hold"
violates = "DurableHeartbeatNeverReleased"
old = '''
    /\ a \in Streams
    /\ ownerWinner[a] = 0
    /\ ~HbIssued(a)
'''
new = '''
    /\ a \in Streams
    /\ ~HbIssued(a)
'''

[[TerminalOrder.mutants]]
name = "release-without-the-allowance"
violates = "NoLiveRequestReleased"
old = '''
    /\ a \in Declared
    /\ allowance[a]
    /\ ~HbIssued(a)
'''
new = '''
    /\ a \in Declared
    /\ ~HbIssued(a)
'''

# The main configuration has no stream whose boot did not declare the
# stream-open heartbeat. The variant has only that one, so this mutant is
# killed by the stream the declaration exists to protect, not by a request
# that does not stream.
[[TerminalOrder.mutants]]
name = "release-an-undeclared-stream"
cfg = "undeclared"
violates = "NoLiveRequestReleased"
old = '''
    /\ OwnerActive
    /\ a \in Declared
    /\ allowance[a]
'''
new = '''
    /\ OwnerActive
    /\ a \in Streams
    /\ allowance[a]
'''

[[TerminalOrder.mutants]]
name = "release-any-hold"
violates = "NoLiveRequestReleased"
old = '''
    /\ OwnerActive
    /\ a \in Declared
    /\ allowance[a]
'''
new = '''
    /\ OwnerActive
    /\ allowance[a]
'''

# Assumption A3: a declared boot's stream-open heartbeat has resolved by the
# time the allowance elapses.

[[TerminalOrder.mutants]]
name = "allowance-before-heartbeat-resolves"
violates = "NoLiveRequestReleased"
old = '''
    /\ ~allowance[a]
    /\ a \in Declared => (enc[a] # "open" \/ HbIssued(a))
'''
new = '''
    /\ ~allowance[a]
'''

# The owner publishes only the terminal that wins, so a settle it
# acknowledged is the one that is booked.

[[TerminalOrder.mutants]]
name = "owner-publishes-a-loser"
violates = "AckedOwnerTerminalWins"
old = '''
    /\ Settles(a)
    /\ ownerWinner[a] = 0
    /\ outbox' = Append(outbox, Rec(a, "settle", 0))
'''
new = '''
    /\ Settles(a)
    /\ outbox' = Append(outbox, Rec(a, "settle", 0))
'''

# The same deletion also passes TypeOK's bound on the owner's records, which
# is all TypeOK says about it.
[[TerminalOrder.mutants]]
name = "owner-publishes-a-loser-past-the-bound"
violates = "TypeOK"
old = '''
    /\ Settles(a)
    /\ ownerWinner[a] = 0
    /\ outbox' = Append(outbox, Rec(a, "settle", 0))
'''
new = '''
    /\ Settles(a)
    /\ outbox' = Append(outbox, Rec(a, "settle", 0))
'''

[[TerminalOrder.mutants]]
name = "boundary-before-booking-loses-an-acked-settle"
violates = "AckedOwnerTerminalWins"
old = '''
    /\ S = NoS
    /\ ownerApplied = tickAt
    /\ S' = tickAt
'''
new = '''
    /\ S = NoS
    /\ S' = tickAt
'''

# Assumption A4: an enclave that delivered nothing sends no settle.

[[TerminalOrder.mutants]]
name = "a-settle-for-nothing-delivered"
violates = "ReleasedHoldOwesNothing"
old = '''
Settles(a) == enc[a] = "delivered"
'''
new = '''
Settles(a) == TRUE
'''

# Liveness: a lease whose stream never settles closes only because the
# auditor reaps it.

[[TerminalOrder.mutants]]
name = "auditor-never-reaps"
violates_property = "EventuallyClosed"
old = '''
    /\ HbDurable(a)
    /\ winner[a] = NoWinner
    /\ drain' = Append(drain, [auth |-> a, kind |-> "reap"])
'''
new = '''
    /\ FALSE
    /\ HbDurable(a)
    /\ winner[a] = NoWinner
    /\ drain' = Append(drain, [auth |-> a, kind |-> "reap"])
'''

[[TerminalOrder.survivors]]
name = "reap-without-reading-rows"
old = '''
    /\ S # NoS
    /\ drainApplied = Len(drain)
    /\ HbDurable(a)
'''
new = '''
    /\ S # NoS
    /\ ~\E j \in 1..Len(drain) : drain[j].auth = a /\ drain[j].kind = "reap"
    /\ HbDurable(a)
'''

