\* A variant of CreditDebt.cfg: the owner never stores its shortfall itself.
\*
\* Section 5.1: the first claim, HoldsCoveredInSpanner, must not lean on the
\* owner's write, so it is checked here with no write at all. The auditor's
\* raise is then what keeps it (mutant auditor-books-without-the-raise).
\* ShortfallIsBeingWritten says nothing here and is not checked.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 92,987 states generated, 41,731 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    NShards = 2
    Leases = {l1}
    CreditEach = 3
    LeaseSize = 2
    Allowance = 2
    Floor = 0
    Charges = {0, 3}
    Reaps = {0, 1}
    MaxHolds = 2
    MaxSync = 0
    MaxPays = 0
    PaySize = 2
    MaxCuts = 1
    OwnerWrites = FALSE

INVARIANTS
    TypeOK
    OwnerBooksBalance
    HoldsCoveredInSpanner
    StoredCoversOwner
    StoredShortfallWithinOwners
    ShardIdentity
    AllocationAccounted
    BookedOnce
    ExposureWithinAllowance
    DebtMarksEveryShard
    MarkMeansDebt
    CreditConserved

PROPERTIES
    StoredShortfallNeverFalls
    StoredShortfallIsACarriedTotal
    MarkRefusesReservations
    RepaysDebtFirst
