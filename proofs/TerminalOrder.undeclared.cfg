\* A variant of TerminalOrder.cfg: one stream, from a boot that did NOT
\* declare the stream-open heartbeat.
\*
\* Such an enclave sends its first heartbeat only when its provider's first
\* byte arrives, so "no heartbeat by the allowance" does not mean it gave up.
\* Its hold must never be released early. The main configuration has no such
\* stream, so there the declaration check is held up only by the request
\* that does not stream. Here it is held up by the stream it exists for.
\*
\* One authorization and one front-door append: a few thousand states.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Streams = {a1}
    Declared = {}
    Listable = {}
    MaxAppends = 1

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
