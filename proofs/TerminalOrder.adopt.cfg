\* A variant of TerminalOrder.cfg: two requests that do not stream, and two
\* front-door appends.
\*
\* One row each puts a hold's first drain row after another hold's, so an
\* adoption must take its own hold's first row, not the log's. The main
\* configuration appends once, and TerminalOrder.appends.cfg has one
\* authorization; while the owner is active only front doors append, so
\* neither has such a log.
\*
\* Two authorizations and two front-door appends: 692,648 distinct states,
\* which the shadow's comparison reads every one of.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with 8
\* workers on a 16-core Apple M4 Max, OpenJDK 21: 3,229,461 states
\* generated, 692,648 distinct, search depth 22, in 13 seconds. One measured
\* run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1, a2}
    Streams = {}
    Declared = {}
    Listable = {}
    MaxAppends = 2

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
