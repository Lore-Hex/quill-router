\* A variant of TerminalOrder.cfg: one stream, from a boot that declared the
\* stream-open heartbeat, and two front-door appends.
\*
\* Two front doors may each append a terminal for the same authorization,
\* each believing the owner unreachable. Adoption then chooses between two
\* rows, and must take the first. The main configuration appends once.
\*
\* One authorization and two front-door appends: about thirteen thousand
\* states.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Streams = {a1}
    Declared = {a1}
    Listable = {}
    MaxAppends = 2

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
