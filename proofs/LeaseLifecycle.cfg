\* Model-checking configuration for LeaseLifecycle.
\*
\* One lease, granted at time 0 with a window of 3, on one node whose process
\* may restart twice. The lease holds two units and three holds may be open
\* at once, so a second process that used the lease would overfill it. A
\* hold lives two steps, so one admitted in the last step before the cutoff
\* is still open after the expiry: that is the hold a close on time alone
\* has to wait for.
\*
\* WHAT THE BOUNDS LEAVE OUT
\*
\*   Skew = 2. Every clock reads within two steps of the true time, in
\*   either direction, anew at each reading. Two is the least at which the
\*   grace shows: with one, the whole step between "before the expiry" and
\*   "at the expiry" hides it.
\*
\*   Grace = 2 = Skew. The design's grace is longer than twice the skew
\*   allowance (section 4.5), for the reaper's ticks, which this spec does
\*   not have. For the close on time alone this is a stress case: the least
\*   grace the spec assumes (Grace >= Skew). In whole steps the owner's
\*   strict cutoff leaves a step to spare, so this model would also pass a
\*   grace one step shorter. It shows that no grace at all is too little
\*   (mutant close-without-the-grace), not that Grace >= Skew is needed.
\*
\*   MaxLife = 2 = Grace. So the two mutants that each drop one term of the
\*   close on time alone are one model here, with one counterexample. They
\*   are two entries because they are two terms of the design's bound.
\*
\*   LastRenew = 3. Renewals stop after time 3, so the expiry is at most 6
\*   and the model ends at 10, late enough for a lease that nobody finishes
\*   to drain and close. A lease renewed for longer behaves the same, later.
\*
\*   MaxRestarts = 2. One restart is enough for every mutant. The second is
\*   for a process that never held the lease and is replaced in its turn.
\*
\*   One renewal out at a time, and its answer arrives or is lost before
\*   the next is sent.
\*
\*   One lease and one node. Leases interact only through money, which is
\*   CreditDebt's: grants, the trust allowance, returns and what a close
\*   releases. A second owner would hold a lease of its own.
\*
\*   One pause, never lifted, one revocation, one forced exit. A stop that
\*   comes and goes, as the debt mark can, is not run. How long ago the
\*   pause and the revocation were is counted only as far as anything asks.
\*
\*   Nothing here is checked with a CONSTRAINT.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 6 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 3,219,014 states generated, 522,054 distinct, half a minute.
\* (The depth TLC reports, 23 on that run, depends on how its workers
\* interleave.) One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    MaxHolds = 3
    LeaseSize = 2
    Window = 3
    Skew = 2
    MaxLife = 2
    Grace = 2
    CacheAge = 1
    LastRenew = 3
    MaxRestarts = 2

INVARIANTS
    TypeOK
    CutoffBeforeDrain
    AdmittedOnlyUnderOpenLease
    NoOpenHoldOnClosedLease
    HoldsFitAllocation
    SingleWriter
    PauseBoundsAdmission
    RevocationBoundsAdmission

PROPERTIES
    EventuallyClosed
    LeaseMovesOneWay
    DrainingExpiryStays
    RevokedExpiryStays
