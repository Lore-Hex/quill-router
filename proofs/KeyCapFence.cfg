\* Model-checking configuration for KeyCapFence.
\*
\* Two leases, so that one can be granted before the cap is added and the
\* other after. Each owner admits one of the key's requests and publishes
\* up to two checkpoints, so that one can come before its cache sees the
\* change and one after.
\*
\* WHAT THE BOUNDS LEAVE OUT
\*   - A second hold of the key under one lease. With MaxAdmit = 2 the claim
\*     holds as well, over 3,474,805 distinct states in under a minute with
\*     -workers 4; that run is left out of CI for its time.
\*   - A second change to the key.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 747,633 states generated, 206,626 distinct, 1 second.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Leases = {l1, l2}
    MaxAdmit = 1
    MaxCkpt = 2

INVARIANTS
    TypeOK
    CapAfterBooking
