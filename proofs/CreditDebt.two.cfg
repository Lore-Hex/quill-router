\* A variant of CreditDebt.cfg: two leases, each as large as the whole trust
\* allowance, and no cut-off owner.
\*
\* With one lease the trust allowance has nothing to refuse. Here a second
\* grant must be refused while the first lease's holds are open (mutant
\* grant-ignores-the-allowance).
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 441,537 states generated, 157,981 distinct, half a minute.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    NShards = 2
    Leases = {l1, l2}
    CreditEach = 3
    LeaseSize = 1
    Allowance = 1
    Floor = 0
    Charges = {0, 3}
    Reaps = {0, 1}
    MaxHolds = 2
    MaxSync = 0
    MaxPays = 0
    PaySize = 2
    MaxCuts = 0
    OwnerWrites = TRUE

INVARIANTS
    TypeOK
    OwnerBooksBalance
    HoldsCoveredInSpanner
    StoredCoversOwner
    ShortfallIsBeingWritten
    ShardIdentity
    BookedOnce
    ExposureWithinAllowance
    DebtMarksEveryShard
    MarkMeansDebt
    CreditConserved
