\* Model-checking configuration for TerminalOrder.
\*
\* Two authorizations on one lease. a1 is a stream whose boot declared the
\* stream-open heartbeat. a2 is a non-streaming request, which never
\* heartbeats, so the auditor sees its hold only through its terminal. That
\* is the smallest instance with a hold the auditor can reap beside one it
\* cannot see, with one authorization able to win from the owner's records
\* while the other wins from the drain log, and with a release beside a
\* reap.
\*
\* WHAT THE BOUNDS LEAVE OUT
\*
\*   MaxAppends = 2. Front doors append at most two settles to the drain log:
\*   enough for two rows racing for one authorization, or one row each. The
\*   auditor's reaps are not counted against it (at most one per
\*   authorization), so the bound never blocks the lease from closing.
\*
\*   One heartbeat per stream. The spec is about whether a hold has a
\*   durable heartbeat, not about which snapshot is the latest; amounts are
\*   AuditorCommit's and the property tests'.
\*
\*   No stream of a boot that did not declare the stream-open heartbeat.
\*   TerminalOrder.undeclared.cfg has one, alone: three authorizations at
\*   once passed forty million states without finishing.
\*
\*   One owner, one lease, no member change in the auditor. A second owner is
\*   LeaseLifecycle's; redelivery and takeover are AuditorCommit's.
\*
\*   Nothing here is checked with a CONSTRAINT.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers auto on a 16-core Apple M4 Max, OpenJDK 21: 3,450,261 states
\* generated, 674,936 distinct, search depth 27, under a minute. One measured
\* run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1, a2}
    Streams = {a1}
    Declared = {a1}
    MaxAppends = 2

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
