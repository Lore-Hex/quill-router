\* Model-checking configuration for AuditorCommit.
\*
\* One lease, one authorization and two members of the auditor. The owner
\* issues two records, among them up to two heartbeats, and one record may
\* land after the fence tick. Pub/Sub moves the lease to the other member
\* once, and a front door appends one terminal to the drain log.
\*
\* WHAT THE BOUNDS LEAVE OUT, each in a variant of its own:
\*   - a third record, and two authorizations, whose terminals a checkpoint
\*     sums (two);
\*   - the lease coming back to a member that lost it (again);
\*   - an owner that lies, a record stored twice, and a crash (lying);
\*   - a record stored ahead of an earlier one, and a raise of the
\*     allocation (ahead).
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 506,234 states generated, 164,159 distinct, 24 seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Members = {m1, m2}
    MaxSeq = 2
    MaxSnap = 2
    MaxDup = 0
    MaxAhead = 0
    MaxLate = 1
    MaxRaise = 0
    MaxAssign = 1
    MaxCrash = 0
    MaxAppend = 1
    Lying = FALSE
    Grant = 4

INVARIANTS
    TypeOK
    WinnerIsFirst
    BookedIsWinners
    NoRaiseLost
    ReapAtLastSnapshot
    NoChargeLost
    BoundaryIsS
    StoredSFirst
    GapIsReal

PROPERTIES
    AuditsEachCheckpoint
    DrainingLeaseCloses
    FaultReported
