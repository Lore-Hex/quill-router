breaks = "WinnerIsFirst"

[[guard]]
action = "IssueCheckpoint"
text = '''/\ st = "open"'''
breaks = "nothing"
why = '''
A checkpoint is true whenever an honest owner issues it, so the audit passes it. When an owner may still publish is LeaseLifecycle's.
'''

[[guard]]
action = "IssueCheckpoint"
text = '''/\ nextSeq <= MaxSeq'''
breaks = "TypeOK"
why = '''
A bound of the model: the records the owner issues.
'''

[[guard]]
action = "IssueWrongCheckpoint"
text = '''/\ Lying'''
breaks = "nothing"
why = '''
Without the flag every configuration's owner may lie, and the audit alerts exactly when it does, so NoFalseAlert holds. LieCaught is checked in `lying`, where the owner may lie by design and nothing changes.
'''

[[guard]]
action = "IssueWrongCheckpoint"
text = '''/\ st = "open"'''
breaks = "LieCaught"
