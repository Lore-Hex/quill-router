why = '''
The log stores again a record it holds: without the guard, log[i] has no value.
'''

[[guard]]
action = "Raise"
text = '''/\ st # "closed"'''
breaks = "nothing"
why = '''
A raise of a closed lease changes an allocation nothing is booked against any more, and NoRaiseLost counts it like any other. That a front door's append and an owner's write miss a closed lease is CreditDebt's.
'''

[[guard]]
action = "Raise"
text = '''/\ raised < MaxRaise'''
breaks = "TypeOK"
why = '''
A bound of the model: the raises of the allocation.
'''

[[guard]]
action = "MarkDraining"
text = '''/\ st = "open"'''
breaks = "TypeOK"
why = '''
A lease drains once. Without the guard a closed lease drains and closes again, and again, each close advancing the commit version past the bound TypeOK states; no other claim breaks first.
'''

[[guard]]
action = "FrontDoorAppend"
text = '''/\ st = "draining"'''
