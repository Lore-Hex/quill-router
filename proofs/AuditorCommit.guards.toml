[[guard]]
action = "IssueHeartbeat"
text = '''/\ st = "open"'''
breaks = "NoChargeLost"

[[guard]]
action = "IssueHeartbeat"
text = '''/\ nextSeq <= MaxSeq'''
breaks = "TypeOK"
why = '''
A bound of the model: the records the owner issues.
'''

[[guard]]
action = "IssueHeartbeat"
text = '''/\ a \notin ownerDone'''
breaks = "nothing"
why = '''
The owner sends no heartbeat for a hold it has decided. One that did would be ignored by a member that knows the winner. A member that loaded the lease while it was open does not, and would show the hold open again; then the hold is neither reaped, since it has a winner, nor closed over, so the lease never closes. No claim here asks that a lease close, and the rule is the owner's code. Removed with Reap's check that the member has no winner for the hold, the hold shown open again is reaped at an older snapshot than its latest: once the member knows the winner it ignores the hold's later heartbeats (ReapAtLastSnapshot). One of four that a reap at a stale snapshot needs all removed: IssueHeartbeat's check that the hold has no terminal, LoadWinners' check that the lease is not open, Reap's check of the winners and CommitRefused's check of the version. Then a member applies a heartbeat sent after the terminal without knowing the winner, loads the winners while the lease is open and ignores the next heartbeat, and after a commit refused for nothing, a member that loaded while the lease was open reaps at the older snapshot stored (ReapAtLastSnapshot).
'''

[[guard]]
action = "IssueHeartbeat"
text = '''/\ osnap[a] < MaxSnap'''
breaks = "TypeOK"
why = '''
A bound of the model: the heartbeats per hold.
'''

