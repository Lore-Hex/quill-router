reaches = "no new state"
why = '''
A gap is declared only where the log stored a record ahead of one issued before it (GapIsReal), and a member that meets it is held there: records are applied in sequence order, so in the log's order nothing past the gap is applied, skipped or reached. Without this check a member closes, having reached the log's end, which it could do before the flag, and the flag changes nothing else. No new state is reached.
'''

[[guard]]
action = "Close"
text = '''/\ mem[m].S # NoS'''
breaks = "NoChargeLost"

[[guard]]
action = "Close"
text = '''/\ pos[m] = Len(log) + 1'''
breaks = "nothing"
reaches = "new states"
why = '''
A member that knows S has applied every owner record up to it, so what is left in the log is above S, or a duplicate of one at or below it, and is skipped whenever the member gets to it. Closing before skipping them leaves out nothing the close books.
'''

[[guard]]
action = "Close"
text = '''/\ dpos[m] = Len(drain) + 1'''
breaks = "NoChargeLost"

[[guard]]
action = "Close"
text = '''/\ ~mem[m].dirty'''
breaks = "NoChargeLost"

[[guard]]
action = "Close"
text = '''/\ \A a \in Auths : mem[m].holds[a] = NoHold'''
breaks = "NoChargeLost"

[[guard]]
action = "Close"
text = '''/\ ver = mem[m].ver'''
breaks = "nothing"
reaches = "no new state"
why = '''
Close asks that the member has nothing to commit. Its version is stale only if another member that read the same version committed since, and what that member committed it had applied after reading: records, the tick and rows, which this member also applies, from the same start, before it reaches the log's and the drain log's end, as Close asks. They change this member's memory as they changed the other's, so it has something to commit, and no member closes with a stale version. No new state is reached.
'''
