\* A variant of AuditorCommit.cfg: the log stores a record ahead of the one
\* issued before it, the allocation is raised once, and the member crashes
\* once.
\*
\* A record stored ahead shows as a gap in the sequence numbers, and the gap
\* rule stops the lease; applied anyway, the earlier record arrives below
\* the progress and is skipped (mutant gap-ignored). A raise between a
\* member's load and its commit is kept only by arithmetic on the row as
\* the commit reads it (mutant commit-loses-a-raise). One member keeps the
\* instance small.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 1,015,695 states generated, 338,496 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Members = {m1}
    MaxSeq = 3
    MaxSnap = 2
    MaxDup = 0
    MaxAhead = 1
    MaxLate = 0
    MaxRaise = 1
    MaxAssign = 0
    MaxCrash = 1
    MaxAppend = 1
    Lying = FALSE
    Grant = 4

INVARIANTS
    TypeOK
    WinnerIsFirst
    BookedIsWinners
    NoRaiseLost
    ReapAtLastSnapshot
    NoChargeLost
    BoundaryIsS

PROPERTIES
    AuditsEachCheckpoint
    DrainingLeaseCloses
