\* A variant of AuditorCommit.cfg: Pub/Sub moves the lease twice, so it can
\* come back to a member that lost it.
\*
\* That member's memory is older than the row: another member committed in
\* between, and every record it committed is acknowledged, so nothing is
\* redelivered to bring the memory up to date. A reap from that memory
\* charges an older snapshot unless the reap is conditional on the commit
\* version (mutant reap-without-the-version); a refused commit read as done
\* acknowledges records nobody committed (mutant
\* a-refused-commit-read-as-done); and a member refused with nothing to
\* commit must still re-read, or the lease never closes (mutant
\* no-reread-when-clean). Two records and no drain log keep the instance
\* small.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 742,121 states generated, 238,144 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Members = {m1, m2}
    MaxSeq = 2
    MaxSnap = 2
    MaxDup = 0
    MaxAhead = 0
    MaxLate = 0
    MaxRaise = 0
    MaxAssign = 2
    MaxCrash = 0
    MaxAppend = 0
    Lying = FALSE
    Grant = 4

INVARIANTS
    TypeOK
    WinnerIsFirst
    BookedIsWinners
    NoRaiseLost
    ReapAtLastSnapshot
    NoChargeLost
    BoundaryIsS
    StoredSFirst
    GapIsReal

PROPERTIES
    AuditsEachCheckpoint
    DrainingLeaseCloses
