\* Model-checking configuration for RegionalQuotaLease.
\*
\* Bounds chosen so TLC exhausts the state space in a few minutes on an
\* 8-core Apple M2: the four -workers auto runs behind this commit took
\* between 1m26s and 4m06s, and one -workers 2 run took 3m47s. The spread is
\* whatever else the machine was doing, not the search — every run was
\* exactly 5,844,105 states, 1,292,173 distinct, search depth 22. Budget the
\* high end. The bounds still cover the interleavings that matter: two leases
\* against one escrow (the oversubscription shape), two holds each (so a
\* lease can be partly settled and partly reserved when it expires), a long
\* enough clock that a lease can expire while holds are outstanding, and one
\* succession per lease (so a holder from a retired generation can meet its
\* successor).
\*
\* Escrow 4 with HoldAmount 2 means a single lease can be granted the entire
\* escrow, or two leases can split it — both are reachable, which is the point.
\*
\* WHAT THE BOUNDS COST, STATED SO NOBODY HAS TO GUESS
\*
\*   MaxRegrants = 1. A lease ID passes through at most two generations. That
\*   covers the succession hazard itself — one retired holder meeting one
\*   successor — but NOT a chain: nothing here says a hold stamped by
\*   generation 1 cannot be confused with generation 3, and nothing here
\*   exercises retiredSpend accumulating across more than one retirement per
\*   lease (it does accumulate across the two leases, which is why it is a
\*   scalar and not per-lease). Raising it to 2 has not been measured; the
\*   token universe and the regrant counter both widen with it, so expect a
\*   large multiple rather than a small one.
\*
\*   MaxTime = 3. Long enough for grant → expire → sweep → regrant → expire →
\*   sweep, with a tick to spare. A lease cannot be regranted at all once the
\*   clock is exhausted, because Regrant requires expiry > clock, so a shorter
\*   clock would silently delete the succession behaviour rather than bound it.
\*
\*   HoldAmount is a single constant, so every reservation is the same size,
\*   and LeaseAmounts (see the spec) restricts grants to multiples of it, so
\*   no lease ever carries a remainder too small to reserve against. Ragged
\*   amounts are covered by the Python property tests, not here; what this
\*   model is about is the composition, not the arithmetic.
\*
\*   Nothing here is checked with a CONSTRAINT. A state constraint would make
\*   the run finish while quietly turning "no error found" into "no error
\*   found in the part we looked at", and this directory exists to avoid
\*   exactly that. The bounds are small instead, and stated.

SPECIFICATION Spec

CONSTANTS
    Escrow = 4
    MaxLeases = 2
    MaxHolds = 2
    HoldAmount = 2
    MaxTime = 3
    MaxRegrants = 1

\* Declared one by one on purpose: a guard-deletion experiment has to answer
\* WHICH law the guard was holding up, and a bundled conjunction only ever
\* answers "the bundle".
INVARIANTS
    TypeOK
    NoOversubscription
    EscrowConserved
    SpendWithinEscrow
    NoLeaseOverspend
    SpendIsCoveredByCommitment
    ClosedLeaseBooksBalance
    SettlementFitsReservation
    ExclusiveHoldExit
    ReclaimIsBounded
    TokenStampsAreWellFormed

PROPERTIES
    ExpiredLeasesAreEventuallyReclaimed
    TokensNeverGoBackwards
