\* Model-checking configuration for RegionalQuotaLease.
\*
\* Bounds chosen so TLC exhausts the state space in well under a minute in CI
\* while still covering the interleavings that matter: two leases against one
\* escrow (the oversubscription shape), two holds each (so a lease can be
\* partly settled and partly reserved when it expires), and a clock long
\* enough that a lease can expire while holds are outstanding.
\*
\* Escrow 4 with HoldAmount 2 means a single lease can be granted the entire
\* escrow, or two leases can split it — both are reachable, which is the point.

SPECIFICATION Spec

CONSTANTS
    Escrow = 4
    MaxLeases = 2
    MaxHolds = 2
    HoldAmount = 2
    MaxTime = 3

INVARIANT Safety

PROPERTY ExpiredLeasesAreEventuallyReclaimed
