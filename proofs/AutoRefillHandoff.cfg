\* Model-checking configuration for AutoRefillHandoff.
\*
\* NumSettlements = 1 is the smallest bound that contains both reviewed P1
\* traces: both are races between paths for the SAME settlement, not between
\* settlements. MaxDeliveries = 2 permits internal delivery followed by the
\* combined-surface URL-map rollback redelivery. MaxAttempts = 2 permits the
\* inline submission and a control-drain retry. MaxBuckets = 2 lets the pending
\* suppression interval expire across a minute boundary. MaxPaymentIntents = 2
\* makes a double charge representable. MaxCrashes = 1 covers one death while
\* a drain owns or has initiated work.
\*
\* MEASURED RUN: TLC 2.19 with -workers auto on an 8-core Apple M2, 8 GB RAM,
\* Homebrew OpenJDK 26.0.2: 7,965 states generated, 2,680 distinct, search
\* depth 20, 1.33 seconds wall time. This is one measured run, not a runtime
\* promise.
\*
\* WHAT THE BOUNDS COST, STATED SO NOBODY HAS TO GUESS
\*
\*   One settlement covers both same-settlement defects but NOT contention or
\*   scheduling between different settlements/workspaces. Two deliveries cover
\*   internal -> combined rollback once, but NOT rollback oscillation or a
\*   redelivery storm. Two submissions cover one cross-path retry, but NOT a
\*   third attempt or a long decline schedule. Two buckets cover one expiry
\*   boundary, but NOT repeated time-bucket churn. One process death covers a
\*   crash while work is claimed or initiated, but NOT crash-after-crash loops.
\*
\*   Settlement row states include pending, leased, done, and dead for both
\*   combined and internal origins. The model does NOT distinguish lease owners,
\*   lease expiry times, terminal error codes, or the settlement outbox's other
\*   sub-work. Refill amounts, thresholds, fees, webhook credit application,
\*   multiple workspaces, and Stripe key expiration are abstracted away. The
\*   threshold-crossing decision is represented as a fact, not recomputed.
\*
\*   Weak fairness assumes an enabled finite handoff step eventually runs;
\*   permanent scheduler starvation is outside the liveness claim. Nothing is
\*   checked with a CONSTRAINT. The finite constants are the whole bound, and
\*   TLC exhausts every state inside it.

SPECIFICATION Spec

CONSTANTS
    NumSettlements = 1
    MaxDeliveries = 2
    MaxAttempts = 2
    MaxCrashes = 1
    MaxBuckets = 2
    MaxPaymentIntents = 2

\* Declared one by one so each guard-deletion experiment identifies its law.
INVARIANTS
    NoDoubleCharge
    NoSilentDrop
    ChargeOnlyWhereCredentialed

PROPERTIES
    EventuallyCharged
