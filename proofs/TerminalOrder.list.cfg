\* A variant of TerminalOrder.cfg: one request that does not stream, which a
\* forced exit may list in its hand-off.
\*
\* The auditor knows such a hold only from its listing, once the boundary
\* covers it: it never heartbeats. The listing is all that makes the
\* auditor reap it and keeps the lease from closing over it. The main
\* configuration lists nothing; with a2 listable there it passes 1.7
\* million states with no front-door append at all.
\*
\* One authorization and one front-door append: about eleven thousand
\* states.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Streams = {}
    Declared = {}
    Listable = {a1}
    MaxAppends = 1

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    NoListedHoldClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
