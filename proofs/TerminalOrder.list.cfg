\* A variant of TerminalOrder.cfg: one request that does not stream, which a
\* forced exit's hand-off may name.
\*
\* The auditor knows such a hold only from the hand-off its commit stored
\* (Listed): it never heartbeats. The listing is all that lets the auditor
\* reap it and makes the close wait for it. The main configuration lists
\* nothing.
\*
\* One authorization and one front-door append: a few thousand states.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Streams = {}
    Declared = {}
    Listable = {a1}
    MaxAppends = 1

INVARIANTS
    TypeOK
    CountsInOrder
    WinnerIsFirstInOrder
    AdoptionKeepsTheWinner
    AckedOwnerRecordWithinBoundary
    AckedOwnerTerminalWins
    NoAckedDrainRowLost
    NoStreamClosedOver
    NoDeliveredStreamClosedOver
    NoListedHoldClosedOver
    DurableHeartbeatNeverReleased
    NoLiveRequestReleased
    ReleasedHoldOwesNothing
    RefundOnlyWhenNothingDelivered
    ClosedLeaseHasNoUnappliedRow

PROPERTIES
    EventuallyClosed
