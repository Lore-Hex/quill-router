\* A variant of AuditorCommit.cfg: an owner that may issue a wrong
\* checkpoint, a record the log stores twice, and a member that crashes.
\*
\* AuditsEachCheckpoint needs a lie to catch, and the audit has to count a
\* record stored twice once (mutant audit-counts-a-duplicate) and carry its
\* sum across a crash (mutant audit-sum-not-stored). A wrong checkpoint that
\* lands after the fence tick is above S, and raises nothing. One member
\* keeps the instance small: the crash is its takeover.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 490,512 states generated, 191,757 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1}
    Members = {m1}
    MaxSeq = 2
    MaxSnap = 1
    MaxDup = 1
    MaxAhead = 0
    MaxLate = 1
    MaxRaise = 0
    MaxAssign = 0
    MaxCrash = 1
    MaxAppend = 0
    Lying = TRUE
    Grant = 4

INVARIANTS
    TypeOK
    WinnerIsFirst
    BookedIsWinners
    NoRaiseLost
    ReapAtLastSnapshot
    NoChargeLost
    BoundaryIsS

PROPERTIES
    AuditsEachCheckpoint
    DrainingLeaseCloses
