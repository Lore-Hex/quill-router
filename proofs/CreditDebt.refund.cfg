\* A variant of CreditDebt.cfg: three holds under a lease of two, and every
\* terminal a refund.
\*
\* Section 4.2: room a terminal frees comes back only once its record is
\* stored. A refund that is decided and not stored may never be, and an
\* owner that admitted against its room would have three holds the log
\* counts as open under a lease of two (mutant
\* admit-against-unacknowledged-room). That needs a third hold, which the
\* main configuration's bounds leave out.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 11,943 states generated, 5,605 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    NShards = 2
    Leases = {l1}
    CreditEach = 3
    LeaseSize = 2
    Allowance = 2
    Floor = 0
    Charges = {0}
    Reaps = {0}
    MaxHolds = 3
    MaxSync = 0
    MaxPays = 0
    PaySize = 2
    MaxCuts = 0
    OwnerWrites = TRUE

INVARIANTS
    TypeOK
    OwnerBooksBalance
    HoldsCoveredInSpanner
    StoredCoversOwner
    StoredShortfallWithinOwners
    ShortfallIsBeingWritten
    ShortfallLandsWithinTwoWrites
    ShardIdentity
    AllocationAccounted
    BookedOnce
    ExposureWithinAllowance
    DebtMarksEveryShard
    MarkMeansDebt
    CreditConserved

PROPERTIES
    StoredShortfallNeverFalls
    StoredShortfallIsACarriedTotal
    MarkRefusesReservations
    RepaysDebtFirst
