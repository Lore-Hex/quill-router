# Every guard of every action, and what breaks when it alone is removed.
# Written by proofs/guard_sweep.py. Each `why` is written by hand and kept.

inputs_sha256 = "df401a8a0c4e9f6f69b84c3e04f5c60ec41a04fc555a9bdad9abc2ff499bbc22"

[[guard]]
action = "OwnerRenew"
text = '''/\ now <= LastRenew'''
breaks = "TypeOK"
why = '''
LastRenew is a bound of the model: renewals stop so that the lease can close inside it. A later one writes an expiry beyond MaxExpiry.
'''

[[guard]]
action = "OwnerRenew"
text = '''/\ answer = NoAnswer'''
breaks = "nothing"
why = '''
One renewal out at a time is a bound of the model. Without it a second write replaces the answer still on its way, which is that answer lost, so it reaches no new state.
'''

[[guard]]
action = "OwnerRenew"
text = '''/\ lease.state = "open"'''
breaks = "CutoffBeforeDrain"

[[guard]]
action = "OwnerRenew"
text = '''/\ ~lease.revoked'''
breaks = "RevocationBoundsAdmission"

[[guard]]
action = "OwnerRenew"
text = '''/\ lease.epoch = epoch'''
breaks = "nothing"
why = '''
Without it a later process on the node renews a lease it does not hold. It learns nothing from the answer (RenewAnswer asks for `has`), so the lease lives a window longer and no claim notices. The condition is Spanner's second check of A4, for a process that held a lease it was not granted, which no behavior here has. Removed with RenewAnswer's `has` and Admit's `has`, a later process renews the lease, takes the answer and admits under it (SingleWriter): A4 widened, as in the mutant a-later-process-takes-up-the-lease.
'''

[[guard]]
action = "RenewAnswer"
text = '''/\ answer # NoAnswer'''
breaks = "CutoffBeforeDrain"

[[guard]]
action = "RenewAnswer"
text = '''/\ has'''
breaks = "nothing"
why = '''
By itself the answer only sets `known`, and a process that has let the lease go could have had the answer first: the two orders reach the same states. What the condition stands for is A4, that an answer never brings a lease back, and the mutant an-answer-brings-the-lease-back shows what rests on that. Removed with OwnerRenew's epoch and Admit's `has`, a later process takes an answer to its own renewal and admits (SingleWriter).
'''

[[guard]]
action = "AnswerLost"
text = '''/\ answer # NoAnswer'''
breaks = "nothing"
why = '''
With no answer on its way the action changes nothing.
'''

[[guard]]
action = "ReplayedRenew"
text = '''/\ now <= LastRenew'''
breaks = "TypeOK"
why = '''
LastRenew is a bound of the model, as for OwnerRenew: a later replay writes an expiry beyond MaxExpiry.
'''

[[guard]]
action = "ReplayedRenew"
text = '''/\ lease.state = "open"'''
breaks = "DrainingExpiryStays"

[[guard]]
action = "ReplayedRenew"
text = '''/\ ~lease.revoked'''
breaks = "RevokedExpiryStays"

[[guard]]
action = "ReplayedRenew"
text = '''/\ lease.expiry < now + Window'''
breaks = "nothing"
why = '''
A replay that would not move the expiry changes nothing. The condition keeps it from being a step.
'''

[[guard]]
action = "Revoke"
text = '''/\ ~lease.revoked'''
breaks = "nothing"
why = '''
A second revocation starts the count of the window again, and reaches only states a first revocation at that moment reaches. RevocationBoundsAdmission would then count from the later one, so it says less; the expiry still cannot move after the first, which RevokedExpiryStays checks.
'''

[[guard]]
action = "Pause"
text = '''/\ ~paused'''
breaks = "nothing"
why = '''
One pause is a bound of the model. A second would start the count of its age again, and PauseBoundsAdmission would then measure from the later one.
'''

[[guard]]
action = "RefreshView"
text = '''/\ paused'''
breaks = "nothing"
why = '''
Without it a process sees a pause that has not happened and stops admitting: fewer admissions, never more.
'''

[[guard]]
action = "RefreshView"
text = '''/\ ~view.paused'''
breaks = "nothing"
why = '''
A process that has seen the pause and looks again sees it again, as it would have by looking later the first time.
'''

[[guard]]
action = "Admit"
text = '''/\ has'''
breaks = "nothing"
why = '''
A process without the lease in memory has just started and knows no expiry, or has marked the lease draining and is stopped, or dropped it. A dropped lease was not open, and its owner past its cutoff (CutoffBeforeDrain), or it was revoked, and the same admission a moment before the drop was allowed. So this reaches no new state alone: it is the second of two defenses. Removed with OwnerDrains' `handoff = "complete"`, an owner that marked its lease draining before it stopped goes on admitting under it (AdmittedOnlyUnderOpenLease). Removed with OwnerRenew's epoch and RenewAnswer's `has`, a later process admits (SingleWriter).
'''

[[guard]]
action = "Admit"
text = '''/\ ~stopped'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "Admit"
text = '''/\ Open # HoldIds'''
breaks = "nothing"
why = '''
MaxHolds is above LeaseSize, and only one process ever admits, so a slot is always free. It keeps `Min` defined when a second process admits, in the mutants that widen A4.
'''

[[guard]]
action = "Admit"
text = '''/\ Cardinality(Own) < LeaseSize'''
breaks = "HoldsFitAllocation"

[[guard]]
action = "Admit"
text = '''/\ WithinCutoff'''
breaks = "RevocationBoundsAdmission"

[[guard]]
action = "Admit"
text = '''/\ ~view.paused'''
breaks = "PauseBoundsAdmission"

[[guard]]
action = "Admit"
text = '''/\ view.age <= CacheAge'''
breaks = "PauseBoundsAdmission"

[[guard]]
action = "HoldEnds"
text = '''/\ holds[h].open'''
breaks = "nothing"
why = '''
Ending a hold that is not open changes nothing.
'''

[[guard]]
action = "OwnerStop"
text = '''/\ has'''
breaks = "nothing"
why = '''
`stopped` is read only of a process that holds the lease: by Admit, and by FinalCheckpoint, which asks for `has` itself. Removed with FinalCheckpoint's `has`, a later process stops and publishes the lease's last record, which lists none of its predecessor's holds, and the lease closes over them: mutant a-later-process-publishes-the-last-record.
'''

[[guard]]
action = "OwnerStop"
text = '''/\ ~stopped'''
breaks = "nothing"
why = '''
Stopping twice changes nothing.
'''

[[guard]]
action = "FinalCheckpoint"
text = '''/\ has'''
breaks = "nothing"
why = '''
A stopped process that has let the lease go could have published its last record first: the two orders reach the same states. A process that has just started is not stopped, and cannot stop without the lease. Removed with OwnerStop's `has`, it can: mutant a-later-process-publishes-the-last-record. Removed with ForcedExitStart's `has`, it can by starting a hand-off.
'''

[[guard]]
action = "FinalCheckpoint"
text = '''/\ stopped'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "FinalCheckpoint"
text = '''/\ Own = {}'''
breaks = "nothing"
why = '''
The record lists the holds still open, so one published early is a complete hand-off of them, which a forced exit's manifest also gives. The design's rule, to publish it once none is open, is not what keeps a close from coming over an open hold: the list is.
'''

[[guard]]
action = "ForcedExitStart"
text = '''/\ has'''
breaks = "nothing"
why = '''
Chunks from a process that does not hold the lease are a partial hand-off, which counts for nothing until its manifest, and only a process that holds the lease publishes one (ForcedExitManifest). Removed with FinalCheckpoint's `has`, a later process starts a hand-off, which stops it, then publishes a last record that lists none of its predecessor's holds, and the lease closes over them (NoOpenHoldOnClosedLease).
'''

[[guard]]
action = "ForcedExitStart"
text = '''/\ handoff = "none"'''
breaks = "nothing"
why = '''
Starting again makes a complete hand-off partial until its manifest, so a close on the list waits longer, never less. A real auditor does not forget a manifest it has: this is the model's one variable for the hand-off.
'''

[[guard]]
action = "ForcedExitManifest"
text = '''/\ has'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "ForcedExitManifest"
text = '''/\ handoff = "partial"'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "OwnerDrains"
text = '''/\ has'''
breaks = "nothing"
why = '''
A process that let the lease go after its last record could have marked it draining first: the two orders reach the same states.
'''

[[guard]]
action = "OwnerDrains"
text = '''/\ handoff = "complete"'''
breaks = "nothing"
why = '''
Marking a lease draining without its last record is safe by itself: the close then waits on time alone, and the owner, which lets the lease go, admits nothing more. The record is what lets the close come sooner. Removed with Admit's `has`, an owner that has not stopped marks its lease draining and goes on admitting under it (AdmittedOnlyUnderOpenLease).
'''

[[guard]]
action = "OwnerDrains"
text = '''/\ lease.state = "open"'''
breaks = "LeaseMovesOneWay"

[[guard]]
action = "OwnerDrains"
text = '''/\ lease.epoch = epoch'''
breaks = "nothing"
why = '''
A process that holds the lease is the one it was granted to (A4), so this never refuses. It is Spanner's second check of A4.
'''

[[guard]]
action = "OwnerDrops"
text = '''/\ has'''
breaks = "nothing"
why = '''
Letting go of a lease it does not hold changes nothing.
'''

[[guard]]
action = "OwnerDrops"
text = '''/\ lease.state # "open" \/ lease.revoked'''
breaks = "nothing"
why = '''
Letting go of a lease that is open and not revoked is safe: the auditor finishes it on time alone. The condition is when the design has the owner do it.
'''

[[guard]]
action = "Restart"
text = '''/\ epoch < MaxRestarts'''
breaks = "TypeOK"
why = '''
MaxRestarts is a bound of the model.
'''

[[guard]]
action = "AuditorRead"
text = '''/\ lease.state = "open"'''
breaks = "nothing"
why = '''
A read of a lease that is not open leads to a write that changes no row (AuditorMarkRefused).
'''

[[guard]]
action = "AuditorRead"
text = '''/\ audRead = NoRead'''
breaks = "nothing"
why = '''
Reading again before the write replaces the expiry read by the lease's expiry now, which is what a refused write and a new read give.
'''

[[guard]]
action = "AuditorRead"
text = '''/\ \E c \in Readings : c >= lease.expiry + Skew'''
breaks = "CutoffBeforeDrain"

[[guard]]
action = "AuditorMark"
text = '''/\ audRead # NoRead'''
breaks = "nothing"
why = '''
NoRead is no lease's expiry, so with no read outstanding the condition on the expiry read fails by itself.
'''

[[guard]]
action = "AuditorMark"
text = '''/\ lease.state = "open"'''
breaks = "LeaseMovesOneWay"

[[guard]]
action = "AuditorMark"
text = '''/\ lease.expiry = audRead'''
breaks = "CutoffBeforeDrain"

[[guard]]
action = "AuditorMarkRefused"
text = '''/\ audRead # NoRead'''
breaks = "nothing"
why = '''
With no read outstanding the action changes nothing.
'''

[[guard]]
action = "AuditorMarkRefused"
text = '''/\ lease.state # "open" \/ lease.expiry # audRead'''
breaks = "EventuallyClosed"

[[guard]]
action = "CloseOnTheList"
text = '''/\ lease.state = "draining"'''
breaks = "CutoffBeforeDrain"

[[guard]]
action = "CloseOnTheList"
text = '''/\ handoff = "complete"'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "CloseOnTheList"
text = '''/\ listed = {}'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "CloseOnTime"
text = '''/\ lease.state = "draining"'''
breaks = "LeaseMovesOneWay"

[[guard]]
action = "CloseOnTime"
text = '''/\ \E c \in Readings : c >= lease.expiry + MaxLife + Grace'''
breaks = "NoOpenHoldOnClosedLease"

[[guard]]
action = "Tick"
text = '''/\ now < MaxTime'''
breaks = "TypeOK"
why = '''
MaxTime is a bound of the model, late enough for the lease to close on time alone.
'''
