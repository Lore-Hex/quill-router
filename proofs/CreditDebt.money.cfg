\* A variant of CreditDebt.cfg: one hold, two synchronous reservations and
\* one payment of one unit.
\*
\* Python's synchronous path and a payment write the credit rows as a lease's
\* booking does. A synchronous settle that overruns must mark every row, and a
\* payment that repays the debt must clear the marks (mutants
\* settle-leaves-a-shard-negative and a-payment-leaves-the-mark). The second
\* reservation can meet a marked row, which must refuse it (mutant
\* a-reservation-on-a-marked-row), and a payment of one unit can leave the
\* workspace in debt, so it must go to the negative shards first (mutant
\* a-payment-not-to-the-debt).
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 1,281,089 states generated, 309,212 distinct, a quarter of a minute.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    NShards = 2
    Leases = {l1}
    CreditEach = 3
    LeaseSize = 2
    Allowance = 2
    Floor = 0
    Charges = {0, 3}
    Reaps = {0, 1}
    MaxHolds = 1
    MaxSync = 2
    MaxPays = 1
    PaySize = 1
    MaxCuts = 1
    OwnerWrites = TRUE

INVARIANTS
    TypeOK
    OwnerBooksBalance
    HoldsCoveredInSpanner
    StoredCoversOwner
    StoredShortfallWithinOwners
    ShortfallIsBeingWritten
    ShortfallLandsWithinTwoWrites
    ShardIdentity
    AllocationAccounted
    BookedOnce
    UsageIsBooked
    ExposureWithinAllowance
    DebtMarksEveryShard
    MarkMeansDebt
    CreditConserved

PROPERTIES
    StoredShortfallNeverFalls
    StoredShortfallIsTheLarger
    ShortfallIsTheDeficit
    MarkRefusesReservations
    RepaysDebtFirst
