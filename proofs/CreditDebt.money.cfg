\* A variant of CreditDebt.cfg: one hold, one synchronous reservation and
\* one payment.
\*
\* Python's synchronous path and a payment write the credit rows as a lease's
\* booking does. A synchronous settle that overruns must mark every row, and a
\* payment that repays the debt must clear the marks (mutants
\* settle-leaves-a-shard-negative and a-payment-leaves-the-mark).
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 294,421 states generated, 78,530 distinct, under half a minute.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    NShards = 2
    Leases = {l1}
    CreditEach = 3
    LeaseSize = 2
    Allowance = 2
    Floor = 0
    Charges = {0, 3}
    Reaps = {0, 1}
    MaxHolds = 1
    MaxSync = 1
    MaxPays = 1
    PaySize = 2
    MaxCuts = 1
    OwnerWrites = TRUE

INVARIANTS
    TypeOK
    OwnerBooksBalance
    HoldsCoveredInSpanner
    StoredCoversOwner
    ShortfallIsBeingWritten
    ShardIdentity
    BookedOnce
    ExposureWithinAllowance
    DebtMarksEveryShard
    MarkMeansDebt
    CreditConserved
