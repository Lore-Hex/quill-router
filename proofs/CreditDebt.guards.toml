Sealing empties `out`, and only the owner of an open lease appends to it, while a sealed lease is draining. Removed with the open-lease check of OwnerSettle, OwnerAdopt or OwnerReturn, a record decided after the boundary is stored past it, which the boundary exists to stop (HoldsCoveredInSpanner).
'''

