[[guard]]
action = "Grant"
text = '''/\ st[l] = "none"'''
breaks = "OwnerBooksBalance"

[[guard]]
action = "Grant"
text = '''/\ \A t \in Shards : ~mark[t]'''
breaks = "nothing"
why = '''
Rows are marked only while the workspace's signed sum is negative (MarkMeansDebt), and the grant asks that the sum less the lease be at least the floor. A marked workspace never passes that.
'''

[[guard]]
action = "Grant"
text = '''/\ Exposure + LeaseSize <= Allowance'''
breaks = "ExposureWithinAllowance"
cfg = "two"

[[guard]]
action = "Grant"
text = '''/\ Total(RoomNow) - LeaseSize >= Floor'''
breaks = "nothing"
why = '''
The floor keeps the debt mark rare (section 4.7); no claim rests on it. Every configuration has Floor = 0, where it follows from the donor's room: covering leaves no shard negative while the sum is not, and a negative sum marks every row, which the grant's mark check refuses.
'''

[[guard]]
action = "Grant"
text = '''/\ RoomNow[s] >= LeaseSize'''
breaks = "DebtMarksEveryShard"
cfg = "money"

[[guard]]
action = "Admit"
text = '''/\ st[l] = "open"'''
breaks = "nothing"
why = '''
That an owner admits only under an open lease is LeaseLifecycle's (AdmittedOnlyUnderOpenLease). In money a hold admitted under a draining lease is held against the same allocation, and ends at a terminal or a reap like any other. Removed with Admit's check that the owner is reachable, a process that has died admits after its lease is sealed: a hold the boundary has passed, which nothing covers (HoldsCoveredInSpanner; mutant a-dead-owner-admits-after-the-boundary). Removed with AuditorReap's Live(l), an owner admits under a closed lease and the auditor reaps the hold, booking against a lease that no longer reserves anything (ShardIdentity).
'''

[[guard]]
action = "Admit"
text = '''/\ oUp[l] = "up"'''
breaks = "nothing"
why = '''
An owner cut off from Spanner and the front doors that admits holds them against its own allocation, which covers them. When it may still admit is LeaseLifecycle's cutoff. Removed with Admit's check that the lease is open, a process that has died admits after its lease is sealed (HoldsCoveredInSpanner; mutant a-dead-owner-admits-after-the-boundary).
'''

[[guard]]
action = "Admit"
text = '''/\ \A g \in Mine(l) : ~(hold[g].row = "row" /\ hold[g].own = "none")'''
breaks = "nothing"
why = '''
Adopting a row never lowers the owner's free room, since its raise covers its charge above the hold. So a hold admitted before an adoption can be admitted after it, and the two orders reach the same states.
'''

[[guard]]
action = "Admit"
text = '''/\ ~oStop[l]'''
breaks = "nothing"
why = '''
An owner that has returned its free room and admits again admits only against room that came free since, as Free(l) asks. Stopping is for the lease's end, not its money.
'''

[[guard]]
action = "Admit"
text = '''/\ Free(l) >= 1'''
breaks = "OwnerBooksBalance"

[[guard]]
action = "Admit"
text = '''/\ hold[h].lease = NoLease'''
breaks = "HoldsCoveredInSpanner"

[[guard]]
action = "Admit"
text = '''/\ \A g \in Holds : hold[g].lease = NoLease => h <= g'''
breaks = "nothing"
why = '''
Which free slot a hold takes is the model's naming. Without it a hold takes any free slot: the same behaviours under another numbering.
'''

[[guard]]
action = "OwnerSettle"
text = '''/\ st[l] = "open"'''
breaks = "nothing"
why = '''
Which terminal wins, and when an owner may still decide, publish or be routed to, is TerminalOrder's and LeaseLifecycle's. In money a terminal decided on a draining lease is a terminal: stored and booked, or lost at the boundary and the hold reaped, at most its hold. Removed with Store's check that the lease is not sealed, a terminal decided after the boundary is stored past it, and the lease counts the hold twice, once reaped (HoldsCoveredInSpanner).
'''

[[guard]]
action = "OwnerSettle"
text = '''/\ oUp[l] = "up"'''
breaks = "nothing"
why = '''
Which terminal wins, and when an owner may still decide, publish or be routed to, is TerminalOrder's and LeaseLifecycle's. In money a cut-off owner's terminal is booked if its record is stored, and is lost at the boundary otherwise.
'''

[[guard]]
action = "OwnerSettle"
text = '''/\ \A g \in Mine(l) : ~(hold[g].row = "row" /\ hold[g].own = "none")'''
breaks = "nothing"
why = '''
A hold with a drain row that its owner settles itself has two terminals. The owner's stored record wins and the row loses (BookedOnce); the row's raise stays reserved until close releases it, which errs toward holding more.
'''

[[guard]]
action = "OwnerSettle"
text = '''/\ h \in Mine(l)'''
breaks = "HoldsCoveredInSpanner"

[[guard]]
action = "OwnerSettle"
text = '''/\ hold[h].own = "none"'''
breaks = "OwnerBooksBalance"

[[guard]]
action = "OwnerAdopt"
text = '''/\ st[l] = "open"'''
breaks = "nothing"
why = '''
Which terminal wins, and when an owner may still decide, publish or be routed to, is TerminalOrder's and LeaseLifecycle's. An adoption on a draining lease is a terminal with its row's raise already reserved. Removed with Store's check that the lease is not sealed, a terminal adopted after the boundary is stored past it (HoldsCoveredInSpanner).
'''

[[guard]]
action = "OwnerAdopt"
text = '''/\ oUp[l] = "up"'''
breaks = "nothing"
why = '''
Which terminal wins, and when an owner may still decide, publish or be routed to, is TerminalOrder's and LeaseLifecycle's. A cut-off owner that adopts a row decides the terminal the row carries, with its raise already reserved.
'''

[[guard]]
action = "OwnerAdopt"
text = '''/\ h \in Mine(l)'''
breaks = "StoredCoversOwner"
cfg = "two"

[[guard]]
action = "OwnerAdopt"
text = '''/\ hold[h].own = "none"'''
breaks = "StoredCoversOwner"

[[guard]]
action = "OwnerAdopt"
text = '''/\ hold[h].row = "row"'''
breaks = "nothing"
why = '''
Without a row the charge it adopts is 0, and adopting is the owner settling the hold at 0, which OwnerSettle does.
'''

[[guard]]
action = "OwnerReturn"
text = '''/\ st[l] = "open"'''
breaks = "nothing"
why = '''
A return gives back room the owner does not need. On a draining lease the auditor applies it while the lease is live, and close releases what is left either way. Removed with Store's check that the lease is not sealed, a return made after the boundary is stored past it (HoldsCoveredInSpanner).
'''

[[guard]]
action = "OwnerReturn"
text = '''/\ oUp[l] = "up"'''
breaks = "nothing"
why = '''
A cut-off owner's return is a record like its others: applied if stored, ignored after the boundary, and close releases the room either way.
'''

[[guard]]
action = "OwnerReturn"
text = '''/\ \A g \in Mine(l) : ~(hold[g].row = "row" /\ hold[g].own = "none")'''
breaks = "nothing"
why = '''
A return before an adoption gives back less: Free(l) still counts the undecided hold.
'''

[[guard]]
action = "OwnerReturn"
text = '''/\ Free(l) > 0'''
breaks = "StoredCoversOwner"

[[guard]]
action = "OwnerFinish"
text = '''/\ st[l] = "open"'''
breaks = "StoredCoversOwner"

[[guard]]
action = "OwnerFinish"
text = '''/\ oUp[l] = "up"'''
breaks = "nothing"
why = '''
When a lease drains is LeaseLifecycle's. Here a lease may drain at any moment, and money holds either way.
'''

[[guard]]
action = "OwnerFinish"
text = '''/\ \A g \in Mine(l) : ~(hold[g].row = "row" /\ hold[g].own = "none")'''
breaks = "nothing"
why = '''
OHeld(l) = 0 says no hold is undecided, so none has a row waiting to be adopted.
'''

[[guard]]
action = "OwnerFinish"
text = '''/\ OHeld(l) = 0'''
breaks = "nothing"
why = '''
Finishing with holds open is a drain like any other: the boundary drops unstored records and the auditor reaps what has no terminal, at most its hold (assumption A2).
'''

[[guard]]
action = "OwnerFinish"
text = '''/\ out[l] = << >>'''
breaks = "nothing"
why = '''
Finishing with records unstored is a drain like any other: the boundary drops them, and their holds are reaped at most their hold.
'''

[[guard]]
action = "OwnerWriteLands"
text = '''/\ write[l] # NoWrite'''
breaks = "nothing"
