[[guard]]
action = "Close"
text = '''/\ sealed[l]'''
breaks = "nothing"
why = '''
Close asks that every hold has a booked terminal and no row is left. A record still unstored then is a return or a terminal of a hold already booked, and is never applied to a closed lease. Removed with AuditorApply's Live(l), the auditor applies a record stored before the close to the closed lease (ShardIdentity).
'''

[[guard]]
action = "Close"
text = '''/\ st[l] = "draining"'''
breaks = "nothing"
why = '''
Only a draining lease is sealed, and a sealed lease is draining until it closes. Closing it again releases nothing, since its remaining allocation is zero.
'''

[[guard]]
action = "Close"
text = '''/\ \A h \in Mine(l) : Applied(h) /\ hold[h].row # "row"'''
breaks = "nothing"
why = '''
That a close waits for every hold's terminal is Invariant 4, which TerminalOrder and LeaseLifecycle check (NoAckedDrainRowLost, NoOpenHoldOnClosedLease). In money a hold closed over is a charge never booked: the customer pays less, and no claim here counts what a closed lease no longer holds. Removed with the Live(l) of FrontDoorAppend, AuditorApplyRow or AuditorReap, a lease closes over an open hold, and a row, a booked row or a reap then lands on the closed lease (ShardIdentity).
'''

