\* A variant of AuditorCommit.cfg: two authorizations.
\*
\* A checkpoint's `consumed` sums every terminal the owner issued before it.
\* With one authorization there is one terminal, and an audit that kept only
\* the last terminal's charge would pass (mutant
\* audit-keeps-only-the-last-terminal). One member, one heartbeat per hold
\* and no drain log keep the instance small; one record may land after the
\* fence tick.
\*
\* MEASURED RUN: the v1.8.0 tla2tools.jar as built on 2026-10-04, with
\* -workers 4 on a 16-core Apple M4 Max that was doing other work,
\* OpenJDK 21: 241,066 states generated, 111,596 distinct, seconds.
\* One measured run, not a runtime promise.

SPECIFICATION Spec

CONSTANTS
    Auths = {a1, a2}
    Members = {m1}
    MaxSeq = 3
    MaxSnap = 1
    MaxDup = 0
    MaxAhead = 0
    MaxLate = 1
    MaxRaise = 0
    MaxAssign = 0
    MaxCrash = 0
    MaxAppend = 0
    Lying = FALSE
    Grant = 4

INVARIANTS
    TypeOK
    WinnerIsFirst
    BookedIsWinners
    NoRaiseLost
    ReapAtLastSnapshot
    NoChargeLost
    BoundaryIsS
    StoredSFirst
    GapIsReal

PROPERTIES
    AuditsEachCheckpoint
    DrainingLeaseCloses
